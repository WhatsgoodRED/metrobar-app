<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tap the Bar · MetroBar</title>
<!-- MetroBar (Bennie 2026-11-22 "replace Pocket Aim"): Tap the Bar in the Flow Game dialog's second tab. Fonts self-hosted (fonts/fonts.css), beats in jc/, his record in songs/.
     Circles (Bennie 2026-11-22): the white inner ring sits just inside the edge (thin blue rim), its left edge is the tap moment on the line,
     the word starts on that edge, the sound bites point inward, and a starred word in a song is a blue circle. -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* One long lyric track that slides under a fixed playhead. The words are the notes; the whole screen is the one button. */
:root { --bg: #000; --fg: #f2f3ef; --muted: #8b918c; --line: #2b2f2d; --card: #0f1110; --ink: #15181a;
  --syl: #0000AF; --hit: #03FF64; --hitText: #03FF64; --sylText: #7d87ff; --landText: #ff4d42; --good: #d9a62e; --ok: #e07b39; --land: #af0000; --beat: #c9a24a; --cell: #a85a2a; --strip: #f2c94c;
  --display: "Big Shoulders Display", Impact, sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 400 16px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
body { overflow: hidden; }
.app { height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto auto auto auto auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); width: 100%; padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); user-select: none; -webkit-user-select: none; touch-action: manipulation; }

/* origin buttons: the fill grows from where the pointer touched */
.ob { --ob-fill: var(--fg); --x: 50%; --y: 50%; --r: 0px; position: relative; overflow: hidden; border: 1.5px solid var(--line); background: var(--card); color: var(--fg); border-radius: 12px; height: 44px; padding: 0 16px; font: 600 15px var(--body); letter-spacing: -.01em; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; flex: 0 0 auto; transition: transform .15s; }
.ob .ob-f { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--ob-fill); color: #000; clip-path: circle(0px at var(--x) var(--y)); transition: clip-path .5s cubic-bezier(.16,1,.3,1); pointer-events: none; }
.ob.on .ob-f, .ob.sel .ob-f { clip-path: circle(var(--r) at var(--x) var(--y)); }
.ob.sel { --r: 400px; }
.ob:active { transform: scale(.985); }
.ob:focus-visible { outline: 2px solid var(--syl); outline-offset: 2px; }
.ob:disabled { opacity: .4; pointer-events: none; }
.ob.red { --ob-fill: var(--land); border-color: color-mix(in srgb, var(--land) 70%, #000); color: #ff5a4f; } .ob.red .ob-f, .ob.blue .ob-f { color: #fff; }
.ob.blue { --ob-fill: var(--syl); border-color: #2b35c9; color: #8c96ff; }
.ob.sq { width: 44px; padding: 0; font-size: 20px; }
.ob.tab { height: 36px; border-radius: 99px; padding: 0 13px; font-size: 13px; }
.ob.tab small { font-size: 11px; opacity: .65; margin-left: 5px; }
.ob.big { height: 52px; font-size: 16px; padding: 0 20px; }

.ctl { display: flex; gap: 8px; align-items: center; }
.lvwrap { flex: 1 1 auto; min-width: 0; position: relative; }
.lvwrap select { width: 100%; height: 44px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); color: var(--fg); font: 800 1.15rem var(--display); text-transform: uppercase; letter-spacing: .01em; padding: 0 12px; appearance: none; -webkit-appearance: none; cursor: pointer; text-overflow: ellipsis; }
.lvwrap::after { content: "▾"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; font-size: 12px; }
.bpm { font: 800 1.55rem/1 var(--display); min-width: 4.4rem; text-align: center; font-variant-numeric: tabular-nums; } .bpm small { font: 500 .66rem var(--body); color: var(--muted); margin-left: 2px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 0 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs { transition: opacity .35s; }
body.playing .tabs { opacity: 0; pointer-events: none; }   /* chapter tabs only while not playing: they come back when the round is done */
.tip { margin: 6px 0 0; color: var(--muted); font-size: .9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 90ch; }
.tip b { color: var(--fg); font: 600 .72rem var(--mono); border: 1.5px solid var(--fg); border-radius: 99px; padding: 0 7px; margin-right: 6px; white-space: nowrap; }
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; min-height: 58px; padding-top: 4px; }
.combo { font: 800 1.15rem/1 var(--display); text-transform: uppercase; color: var(--muted); }
.combo b { font-size: 2.3rem; color: var(--sylText); } .combo span { display: block; color: var(--sylText); font-size: .9rem; letter-spacing: .04em; min-height: 1em; }
.verdict { font: 800 clamp(1.9rem, 5.5vw, 3rem)/1 var(--display); text-transform: uppercase; text-align: center; white-space: nowrap; }
.verdict.v-perfect { color: var(--hitText); } .verdict.v-good { color: var(--good); } .verdict.v-ok { color: var(--ok); } .verdict.v-miss { color: var(--muted); } .verdict.v-land { color: var(--landText); } .verdict.v-fire { color: #ff6a00; }
.verdict.bump { animation: bump .22s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes bump { from { transform: scale(1.25); } to { transform: scale(1); } }
.right { justify-self: end; text-align: right; } .right b { font: 800 1.9rem/1 var(--display); font-variant-numeric: tabular-nums; }
.crowd { display: flex; align-items: center; gap: 8px; justify-content: end; font-size: .78rem; color: var(--muted); }
.crowd span { width: 110px; height: 7px; border-radius: 99px; background: #222523; overflow: hidden; } .crowd span i { display: block; height: 100%; width: 50%; background: var(--sylText); transition: width .25s; }

.track { grid-row: 6; position: relative; min-height: 0; overflow: hidden; cursor: pointer; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 6%, #000 90%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 6%, #000 90%, transparent 100%); }
.lane { position: absolute; left: 0; top: 0; height: 100%; will-change: transform; z-index: 1; }
.lane svg { position: absolute; left: 0; top: 0; overflow: visible; }
/* Every word is a circle, like a Logic cell: stressed = solid blue, big white word; unstressed = light blue, smaller black word; landing = red.
   The ring around it flares as the playhead passes. */
.card { --c: var(--syl); --wv: #fff; position: absolute; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; transform-origin: 50% 50%; transition: background-color .7s ease-out, opacity .3s; }
.card.soft { --c: #00CDA2; --wv: #fff; color: var(--ink); }
.card.land { --c: var(--land); --wv: #fff; color: #fff; }
/* rhyme groups on an LP: one colour and one letter per rhyme sound */
.card.r1 { --c: var(--land); } .card.r2 { --c: #00CDA2; color: var(--ink); } .card.r3 { --c: #e07b39; color: var(--ink); }
.card .rg { position: absolute; left: 50%; bottom: 7%; translate: -50% 0; z-index: 1; font: 700 .72rem/1 var(--mono); opacity: .9; }
.card .w { position: absolute; z-index: 1; left: 4%; top: 50%; translate: 0 -50%; transform-origin: 0 50%; display: block; font-weight: 700; line-height: 1; white-space: nowrap; transform: scale(.85); transition: transform .45s cubic-bezier(.68,-.6,.32,1.6); letter-spacing: -.01em; }
.card.passed .w { transform: scale(1); }
.card .bg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.card .bg .pie { fill: #fff; opacity: .3; }
.card .bg .wave, .card .bg .base { fill: none; stroke: var(--wv); stroke-linecap: round; transform-box: fill-box; transform-origin: center; }
.card .bg .wave { stroke-width: .9; opacity: .95; } .card .bg .base { stroke-width: 1.3; opacity: .95; }
.card.pass .base { animation: sq-ring var(--sd, .5s) cubic-bezier(.68,-.6,.32,1.6) calc(var(--sd, .5s) * .2) both; }
.beatsel { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; max-width: 100%; flex: 1 1 160px; }   /* fixed basis: a long beat name never pushes the row to wrap, so the track keeps its height */
.beatsel select { max-width: min(260px, 60vw); text-overflow: ellipsis; }
.beatsel small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; }
.beatsel select, .beatsel input[type=number] { height: 32px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--card); color: var(--fg); font: 500 .85rem var(--body); padding: 0 8px; }
.beatsel input[type=number] { width: 70px; }
.beatsel .own { display: inline-flex; gap: 6px; align-items: center; }
.card .dot { position: absolute; right: 6%; top: 6%; width: 11px; height: 11px; border-radius: 50%; background: transparent; box-shadow: 0 0 0 2px var(--bg); }
.card.next::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 5px solid transparent; border-left-color: #ffb000; filter: drop-shadow(0 0 6px #ff6a00); pointer-events: none; }
.card.land::after { content: ""; position: absolute; inset: -3px; border: 1.5px dashed var(--land); border-radius: 50%; pointer-events: none; opacity: .8; }
.card.flash { transition: none; background: var(--hit); color: #032b03; }
.card.flash.g2 { background: var(--good); color: #2a1a00; } .card.flash.g3 { background: var(--ok); color: #2a1200; }
.card.missed { opacity: .55; box-shadow: inset 0 0 0 2px #4a54d6; background: transparent; color: var(--sylText); --wv: #4a54d6; }
.card.missed.land { box-shadow: inset 0 0 0 2px #c0362d; color: var(--landText); --wv: #c0362d; }
.card.missed.soft { color: #00CDA2; box-shadow: inset 0 0 0 2px #00a382; --wv: #00a382; }
/* the squish as the playhead passes: the circle bumps to 1.05, the word grows from .85 to 1, the sound ring flares to 1.5 and settles */
.card.pass { animation: sq-card var(--sd, .5s) cubic-bezier(.68,-.6,.32,1.6); }
.card.pass .wave { animation: sq-ring var(--sd, .5s) cubic-bezier(.68,-.6,.32,1.6) calc(var(--sd, .5s) * .2) both; }
@keyframes sq-card { 0% { transform: scale(1); } 45% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes sq-ring { 0% { transform: scale(1); } 45% { transform: scale(1.16, 1.1); } 100% { transform: scale(1); } }
.hold { position: absolute; height: 4px; border-radius: 2px; background: var(--syl); opacity: .22; }
.tick { position: absolute; width: 3px; height: 10px; border-radius: 2px; background: var(--fg); margin-left: -1.5px; }
.head { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--heat, var(--fg)); border-radius: 2px; pointer-events: none; z-index: 2; transition: background-color .2s; }
.head.hot { width: 5px; margin-left: -2.5px; box-shadow: 0 0 12px var(--heat); }
.head::before { content: ""; position: absolute; left: 50%; top: 0; transform: translateX(-50%); border: 8px solid transparent; border-top: 10px solid var(--heat, var(--fg)); }
.hint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: calc(100% - 24px); z-index: 7; font: 800 clamp(1.4rem, 4vw, 2.2rem)/1.1 var(--display); text-transform: uppercase; color: var(--fg); background: color-mix(in srgb, var(--bg) 88%, transparent); padding: 14px 22px; border-radius: 14px; text-align: center; pointer-events: none; }
.hint small { display: block; font: 500 .85rem var(--body); text-transform: none; color: var(--muted); margin-top: 4px; }
.ripple { position: fixed; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; border: 2px solid var(--syl); pointer-events: none; animation: rip .45s ease-out forwards; z-index: 5; }
@keyframes rip { from { transform: scale(.2); opacity: .5; } to { transform: scale(1); opacity: 0; } }
@keyframes pop { from { transform: scale(1.08); } to { transform: scale(1); } }

/* ---- TAP cue + FIRE! (Bennie 2026-11-22; mock docs/preview/ttb-tap-fire-mock.html v5). All of it sits over the track and never takes a tap.
   No hit-stop anywhere: freezing time would pull the taps off the music. */
.zone { position: absolute; z-index: 0; border-radius: 6px; background: rgba(217, 166, 46, .16); pointer-events: none; }   /* amber: good, within 85 ms */
.zone i { position: absolute; top: 0; bottom: 0; left: 50%; width: var(--pw, 20px); margin-left: calc(var(--pw, 20px) / -2); border-radius: 5px; background: rgba(3, 255, 100, .26); }   /* green: perfect, within 40 ms */
.zone small { position: absolute; left: calc(100% + 6px); top: -2px; font: 600 10px/1.25 var(--mono); letter-spacing: .04em; color: #03FF64; white-space: nowrap; } .zone small b { display: block; font-weight: 600; color: #d9a62e; }
body.playing .zone small { opacity: 0; }
.tapring { position: absolute; z-index: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 3.5px solid var(--heat, var(--fg)); pointer-events: none; }
.tapring.beat { animation: ringBeat .24s ease-out; }
@keyframes ringBeat { from { transform: scale(1.4); } to { transform: scale(1); } }
.tapflag { --f: 0; position: absolute; left: 0; top: 0; z-index: 3; width: 92px; height: 42px; margin-left: -46px; border: 2px solid var(--fg); border-radius: 9px; background: #000; display: grid; place-items: center; font: 900 30px/1 var(--display); letter-spacing: .04em; pointer-events: none; will-change: transform; transition: scale .12s cubic-bezier(.2, 1.8, .4, 1); }
.tapflag::before { content: ""; position: absolute; inset: 0; border-radius: 6px; background: var(--fg); clip-path: inset(0 calc(100% - var(--f) * 100%) 0 0); }   /* fills up during the last beat */
.tapflag span { position: relative; color: #f2f3ef; mix-blend-mode: difference; }
.tapflag::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -8px; border: 8px solid transparent; border-top: 10px solid var(--fg); }
.tapflag i { position: absolute; left: 50%; top: calc(100% + 8px); width: 2px; margin-left: -1px; height: var(--stem, 0px); background: var(--fg); }
.tapflag.now { scale: 1.15; box-shadow: 0 0 16px rgba(242, 243, 239, .8); }
.streak { position: absolute; right: 12%; top: 4px; z-index: 6; display: flex; align-items: center; gap: 3px; font: 600 .78rem var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); pointer-events: none; }
.streak svg { width: 20px; height: 20px; fill: none; stroke: #4a4f4c; stroke-width: 1.8; stroke-linejoin: round; }
.streak svg.on { fill: #ff6a00; stroke: #ffd23a; }
.streak .n { min-width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; } .streak.lit .n { color: var(--fg); }
.card.hitpop { animation: hitpop .2s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes hitpop { from { transform: scale(1.1, .9); } to { transform: scale(1); } }
.card.burn { animation: burn .9s ease-out both; }   /* FIRE!: the word-ball shrinks under the fireball and stays its own colour */
@keyframes burn { 0% { transform: scale(1); } 16%, 85% { transform: scale(.5); } 100% { transform: scale(1); } }
.fx { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.fx i { position: absolute; border-radius: 2px; animation: fly .5s cubic-bezier(.1, .7, .3, 1) both; }
@keyframes fly { from { transform: translate(-50%, -50%) rotate(var(--rot)); opacity: 1; } 70% { opacity: 1; } to { transform: translate(calc(var(--dx) - 50%), calc(var(--dy) - 50%)) rotate(var(--rot)); opacity: 0; } }
.pulse { position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle at var(--px, 20%) 48%, rgba(3, 255, 100, .24), transparent 70%); }
.pulse.go { animation: pulseA .32s ease-out; }
.pulse.warm { background: radial-gradient(circle at var(--px, 20%) 48%, rgba(255, 90, 0, .5), rgba(175, 0, 0, .2) 45%, transparent 90%); }
.pulse.warm.go { animation: pulseW .95s ease-out; }
@keyframes pulseA { from { opacity: 1; } to { opacity: 0; } }
@keyframes pulseW { 0% { opacity: 0; } 8% { opacity: 1; } 30%, 70% { opacity: .6; } 100% { opacity: 0; } }
/* FIRE! moves like Bennie's template (2026-11-22): a comet streaks in from the top right, hits the ball (white flash + two shock rings + shake),
   the fireball ignites with a spin and an overshoot, its tongues flicker, embers drift off up-right, then it fades. Sizes are in em: 1em = a tenth of the fireball. */
.fire { position: absolute; z-index: 5; pointer-events: none; will-change: transform; }
.fire svg { display: block; width: 100%; height: 100%; overflow: visible; transform-origin: 36.76% 58.88%; opacity: 0; filter: drop-shadow(0 0 1.4em rgba(255, 106, 0, .85)); }
.fire.go svg { animation: ignite .9s both; }
@keyframes ignite { 0% { transform: scale(.3) rotate(-20deg); opacity: 0; animation-timing-function: cubic-bezier(.2, 1.6, .4, 1); } 26% { transform: scale(1.25) rotate(4deg); opacity: 1; } 46% { transform: scale(1) rotate(0); } 82% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.12); opacity: 0; } }
.fire .flames, .fire .lick { transform-origin: 148.88px 213.15px; animation: tongue .3s infinite ease-in-out; }
.fire .lick.l1 { animation-duration: .27s; animation-delay: -.1s; } .fire .lick.l2 { animation-duration: .36s; animation-delay: -.2s; } .fire .lick.l3 { animation-duration: .32s; animation-delay: -.05s; }
@keyframes tongue { 0%, 100% { transform: scale(1) skewX(0); } 33% { transform: scale(1.08, .94) skewX(-4deg); } 66% { transform: scale(.95, 1.07) skewX(3deg); } }
.fire .core { transform-origin: 148.88px 213.15px; animation: corep .4s infinite ease-in-out; }
@keyframes corep { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
.fire .comet, .fire .flash, .fire .ring { position: absolute; left: 36.76%; top: 58.88%; border-radius: 50%; opacity: 0; }
.fire .comet { width: 2.4em; height: 2.4em; margin: -1.2em 0 0 -1.2em; }
.fire .comet::before { content: ""; position: absolute; left: 1.1em; top: .4em; width: 17em; height: 1.6em; border-radius: 99px; background: linear-gradient(90deg, #ffe98a, #ff8a00 30%, rgba(210, 30, 0, .6) 65%, transparent); filter: blur(3px); }
.fire .comet::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, #fff 0 25%, #ffe98a 45%, #ff8a00 75%, transparent 100%); box-shadow: 0 0 1.6em .5em #ff8a00, 0 0 3.6em 1.2em rgba(220, 40, 0, .6); }
.fire.in .comet { animation: comet .22s cubic-bezier(.55, 0, 1, .45) both; }
@keyframes comet { 0% { transform: translate(12em, -12em) rotate(-45deg) scale(.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(0, 0) rotate(-45deg) scale(1); opacity: 1; } }
.fire .flash { width: 8em; height: 8em; margin: -4em 0 0 -4em; background: radial-gradient(circle, #fff 0 15%, #ffe98a 30%, rgba(255, 106, 0, .7) 50%, transparent 70%); }
.fire.go .flash { animation: flashA .5s ease-out both; } .fire.soft .flash { display: none; }
@keyframes flashA { 0% { opacity: .95; transform: scale(.4); } 100% { opacity: 0; transform: scale(2.4); } }
.fire .ring { width: 5em; height: 5em; margin: -2.5em 0 0 -2.5em; box-sizing: border-box; border: 1.8em solid #ffe98a; }
.fire.go .ring { animation: ringA .7s ease-out both; } .fire.go .ring.r2 { animation-delay: .1s; border-color: #ff8a00; }
@keyframes ringA { 0% { opacity: 1; transform: scale(.5); border-width: 1.8em; } 100% { opacity: 0; transform: scale(3); border-width: .1em; } }
.fire .em { position: absolute; width: .45em; height: .45em; border-radius: 50%; background: #ffe98a; box-shadow: 0 0 .6em .2em #ff8a00; animation: emberA .9s ease-out infinite both; }
@keyframes emberA { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.1); opacity: 0; } }
.slam, .cpop { position: absolute; z-index: 6; pointer-events: none; white-space: nowrap; font-family: var(--display); font-weight: 900; line-height: 1; }
.slam { left: 50%; top: 5%; font-size: clamp(3.4rem, 13vw, 9.5rem); color: #ff6a00; -webkit-text-stroke: 2px #ffd23a; text-shadow: 0 0 22px rgba(255, 106, 0, .75); transform: translateX(-50%) rotate(-4deg); }
.slam small { font-size: .5em; color: #ffd23a; -webkit-text-stroke: 0; text-shadow: 0 0 0 #000, 3px 3px 0 #000; margin-left: .25em; }
.slam.go { animation: slam .95s ease-out both; }
@keyframes slam { 0% { transform: translateX(-50%) rotate(-4deg) scale(2.4); opacity: 0; } 12% { transform: translateX(-50%) rotate(-4deg) scale(.92); opacity: 1; } 19% { transform: translateX(-50%) rotate(-4deg) scale(1.06); } 26%, 76% { transform: translateX(-50%) rotate(-4deg) scale(1); opacity: 1; } 100% { transform: translateX(-50%) rotate(-4deg) scale(1.1); opacity: 0; } }
.cpop { font-size: clamp(2.2rem, 7vw, 5rem); color: #ff8a00; -webkit-text-stroke: 1px #000; text-shadow: 3px 3px 0 #000; transform: rotate(-6deg); }
.cpop.go { animation: cpop .6s ease-out both; }
@keyframes cpop { 0% { transform: rotate(-6deg) scale(2); opacity: 0; } 22% { transform: rotate(-6deg) scale(.94); opacity: 1; } 36%, 72% { transform: rotate(-6deg) scale(1); opacity: 1; } 100% { transform: rotate(-6deg) scale(1.05) translateY(-10px); opacity: 0; } }
.track.shake { animation: shake .4s linear; }
@keyframes shake { 0% { transform: none; } 14% { transform: translate(-9px, 5px) rotate(-.5deg); } 34% { transform: translate(7px, -4px) rotate(.4deg); } 56% { transform: translate(-5px, 3px) rotate(-.25deg); } 78% { transform: translate(3px, -2px); } 100% { transform: none; } }
/* Extra round (Bennie 2026-11-22, like the flow game's overtime): after the last tap the stars lock, the beat and the taps go on, +10 a clean hit, 3 mistakes ends it */
.ot { position: absolute; left: 12px; top: 4px; z-index: 6; display: flex; align-items: center; gap: 6px; font: 600 .78rem var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--fg); pointer-events: none; }
.ot svg { width: 18px; height: 18px; fill: #0000AF; stroke: #f2f3ef; stroke-width: 1.8; stroke-linejoin: round; transition: opacity .2s; } .ot svg.lost { fill: none; stroke: #4a4f4c; }
.ot b { color: #03FF64; font-variant-numeric: tabular-nums; } .ot.hit b { animation: bump .22s cubic-bezier(.2, 1.6, .4, 1); }
@media (max-height: 480px) { .opts label { min-height: 26px; } .beatsel { display: none; } }   /* a phone on its side: keep the footer to one row so the track keeps its height */
@media (max-width: 640px) { .tapflag { width: 72px; height: 34px; margin-left: -36px; font-size: 24px; } .tapring { width: 34px; height: 34px; margin: -17px 0 0 -17px; } .streak svg { width: 17px; height: 17px; } }

.foot { grid-row: 7; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding-top: 6px; min-width: 0; }
.opts, .beats { min-width: 0; max-width: 100%; }
.prog { height: 5px; background: #222523; border-radius: 99px; overflow: hidden; } .prog i { display: block; height: 100%; width: 0; background: var(--fg); }
.opts { display: flex; gap: 8px 16px; align-items: center; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.opts label { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; min-height: 32px; }
.opts input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--syl); }
.opts input[type=range] { accent-color: var(--syl); width: 110px; }
.opts output { color: var(--fg); font-variant-numeric: tabular-nums; }
.beats { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; flex: 1 1 300px; min-width: 0; }
.beats::-webkit-scrollbar { display: none; }
.beats a { color: var(--fg); text-decoration: none; background: var(--card); border: 1.5px solid var(--line); border-radius: 99px; padding: 3px 10px; white-space: nowrap; font-size: .8rem; }
.beats a small { color: var(--muted); margin-left: 5px; }
.beats a:hover { border-color: var(--fg); }

.res { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); width: min(460px, calc(100% - 32px)); background: rgba(0, 0, 0, .22); border: 1.5px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 12px; z-index: 6; user-select: text; }
.res-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.res .x { flex: none; width: 36px; height: 36px; border: 1.5px solid var(--line); border-radius: 99px; background: transparent; color: var(--fg); font-size: 20px; line-height: 1; cursor: pointer; }
.res .x:hover { border-color: var(--fg); }
.res-top .stars { margin-left: auto; }
.res h2 { margin: 0; font: 800 clamp(1.8rem, 6vw, 2.4rem)/1 var(--display); text-transform: uppercase; }
.stars { display: flex; gap: 4px; } .stars svg { width: 30px; height: 30px; fill: #2b2f2d; } .stars svg.on { fill: var(--strip); animation: pop .35s cubic-bezier(.2, 1.8, .4, 1) backwards; }
.stars svg.on:nth-child(2) { animation-delay: .12s; } .stars svg.on:nth-child(3) { animation-delay: .24s; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; }
.stats div { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
.stats dt { color: var(--muted); font-size: .74rem; } .stats dd { margin: 0; font: 800 1.35rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.res p { margin: 0; font-size: .88rem; color: var(--muted); } .res p b { color: var(--fg); }
.res .near { color: var(--landText); font-weight: 600; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
/* LP shelf (Bennie 2026-11-22): the songs to pick from. One empty sleeve each with its record sliding out to the right; a locked LP opens when the one before it is cleared */
.lps { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; padding: 8px 0 2px; transition: opacity .35s; }
.lps::-webkit-scrollbar { display: none; }
body.playing .lps { opacity: 0; pointer-events: none; }
.lp { position: relative; flex: none; width: 138px; height: 88px; padding: 0; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.lp .dc { position: absolute; left: 40px; top: 3px; width: 82px; height: 82px; border-radius: 50%; background: radial-gradient(circle, #E5E8E2 0 7%, #0000AF 7.5% 30%, transparent 30.5%), repeating-radial-gradient(circle, #151515 0 3px, #262626 3px 4px); box-shadow: 0 0 0 1.5px #3a3f3c; transition: transform .45s cubic-bezier(.16, 1, .3, 1); }
.lp .sl { position: absolute; left: 0; top: 0; width: 88px; height: 88px; border-radius: 4px; background: #E5E8E2; box-shadow: inset 0 0 0 1.5px #fff, inset 7px 0 0 rgba(0, 0, 0, .07); padding: 8px 8px 7px 13px; display: grid; grid-template-rows: auto 1fr auto; }
.lp .sl small { font: 600 .62rem var(--mono); letter-spacing: .06em; text-transform: uppercase; color: #5b615d; }
.lp .sl b { align-self: center; font: 800 1.05rem/1 var(--display); text-transform: uppercase; }
.lp .sl i { font: 500 .62rem var(--mono); font-style: normal; color: #5b615d; white-space: nowrap; }
.lp .lk { position: absolute; right: 8px; top: 8px; width: 14px; height: 14px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.lp:hover:not(:disabled) .dc, .lp.sel .dc { transform: translateX(14px); }
.lp.sel .sl { box-shadow: inset 0 0 0 2.5px #0000AF, inset 7px 0 0 rgba(0, 0, 0, .07); }
.lp.locked { cursor: default; } .lp.locked .sl { opacity: .5; } .lp.locked .dc { opacity: .35; }
.lp:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; border-radius: 6px; }
@media (max-width: 640px) {
  .lp { width: 112px; height: 72px; } .lp .sl { width: 72px; height: 72px; padding: 6px 6px 5px 10px; } .lp .sl b { font-size: .9rem; } .lp .dc { left: 32px; width: 66px; height: 66px; }
  .ctl { gap: 5px; } .ctl .bpm { min-width: 2.6rem; font-size: 1.2rem; } .ctl .bpm small { display: none; } .ctl .ob.sq { width: 38px; height: 40px; }
  .opts label[for=lag] input { width: 80px; } .beats { flex-basis: 100%; } .lvwrap select { height: 40px; font-size: 1rem; }
  .hud { grid-template-columns: 1fr 1fr; min-height: 0; } .verdict { grid-row: 2; grid-column: 1 / -1; margin-top: 2px; }
  .combo b { font-size: 1.8rem; } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .res { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { .lp .dc { transition: none; } .card.pass, .card.pass .wave, .card .w { animation: none !important; transition: none !important; } .verdict.bump, .stars svg.on, .ripple { animation: none; } .ripple { display: none; } .ob .ob-f { transition: none; } .fire, .fire *, .slam, .cpop, .tapring, .card.hitpop, .card.burn, .track.shake { animation: none !important; } .fx { display: none; } .tapflag { transition: none; } }

    const dx = Math.max(-.45, Math.min(.45, off / 1000 / R.dur)) * T.u; n.tick.style.left = (n.x + dx) + 'px'; n.tick.style.background = col; n.tick.hidden = false;
    click(ctx.currentTime, grade === 'perfect' ? (n.land ? 1760 : 1320) : grade === 'good' ? 990 : 620, grade === 'perfect' ? .3 : .22, n.land && grade === 'perfect' ? .16 : .07, 'triangle');
    say(grade === 'perfect' ? (n.land ? 'Landed' : 'Perfect') : Math.round(a) + ' ms ' + (off > 0 ? 'late' : 'early'), n.land && grade === 'perfect' ? 'land' : grade); hud();

  }
  function R_stop() { round.otEnd = 'Stopped'; say('Stopped · +' + round.bonus, ''); finish(); }
  function stopRound() { cancelAnimationFrame(raf); if (ctx && (state === 'count' || state === 'play')) { ctx.close(); ctx = null; } round = null; state = 'idle'; document.body.classList.remove('playing'); fxOff(); setFire(0); resetTiles(); say('Ready', ''); hud(); $('hint').hidden = false; }
  const STAR = 'M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z';
  function finish() {

    if (R.src) { try { R.src.stop(ctx.currentTime + 1.2); } catch {} }
    R.targets.forEach(x => { x.n.c.classList.remove('next'); x.n.pie.setAttribute('d', ''); }); $('prog').style.width = '100%';
    if (!R.ot || R.pass < 1) T.lane.style.transition = 'transform .6s cubic-bezier(.16,1,.3,1)'; if (!R.ot || R.pass < 1) place(Math.max(0, T.total - (T.W - T.headX) / T.u * .9)); setTimeout(() => { if (T) T.lane.style.transition = ''; }, 700);
    const acc = Math.max(0, Math.round(100 * (R.score - .25 * R.strays) / R.n0)), stars = acc >= 90 ? 3 : acc >= 75 ? 2 : acc >= 50 ? 1 : 0;
    const avg = R.offs.length ? Math.round(R.offs.reduce((a, b) => a + b, 0) / R.offs.length) : 0;
    const shown = stars;
    const feel = R.offs.length < 4 ? 'Keep tapping' : avg > 25 ? 'Laid back' : avg < -25 ? 'Pushing' : 'Locked in';

    const st = $('stars'); st.replaceChildren(); st.setAttribute('aria-label', shown + ' of 3 stars');

    $('sAcc').textContent = acc + '%'; $('sScore').textContent = (R.pts + R.bonus).toLocaleString('en'); $('sPerf').textContent = R.perfect + ' of ' + R.targets.length; $('sCombo').textContent = R.maxCombo;
    $('sLand').textContent = R.landDead + ' of ' + R.lands + ' dead on';
    $('sAvg').textContent = R.offs.length ? avg === 0 ? 'on time' : Math.abs(avg) + ' ms ' + (avg > 0 ? 'late' : 'early') : 'no hits';
    const next = [50, 75, 90].find(v => v > acc), near = $('near');
    near.hidden = !(next && next - acc <= 6 && R.offs.length); if (!near.hidden) near.textContent = `${next - acc} ${next - acc === 1 ? 'point' : 'points'} from ${[50, 75, 90].indexOf(next) + 1} ${next === 50 ? 'star' : 'stars'}. One more?`;

    const main = $('actMain'), alt = $('actAlt'); alt.hidden = true;
    const own = $('beatSel').value === 'own', up = curLib ? nextBeat(1) : null, dn = curLib ? nextBeat(-1) : null, show = v => +v.toFixed(1);   // on a library beat faster / slower = the next beat, at its own tempo
    if (stars === 3 && !flow.song && !own && (curLib ? up : bpm < 220)) { setLabel(main, `Go faster: ${up ? show(up.bpm) : bpm + 5} BPM`); main.dataset.d = 1; alt.hidden = false; setLabel(alt, 'Again at ' + show(bpm)); }
    else if (fails >= 2 && !flow.song && !own && (curLib ? dn : bpm > 40)) { setLabel(main, `Ease off: ${dn ? show(dn.bpm) : bpm - 5} BPM`); main.dataset.d = -1; alt.hidden = false; setLabel(alt, 'Again at ' + show(bpm)); }

  }
  function showBest(isNew) { const b = save.best[flow.id], e = $('best'); e.replaceChildren(); if (!b) { e.textContent = `No record on ${flow.n} yet. Three stars sets one.`; return; } const s = document.createElement('b'); s.textContent = +(+b).toFixed(1) + ' BPM'; e.append(isNew ? 'New record on ' : 'Your record on ', flow.n, ': ', s); }

  // ---- practice along: famous instrumentals near this tempo and feel (YouTube search links; tempos are approximate)
  const PRACTICE_LINKS = false;   // paused (Bennie 2026-11-22): no beats to choose from anywhere; every song gets its own beat
  function showBeats(f) {

    list.forEach(b => { const a = document.createElement('a'); a.href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(b.artist + ' ' + b.song + ' instrumental'); a.target = '_blank'; a.rel = 'noopener';
      const sm = document.createElement('small'); sm.textContent = (b.bpm ? '~' + b.bpm : '') + (b.halfTime ? ' half-time' : '') + (b.meter ? (b.bpm ? ' · ' : '') + b.meter : ''); a.append(b.artist + ' – ' + b.song, sm); e.append(a); });
  }

  // ---- the LP shelf: pick a song; an LP is open when the one before it has LP_NEED stars
  // Paused (Bennie 2026-11-22): no shelf and no locks for now; later one LP shows up as "unlocked" at the end of a round, then the next song. Set LP_SHELF to true to bring the shelf back.
  const LP_SHELF = false;
  const lpOpen = f => !LP_SHELF || f.lp === 1 || (save.lp[LPS[f.lp - 2].id] || 0) >= LP_NEED;
  function showLps() {
    const e = $('lps'); e.hidden = !LP_SHELF || !CHAPTERS[chIx].lp;
    [...$('lvSel').options].forEach(o => { const l = LPS.find(l => l.id === o.value); if (l) { o.disabled = !lpOpen(l); o.textContent = `LP ${l.lp} · ${l.n}${lpOpen(l) ? '' : ' (locked)'}`; } });
    if (e.hidden) return; e.replaceChildren();
    LPS.forEach(f => { const open = lpOpen(f), st = save.lp[f.id] || 0, b = document.createElement('button'); b.type = 'button'; b.disabled = !open;
      b.className = 'lp' + (f === flow ? ' sel' : '') + (open ? '' : ' locked') + (st >= LP_NEED ? ' got' : '');
      b.setAttribute('aria-label', open ? `LP ${f.lp}: ${f.n}, ${+f.bpm.toFixed(1)} BPM${f === flow ? ', selected' : ''}` : `LP ${f.lp}: locked. Clear LP ${f.lp - 1} to unlock it.`);
      const dc = document.createElement('span'); dc.className = 'dc';
      const sl = document.createElement('span'); sl.className = 'sl';
      const no = document.createElement('small'); no.textContent = 'LP ' + f.lp;
      const nm = document.createElement('b'); nm.textContent = open ? f.n : 'Locked';
      const sub = document.createElement('i'); sub.textContent = open ? (st ? '★'.repeat(st) + ' · ' : '') + Math.round(f.bpm) + ' BPM' : 'clear LP ' + (f.lp - 1);
      sl.append(no, nm, sub);
      if (!open) { const k = sv('svg', { viewBox: '0 0 24 24', class: 'lk', 'aria-hidden': 'true' }); k.append(sv('rect', { x: 3, y: 11, width: 18, height: 11, rx: 2 }), sv('path', { d: 'M7 11V7a5 5 0 0 1 10 0v4' })); sl.append(k); }   // lucide "lock"
      b.append(dc, sl); b.addEventListener('click', () => pick(f)); e.append(b); });
  }
  $('resX').addEventListener('click', () => { $('result').hidden = true; });

  // ---- controls
  function setBpm(v, quiet) { const was = bpm; bpm = Math.min(220, Math.max(40, v)); $('bpmOut').firstChild.textContent = +bpm.toFixed(1); if (quiet || !T) return;

  const GRID = { 3: 'triplets', 4: '16ths', 5: 'quintuplets', 6: 'sextuplets', 12: '16ths + triplets', 20: '16ths + quintuplets' };
  // practice tempo (Bennie 2026-11-22 "it goes way too fast"): at most about 4 words a second, never above the level's full tempo. It is the tempo auto looks for a beat at;

    pick(CHAPTERS[c].l.find(l => l.id === id) || CHAPTERS[c].l[0]);
  }
  function step(d) {

  $('ownFile').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; $('beatName').textContent = 'loading ' + f.name + '…';
    try { bufs.own = { buf: await f.arrayBuffer().then(decode), name: f.name }; } catch { $('beatName').textContent = 'could not read ' + f.name; return; } chooseBeat(); });
  ['ownBpm', 'ownDown'].forEach(id => $(id).addEventListener('input', () => { if ($('beatSel').value === 'own') pick(flow); }));
  ['lessShake', 'lessFlash'].forEach(id => { $(id).checked = !!save[id]; $(id).addEventListener('change', () => { save[id] = $(id).checked; keep(); }); });
  $('guide').checked = save.guide !== false; $('guide').addEventListener('change', () => { save.guide = $('guide').checked; keep(); });
  const lagShow = () => { $('lagOut').textContent = save.lag + ' ms'; };
  $('lag').value = save.lag; lagShow(); $('lag').addEventListener('input', () => { save.lag = +$('lag').value; lagShow(); keep(); });
  let rz = 0; new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(() => { if (state === 'idle' || state === 'done') { const d = state === 'done'; drawTrack(); if (!d) resetTiles(); } }, 120); }).observe($('track'));
  window.__ttb = { fire: () => round ? round.fire : 0, ot: () => round ? { on: round.ot, lives: round.lives, bonus: round.bonus, hits: round.otHits, pass: round.pass } : null, loading: () => loading, lps: () => LPS.map(f => ({ id: f.id, open: lpOpen(f), stars: save.lp[f.id] || 0 })), rate: () => beat ? bpm / beat.bpm : null, lib: () => curLib && curLib.file, nudge: d => nudge(d), all: () => CHAPTERS[0].l.map(l => l.id).concat(LPS.map(l => l.id)), taps: () => T ? T.notes.map(n => n.s * 60 / bpm / flow.sub) : [], bpm: () => bpm, layout: () => T && { beatPx: T.u * flow.sub, d: T.sq, bpm: flow.bpm }, beat: () => beat && { name: beat.name, bpm: beat.bpm }, pick: id => CHAPTERS.forEach((c, i) => { if (i && c.l.some(l => l.id === id)) pickCh(i, id); }), targets: () => round ? round.targets.map(x => x.t) : [], due: () => round ? round.targets.filter(x => !x.done).map(x => x.t) : [], heard: () => round ? heard() : 0, state: () => state, start: () => { if (state === 'idle' || state === 'done') start(); }, tap: off => tap(round.perf0 + (off - round.ctx0 + round.lat) * 1000) };
  if (!save.lps1) { save.lps1 = save.songs1 = 1; save.ch2 = 1; save.lv = LPS[0].id; }   // first visit after the LPs arrived: open the shelf on LP 1
  { const ci = CHAPTERS.findIndex((c, i) => i && c.l.some(l => l.id === save.lv)); pickCh(ci > 0 && !CHAPTERS[Math.min(CHAPTERS.length - 1, save.ch2 || 0)].l.some(l => l.id === save.lv) ? ci : Math.min(CHAPTERS.length - 1, save.ch2 || 0), save.lv); }
})();
</script>
