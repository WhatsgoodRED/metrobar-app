<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tap the Bar · MetroBar</title>
<!-- MetroBar (Bennie 2026-11-22 "replace Pocket Aim"): Tap the Bar in the Flow Game dialog's second tab. Fonts self-hosted (fonts/fonts.css), beats in jc/, his record in songs/.
     Circles (Bennie 2026-11-22): the white inner ring sits just inside the edge (thin blue rim), its left edge is the tap moment on the line,
     the word starts on that edge, the sound bites point inward, and a starred word in a song is a blue circle. -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* One long lyric track that slides under a fixed playhead. The words are the notes; the whole screen is the one button. */
:root { --bg: #000; --fg: #f2f3ef; --muted: #8b918c; --line: #2b2f2d; --card: #0f1110; --ink: #15181a;
  --syl: #0000AF; --hit: #00CD00; --hitText: #00CD00; --sylText: #7d87ff; --landText: #ff4d42; --good: #d9a62e; --ok: #e07b39; --land: #af0000; --beat: #c9a24a; --cell: #a85a2a; --strip: #f2c94c;
  --display: "Big Shoulders Display", Impact, sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 400 16px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
body { overflow: hidden; }
.app { height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto auto auto auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); width: 100%; padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); user-select: none; -webkit-user-select: none; touch-action: manipulation; }

/* origin buttons: the fill grows from where the pointer touched */
.ob { --ob-fill: var(--fg); --x: 50%; --y: 50%; --r: 0px; position: relative; overflow: hidden; border: 1.5px solid var(--line); background: var(--card); color: var(--fg); border-radius: 12px; height: 44px; padding: 0 16px; font: 600 15px var(--body); letter-spacing: -.01em; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; flex: 0 0 auto; transition: transform .15s; }
.ob .ob-f { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--ob-fill); color: #000; clip-path: circle(0px at var(--x) var(--y)); transition: clip-path .5s cubic-bezier(.16,1,.3,1); pointer-events: none; }
.ob.on .ob-f, .ob.sel .ob-f { clip-path: circle(var(--r) at var(--x) var(--y)); }
.ob.sel { --r: 400px; }
.ob:active { transform: scale(.985); }
.ob:focus-visible { outline: 2px solid var(--syl); outline-offset: 2px; }
.ob:disabled { opacity: .4; pointer-events: none; }
.ob.red { --ob-fill: var(--land); border-color: color-mix(in srgb, var(--land) 70%, #000); color: #ff5a4f; } .ob.red .ob-f, .ob.blue .ob-f { color: #fff; }
.ob.blue { --ob-fill: var(--syl); border-color: #2b35c9; color: #8c96ff; }
.ob.sq { width: 44px; padding: 0; font-size: 20px; }
.ob.tab { height: 36px; border-radius: 99px; padding: 0 13px; font-size: 13px; }
.ob.tab small { font-size: 11px; opacity: .65; margin-left: 5px; }
.ob.big { height: 52px; font-size: 16px; padding: 0 20px; }

.ctl { display: flex; gap: 8px; align-items: center; }
.lvwrap { flex: 1 1 auto; min-width: 0; position: relative; }
.lvwrap select { width: 100%; height: 44px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); color: var(--fg); font: 800 1.15rem var(--display); text-transform: uppercase; letter-spacing: .01em; padding: 0 12px; appearance: none; -webkit-appearance: none; cursor: pointer; text-overflow: ellipsis; }
.lvwrap::after { content: "▾"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; font-size: 12px; }
.bpm { font: 800 1.55rem/1 var(--display); min-width: 4.4rem; text-align: center; font-variant-numeric: tabular-nums; } .bpm small { font: 500 .66rem var(--body); color: var(--muted); margin-left: 2px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 0 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs { transition: opacity .35s; }
body.playing .tabs { opacity: 0; pointer-events: none; }   /* chapter tabs only while not playing: they come back when the round is done */
.tip { margin: 6px 0 0; color: var(--muted); font-size: .9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 90ch; }
.tip b { color: var(--fg); font: 600 .72rem var(--mono); border: 1.5px solid var(--fg); border-radius: 99px; padding: 0 7px; margin-right: 6px; white-space: nowrap; }
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; min-height: 58px; padding-top: 4px; }
.combo { font: 800 1.15rem/1 var(--display); text-transform: uppercase; color: var(--muted); }
.combo b { font-size: 2.3rem; color: var(--sylText); } .combo span { display: block; color: var(--sylText); font-size: .9rem; letter-spacing: .04em; min-height: 1em; }
.verdict { font: 800 clamp(1.9rem, 5.5vw, 3rem)/1 var(--display); text-transform: uppercase; text-align: center; white-space: nowrap; }
.verdict.v-perfect { color: var(--hitText); } .verdict.v-good { color: var(--good); } .verdict.v-ok { color: var(--ok); } .verdict.v-miss { color: var(--muted); } .verdict.v-land { color: var(--landText); }
.verdict.bump { animation: bump .22s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes bump { from { transform: scale(1.25); } to { transform: scale(1); } }
.right { justify-self: end; text-align: right; } .right b { font: 800 1.9rem/1 var(--display); font-variant-numeric: tabular-nums; }
.crowd { display: flex; align-items: center; gap: 8px; justify-content: end; font-size: .78rem; color: var(--muted); }
.crowd span { width: 110px; height: 7px; border-radius: 99px; background: #222523; overflow: hidden; } .crowd span i { display: block; height: 100%; width: 50%; background: var(--sylText); transition: width .25s; }

.track { position: relative; min-height: 0; overflow: hidden; cursor: pointer; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 6%, #000 90%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 6%, #000 90%, transparent 100%); }
.lane { position: absolute; left: 0; top: 0; height: 100%; will-change: transform; }
.lane svg { position: absolute; left: 0; top: 0; overflow: visible; }
/* Every word is a circle, like a Logic cell: stressed = solid blue, big white word; unstressed = light blue, smaller black word; landing = red.
   The ring around it flares as the playhead passes. */
.card { --c: var(--syl); --wv: #fff; position: absolute; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; transform-origin: 50% 50%; transition: background-color .7s ease-out, opacity .3s; }
.card.soft { --c: #00CDA2; --wv: #fff; color: var(--ink); }
.card.land { --c: var(--land); --wv: #fff; color: #fff; }
.card .w { position: absolute; z-index: 1; left: 4%; top: 50%; translate: 0 -50%; transform-origin: 0 50%; display: block; font-weight: 700; line-height: 1; white-space: nowrap; transform: scale(.85); transition: transform .45s cubic-bezier(.68,-.6,.32,1.6); letter-spacing: -.01em; }
.card.passed .w { transform: scale(1); }
.card .bg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.card .bg .pie { fill: #fff; opacity: .3; }
.card .bg .wave, .card .bg .base { fill: none; stroke: var(--wv); stroke-linecap: round; transform-box: fill-box; transform-origin: center; }
.card .bg .wave { stroke-width: .9; opacity: .95; } .card .bg .base { stroke-width: 1.3; opacity: .95; }
.card.pass .base { animation: sq-ring var(--sd, .5s) cubic-bezier(.68,-.6,.32,1.6) calc(var(--sd, .5s) * .2) both; }
.beatsel { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; max-width: 100%; flex: 1 1 320px; }   /* fixed basis: a long beat name never pushes the row to wrap, so the track keeps its height */
.beatsel select { max-width: min(260px, 60vw); text-overflow: ellipsis; }
.beatsel small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; }
.beatsel select, .beatsel input[type=number] { height: 32px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--card); color: var(--fg); font: 500 .85rem var(--body); padding: 0 8px; }
.beatsel input[type=number] { width: 70px; }
.beatsel .own { display: inline-flex; gap: 6px; align-items: center; }
.card .dot { position: absolute; right: 6%; top: 6%; width: 11px; height: 11px; border-radius: 50%; background: transparent; box-shadow: 0 0 0 2px var(--bg); }
.card.next::before { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, #fff 55%, transparent); pointer-events: none; }
.card.land::after { content: ""; position: absolute; inset: -3px; border: 1.5px dashed var(--land); border-radius: 50%; pointer-events: none; opacity: .8; }
.card.flash { transition: none; background: var(--hit); color: #032b03; }
.card.flash.g2 { background: var(--good); color: #2a1a00; } .card.flash.g3 { background: var(--ok); color: #2a1200; }
.card.missed { opacity: .55; box-shadow: inset 0 0 0 2px #4a54d6; background: transparent; color: var(--sylText); --wv: #4a54d6; }
.card.missed.land { box-shadow: inset 0 0 0 2px #c0362d; color: var(--landText); --wv: #c0362d; }
.card.missed.soft { color: #00CDA2; box-shadow: inset 0 0 0 2px #00a382; --wv: #00a382; }
/* the squish as the playhead passes: the circle bumps to 1.05, the word grows from .85 to 1, the sound ring flares to 1.5 and settles */
.card.pass { animation: sq-card var(--sd, .5s) cubic-bezier(.68,-.6,.32,1.6); }
.card.pass .wave { animation: sq-ring var(--sd, .5s) cubic-bezier(.68,-.6,.32,1.6) calc(var(--sd, .5s) * .2) both; }
@keyframes sq-card { 0% { transform: scale(1); } 45% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes sq-ring { 0% { transform: scale(1); } 45% { transform: scale(1.16, 1.1); } 100% { transform: scale(1); } }
.hold { position: absolute; height: 4px; border-radius: 2px; background: var(--syl); opacity: .22; }
.tick { position: absolute; width: 3px; height: 10px; border-radius: 2px; background: var(--fg); margin-left: -1.5px; }
.head { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--fg); border-radius: 2px; pointer-events: none; }
.head::before { content: ""; position: absolute; left: 50%; top: 0; transform: translateX(-50%); border: 8px solid transparent; border-top: 10px solid var(--fg); }
.hint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: calc(100% - 24px); z-index: 2; font: 800 clamp(1.4rem, 4vw, 2.2rem)/1.1 var(--display); text-transform: uppercase; color: var(--fg); background: color-mix(in srgb, var(--bg) 88%, transparent); padding: 14px 22px; border-radius: 14px; text-align: center; pointer-events: none; }
.hint small { display: block; font: 500 .85rem var(--body); text-transform: none; color: var(--muted); margin-top: 4px; }
.ripple { position: fixed; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; border: 2px solid var(--syl); pointer-events: none; animation: rip .45s ease-out forwards; z-index: 5; }
@keyframes rip { from { transform: scale(.2); opacity: .5; } to { transform: scale(1); opacity: 0; } }
@keyframes pop { from { transform: scale(1.08); } to { transform: scale(1); } }

.foot { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding-top: 6px; min-width: 0; }
.opts, .beats { min-width: 0; max-width: 100%; }
.prog { height: 5px; background: #222523; border-radius: 99px; overflow: hidden; } .prog i { display: block; height: 100%; width: 0; background: var(--fg); }
.opts { display: flex; gap: 8px 16px; align-items: center; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.opts label { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; min-height: 32px; }
.opts input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--syl); }
.opts input[type=range] { accent-color: var(--syl); width: 110px; }
.opts output { color: var(--fg); font-variant-numeric: tabular-nums; }
.beats { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; flex: 1 1 300px; min-width: 0; }
.beats::-webkit-scrollbar { display: none; }
.beats a { color: var(--fg); text-decoration: none; background: var(--card); border: 1.5px solid var(--line); border-radius: 99px; padding: 3px 10px; white-space: nowrap; font-size: .8rem; }
.beats a small { color: var(--muted); margin-left: 5px; }
.beats a:hover { border-color: var(--fg); }

.res { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); width: min(460px, calc(100% - 32px)); background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 12px; box-shadow: 0 24px 48px -28px rgba(0,0,0,.35); z-index: 6; user-select: text; }
.res-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.res h2 { margin: 0; font: 800 clamp(1.8rem, 6vw, 2.4rem)/1 var(--display); text-transform: uppercase; }
.stars { display: flex; gap: 4px; } .stars svg { width: 30px; height: 30px; fill: #2b2f2d; } .stars svg.on { fill: var(--strip); animation: pop .35s cubic-bezier(.2, 1.8, .4, 1) backwards; }
.stars svg.on:nth-child(2) { animation-delay: .12s; } .stars svg.on:nth-child(3) { animation-delay: .24s; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; }
.stats div { background: var(--bg); border-radius: 10px; padding: 7px 10px; }
.stats dt { color: var(--muted); font-size: .74rem; } .stats dd { margin: 0; font: 800 1.35rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.res p { margin: 0; font-size: .88rem; color: var(--muted); } .res p b { color: var(--fg); }
.res .near { color: var(--landText); font-weight: 600; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 640px) {
  .ctl { gap: 5px; } .ctl .bpm { min-width: 2.6rem; font-size: 1.2rem; } .ctl .bpm small { display: none; } .ctl .ob.sq { width: 38px; height: 40px; }
  .opts label[for=lag] input { width: 80px; } .beats { flex-basis: 100%; } .lvwrap select { height: 40px; font-size: 1rem; }
  .hud { grid-template-columns: 1fr 1fr; min-height: 0; } .verdict { grid-row: 2; grid-column: 1 / -1; margin-top: 2px; }
  .combo b { font-size: 1.8rem; } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .res { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { .card.pass, .card.pass .wave, .card .w { animation: none !important; transition: none !important; } .verdict.bump, .stars svg.on, .ripple { animation: none; } .ripple { display: none; } .ob .ob-f { transition: none; } }
</style></head><body>
<div class="app" id="app">
  <div class="ctl">
    <button class="ob sq" id="prevLv" aria-label="Previous level">‹</button>
    <div class="lvwrap"><select id="lvSel" aria-label="Level"></select></div>
    <button class="ob sq" id="nextLv" aria-label="Next level">›</button>
    <button class="ob sq" id="slower" aria-label="Slower">−</button>
    <output class="bpm" id="bpmOut">90<small>BPM</small></output>
    <button class="ob sq" id="faster" aria-label="Faster">+</button>
  </div>
  <div class="tabs" id="chs" role="group" aria-label="Chapter"></div>
  <p class="tip" id="tip"></p>
  <div class="hud">
    <div class="combo" id="combo"></div>
    <div class="verdict" id="verdict">Ready</div>
    <div class="right"><b id="acc">–</b><div class="crowd">crowd <span><i id="crowd"></i></span></div></div>
  </div>
  <div class="track" id="track" aria-label="Lyric track. Tap anywhere on it in time with each word.">
    <div class="head" id="head"></div>
    <div class="hint" id="hint">Tap to start<small>Then tap every word as the line reaches it. Space, F or J work too.</small></div>
  </div>
  <div class="foot">
    <div class="prog"><i id="prog"></i></div>
    <div class="opts">
      <label><input type="checkbox" id="guide" checked> Hear the words</label>
      <label for="lag">Headphone delay <input type="range" id="lag" min="0" max="300" step="10" value="0"> <output id="lagOut">0 ms</output></label>
      <span class="beatsel"><label for="beatSel">Beat</label><select id="beatSel"><option value="auto">Jam City beats (auto)</option><optgroup label="Pick a beat" id="beatList"></optgroup><option value="own">Your own beat file…</option><option value="none">Clicks only</option></select><span class="own" id="ownBox" hidden><input type="file" id="ownFile" accept="audio/*" hidden><button class="ob tab" id="ownPick">Choose file</button><label>BPM <input type="number" id="ownBpm" min="40" max="220" step="0.1" value="90"></label><label>first beat at <input type="number" id="ownDown" min="0" max="60" step="0.01" value="0"> s</label></span><small id="beatName"></small></span>
      <div class="beats" id="beats"></div>
    </div>
  </div>
</div>
<section class="res" id="result" hidden aria-live="polite">
  <div class="res-top"><h2 id="resTitle">Locked in</h2><div class="stars" id="stars" role="img" aria-label="0 of 3 stars"></div></div>
  <dl class="stats">
    <div><dt>Accuracy</dt><dd id="sAcc">0%</dd></div>
    <div><dt>Score</dt><dd id="sScore">0</dd></div>
    <div><dt>Perfect hits</dt><dd id="sPerf">0</dd></div>
    <div><dt>Longest combo</dt><dd id="sCombo">0</dd></div>
    <div><dt>Landing words</dt><dd id="sLand">0</dd></div>
    <div><dt>Average timing</dt><dd id="sAvg">0 ms</dd></div>
  </dl>
  <p class="near" id="near" hidden></p>
  <div class="acts"><button class="ob big red" id="actMain">Again</button><button class="ob big" id="actAlt">Again</button><button class="ob big blue" id="actNext">Next ›</button></div>
  <p id="best"></p>
</section>

  }
  function tap(ms) {

    if (n.land && grade === 'perfect') R.landDead++;
    crowd(grade === 'perfect' ? 4 : grade === 'good' ? 2 : -2);
    const col = grade === 'perfect' ? 'var(--hit)' : `var(--${grade})`;
    // green flashes on only when hit, then the card fades back to its own blue (or red)
    n.c.classList.remove('next', 'g2', 'g3'); n.c.classList.add('flash'); if (grade === 'good') n.c.classList.add('g2'); if (grade === 'ok') n.c.classList.add('g3');
    void n.c.offsetWidth; setTimeout(() => n.c.classList.remove('flash', 'g2', 'g3'), 140);
    if (!best.passed) { best.passed = true; n.c.classList.add('pass', 'passed'); }
    n.dot.style.background = col;
    const dx = Math.max(-.45, Math.min(.45, off / 1000 / R.dur)) * T.u; n.tick.style.left = (n.x + dx) + 'px'; n.tick.style.background = col; n.tick.hidden = false;
    click(ctx.currentTime, grade === 'perfect' ? (n.land ? 1760 : 1320) : grade === 'good' ? 990 : 620, grade === 'perfect' ? .3 : .22, n.land && grade === 'perfect' ? .16 : .07, 'triangle');
    say(grade === 'perfect' ? (n.land ? 'Landed' : 'Perfect') : Math.round(a) + ' ms ' + (off > 0 ? 'late' : 'early'), n.land && grade === 'perfect' ? 'land' : grade); hud();
  }
  function stopRound() { cancelAnimationFrame(raf); if (ctx && (state === 'count' || state === 'play')) { ctx.close(); ctx = null; } round = null; state = 'idle'; document.body.classList.remove('playing'); resetTiles(); say('Ready', ''); hud(); $('hint').hidden = false; }
  const STAR = 'M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z';
  function finish() {
    const R = round; cancelAnimationFrame(raf); state = 'done'; document.body.classList.remove('playing');
    if (R.src) { try { R.src.stop(ctx.currentTime + 1.2); } catch {} }

    T.lane.style.transition = 'transform .6s cubic-bezier(.16,1,.3,1)'; place(Math.max(0, T.total - (T.W - T.headX) / T.u * .9)); setTimeout(() => { if (T) T.lane.style.transition = ''; }, 700);

    const st = $('stars'); st.replaceChildren(); st.setAttribute('aria-label', stars + ' of 3 stars');

    $('sAcc').textContent = acc + '%'; $('sScore').textContent = R.pts.toLocaleString('en'); $('sPerf').textContent = R.perfect + ' of ' + R.targets.length; $('sCombo').textContent = R.maxCombo;
    $('sLand').textContent = R.landDead + ' of ' + R.lands + ' dead on';
    $('sAvg').textContent = R.offs.length ? avg === 0 ? 'on time' : Math.abs(avg) + ' ms ' + (avg > 0 ? 'late' : 'early') : 'no hits';
    const next = [50, 75, 90].find(v => v > acc), near = $('near');
    near.hidden = !(next && next - acc <= 6 && R.offs.length); if (!near.hidden) near.textContent = `${next - acc} ${next - acc === 1 ? 'point' : 'points'} from ${[50, 75, 90].indexOf(next) + 1} ${next === 50 ? 'star' : 'stars'}. One more?`;
    fails = stars === 0 ? fails + 1 : 0;
    const was = save.best[flow.id] || 0; if (stars === 3 && bpm > was) { save.best[flow.id] = bpm; keep(); }

    window.__ttbLast = { acc, stars, avg, perfect: R.perfect, strays: R.strays, maxCombo: R.maxCombo, pts: R.pts, land: R.landDead + '/' + R.lands, crowd: R.crowd };
  }
  function showBest(isNew) { const b = save.best[flow.id], e = $('best'); e.replaceChildren(); if (!b) { e.textContent = `No record on ${flow.n} yet. Three stars sets one.`; return; } const s = document.createElement('b'); s.textContent = b + ' BPM'; e.append(isNew ? 'New record on ' : 'Your record on ', flow.n, ': ', s); }

  // ---- practice along: famous instrumentals near this tempo and feel (YouTube search links; tempos are approximate)
  function showBeats(f) {
    const e = $('beats'); e.replaceChildren(); if (f.song) return;
    const odd = !/^(4\/4|12\/8)/.test(f.m), feel = odd ? 'odd' : f.sub === 3 || f.sub === 6 || f.m.startsWith('12/8') ? 'shuffle' : 'straight', meter = f.m.split(':')[0];
    let pool = BEATS.filter(b => b.feel === feel && (!odd || b.meter === meter)); if (odd && !pool.length) pool = BEATS.filter(b => b.feel === 'odd');
    const dist = b => odd ? 0 : Math.abs((b.halfTime ? b.bpm / 2 : b.bpm) - f.bpm);

    e.append('Practice along:');
    list.forEach(b => { const a = document.createElement('a'); a.href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(b.artist + ' ' + b.song + ' instrumental'); a.target = '_blank'; a.rel = 'noopener';
      const sm = document.createElement('small'); sm.textContent = (b.bpm ? '~' + b.bpm : '') + (b.halfTime ? ' half-time' : '') + (b.meter ? (b.bpm ? ' · ' : '') + b.meter : ''); a.append(b.artist + ' – ' + b.song, sm); e.append(a); });
  }

  // ---- controls
  function setBpm(v) { bpm = Math.min(220, Math.max(40, v)); $('bpmOut').firstChild.textContent = bpm; if (T && T.notes[0] && T.notes[0].wave) paintWaves(); }
  const GRID = { 3: 'triplets', 4: '16ths', 5: 'quintuplets', 6: 'sextuplets', 12: '16ths + triplets', 20: '16ths + quintuplets' };
  function pick(f) {
    if (state === 'count' || state === 'play') stopRound(); flow = f; fails = 0; state = 'idle'; round = null;
    $('lvSel').value = f.id; setBpm(Math.max(f.bpm, save.best[f.id] || 0));
    const tip = $('tip'), b = document.createElement('b'); b.textContent = f.song ? `your record · ${f.song.words.filter(w => w.star).length} starred words` : `${f.m} · ${GRID[f.sub] || f.sub} · ${f.p.length} bars${f.sw ? ' · swing' : ''}${f.late ? ' · ' + f.late + ' ms behind' : ''}${f.dr ? ' · microtimed' : ''}`;
    tip.replaceChildren(b, f.tip + ' ', Object.assign(document.createElement('span'), { textContent: '(' + f.f + ')' }));
    showBeats(f); save.ch2 = chIx; save.lv = f.id; keep();
    drawTrack(); resetTiles(); $('result').hidden = true; $('hint').hidden = false; say('Ready', ''); hud(); chooseBeat();
  }
  function pickCh(c, id) {
    chIx = c; [...$('chs').children].forEach((b, i) => { b.classList.toggle('sel', i === c); b.classList.toggle('blue', i === c); b.setAttribute('aria-pressed', i === c); });
    { const tb = $('chs'), b = tb.children[c]; if (b) tb.scrollLeft = Math.max(0, b.offsetLeft - tb.clientWidth / 2 + b.offsetWidth / 2); }

    CHAPTERS[c].l.forEach((l, i) => { const o = document.createElement('option'); o.value = l.id; o.textContent = `${CHAPTERS[c].all ? '' : c + '.'}${i + 1} ${l.n}${save.best[l.id] ? ' ★' : ''}`; sel.append(o); });

  }
  function step(d) {
    const L = CHAPTERS[chIx].l, i = L.indexOf(flow) + d;

  }
  CHAPTERS.forEach((c, i) => { const b = document.createElement('button'); b.className = 'ob tab'; b.title = c.d; const n = document.createElement('small'); n.textContent = c.l.length; b.append(c.n, n); b.addEventListener('click', () => pickCh(i)); $('chs').append(b); });
  document.querySelectorAll('.ob').forEach(originize);
  $('lvSel').addEventListener('change', e => { pick(CHAPTERS[chIx].l.find(l => l.id === e.target.value)); e.target.blur(); });
  $('prevLv').addEventListener('click', () => step(-1));
  $('nextLv').addEventListener('click', () => step(1));
  $('slower').addEventListener('click', () => { if (state === 'idle' || state === 'done') setBpm(bpm - 5); });
  $('faster').addEventListener('click', () => { if (state === 'idle' || state === 'done') setBpm(bpm + 5); });
  $('actMain').addEventListener('click', () => { setBpm(bpm + (+$('actMain').dataset.d || 0)); start(); });
  $('actAlt').addEventListener('click', () => start());
  $('actNext').addEventListener('click', () => step(1));

  // the whole screen is the button: any press outside a control taps (or starts a round)

  document.addEventListener('pointerdown', e => {

})();
