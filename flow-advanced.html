<script>
document.addEventListener('DOMContentLoaded', function () {
/* Maintenance curtain, same as landing-beat-meter.html and studio.html (#mxGate). Client-side curtain, not a lock. */
(function () {
  try { if (localStorage.getItem('metrobar.motion') === 'off') document.documentElement.classList.add('mo-off'); } catch (e) {}
  var C = window.ZONE_CONFIG || {}; if (!C.maintenance) return;
  var de = document.documentElement; de.classList.add('mx');
  var st = document.createElement('style');
  st.textContent = 'html.mx:not(.mx-ok), html.mx:not(.mx-ok) body { overflow: hidden !important; }' +
    '#mxGate { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; padding: 24px; background: #eef0ec; color: #15171a; font: 400 16px/1.5 system-ui, sans-serif; text-align: center; }' +
    '#mxGate .in { display: grid; gap: 14px; justify-items: center; max-width: 26rem; }' +
    '#mxGate .wm { font-weight: 800; font-size: clamp(1.6rem, 8vw, 2.6rem); text-transform: uppercase; }' +
    '#mxGate .t { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; max-width: 18rem; } #mxGate .t i { height: 8px; border-radius: 4px; background: #d3d6d1; } #mxGate .t i:last-child { background: #af0000; }' +
    '#mxGate .nt { color: #af0000; font-size: .9rem; } #mxGate h1 { margin: 6px 0 0; font-size: 1.15rem; } #mxGate p { margin: 0; color: #5d636a; }' +
    '#mxGate a { margin-top: 10px; color: #5d636a; font-size: .85rem; text-decoration: underline; text-underline-offset: 3px; }' +
    'html.mx-ok #mxGate { display: none; }';
  document.head.appendChild(st);
  var g = document.createElement('div'); g.id = 'mxGate'; g.setAttribute('role', 'dialog'); g.setAttribute('aria-label', 'MetroBar is under maintenance');
  g.innerHTML = '<div class="in"><div class="wm">MetroBar</div><div class="t"><i></i><i></i><i></i><i></i></div><h1>Getting ready</h1><p>MetroBar is being polished before launch. Check back soon.</p><p class="nt" hidden></p><a href="landing-beat-meter.html">Signed up already? Sign in</a></div>';
  document.body.appendChild(g);
  /* Coming soon (Bennie 2026-11-18): an account made before ZONE_CONFIG.maintenanceSince gets through, so does an admin;
     an account made later (or nobody signed in) sees the curtain. Sign-up is off while maintenance is on. */
  var CUT = Date.parse(C.maintenanceSince || '') || 0;
  var me = function () { try { var j = JSON.parse(localStorage.getItem('metrobar.zoneAuth') || 'null'); var u = j && (j.user || j.currentSession && j.currentSession.user); return u && u.id ? u : null; } catch (e) { return null; } };
  var uid = function () { var u = me(); return u ? u.id : ''; };
  var nt = g.querySelector('.nt');
  var say = function (t) { nt.textContent = t || ''; nt.hidden = !t; };
  var open = function (id) { de.classList.add('mx-ok'); say(''); try { sessionStorage.setItem('metrobar.mxOk', id); } catch (e) {} };
  var shut = function (t) { de.classList.remove('mx-ok'); say(t); try { sessionStorage.removeItem('metrobar.mxOk'); } catch (e) {} };
  var check = function () {
    var u = me(); if (!u) { shut(''); return; }
    var made = Date.parse(u.created_at || '') || 0;
    if (CUT && made && made < CUT) { open(u.id); return; }
    try { if (sessionStorage.getItem('metrobar.mxOk') === u.id) de.classList.add('mx-ok'); } catch (e) {}
    if (!C.url || !C.key) return;
    fetch(C.url + '/rest/v1/admins?select=user_id&user_id=eq.' + encodeURIComponent(u.id), { headers: { apikey: C.key, Authorization: 'Bearer ' + C.key } })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (rows) { if (rows && rows.length) open(u.id); else shut('This account was made after sign-ups closed. It opens at launch.'); })
      .catch(function () {});
  };
  check();
  window.addEventListener('focus', check);
  window.addEventListener('storage', function (e) { if (e.key === 'metrobar.zoneAuth') check(); });
})();
});

d-dle of the night I hear the bass drum",pat:"xxX|xxx|Xxx|xXx",meter:"4/4"},{raw:"And the cor-ners of the room are get-ting smok-y",pat:"xxX|xxx|Xxx|xXx",meter:"4/4"}]},{key:"b1twos",name:"Twos over triplets",tip:"Triplets with a stress on every second syllable. Hold the 5th and the last syllable for two slots.",section:"trip",bpm:80,sub:3,lines:[{raw:"Lock it in and stay, roll it back and play",pat:"XxX|xX.|XxX|xX.",meter:"4/4"},{raw:"Hold the line and wait, get the bag and skate",pat:"XxX|xX.|XxX|xX.",meter:"4/4"},{raw:"Keep a stead-y face, nev-er lose the pace",pat:"XxX|xX.|XxX|xX.",meter:"4/4"}]},{key:"b1mix",name:"Six, three, two",tip:"Fill the whole triplet bar, grouped 6 + 3 + 2 + 1. Stress the 1, the 3, the 4 and the very last let, and hold it.",section:"trip",bpm:80,sub:3,lines:[{raw:"Run-ning a-round with the lights on the free-way, gone",pat:"Xxx|xxx|Xxx|XxX",meter:"4/4"},{raw:"Pick-ing it up at the end of the sea-son, done",pat:"Xxx|xxx|Xxx|XxX",meter:"4/4"},{raw:"Count-ing my bless-ings and now I am read-y, go",pat:"Xxx|xxx|Xxx|XxX",meter:"4/4"}]},{key:"b1six4",name:"Fours over sixes",tip:"Split every beat into six and group them in fours: short, long, short, long. Six stresses against four beats.",section:"trip",bpm:70,sub:6,lines:[{raw:"Mov-ing side-ways, nev-er land-ing where you're look-ing",pat:"Xx..Xx|..Xx..|Xx..Xx|..Xx..",meter:"4/4"},{raw:"Float-ing o-ver ev-ery bar line, nev-er stop-ping",pat:"Xx..Xx|..Xx..|Xx..Xx|..Xx..",meter:"4/4"},{raw:"Split-ting ev-ery beat in six-es, count-ing fours now",pat:"Xx..Xx|..Xx..|Xx..Xx|..Xx..",meter:"4/4"}]},{key:"b1six5",name:"Group five twist",tip:"Same fours over sixes, but the fifth group puts its stress on the second syllable. One twist and the pattern wakes up.",section:"trip",bpm:70,sub:6,lines:[{raw:"Break-ing pat-terns, twist-ing time-lines, re-wound, roll-ing",pat:"Xx..Xx|..Xx..|Xx..xX|..Xx..",meter:"4/4"},{raw:"Tak-ing cor-ners, hold-ing bal-ance, a-lone, drift-ing",pat:"Xx..Xx|..Xx..|Xx..xX|..Xx.." ength: five beats, then three, then a rocking six-eight. Keep the pulse, let the bar move.",section:"trip",bpm:120,sub:4,lines:[{raw:"Five beats wide, I take my time and stretch the line out",pat:"X.X.|XxXx|XxXx|X...|X...",meter:"5/4"},{raw:"Waltz it in three, then we flee",pat:"X.xx|Xxx.|X...",meter:"3/4"},{raw:"Roc-king the boat and we stay af-loat",pat:"Xxx.X.|xxXxX.",meter:"6/8"}]},{key:"afrohat",name:"Hats in triplets",tip:"The same hi-hat idea moved onto triplets: it stops marching and starts to swing. Seven words, on the hat hits only.",section:"trip",bpm:75,sub:3,lines:[{raw:"Swing it, lift it, roll it home",pat:"X.x|.X.|xX.|x.X",meter:"4/4"},{raw:"Tap it, turn it, bring it round",pat:"X.x|.X.|xX.|x.X",meter:"4/4"},{raw:"Spin it, flip it, hit the ground",pat:"X.x|.X.|xX.|x.X",meter:"4/4"}]},{key:"afrotrip",name:"Afro triplet roll",tip:"Hold the first word, then roll triplets into the next beat. The last word sits on the a of 4 and pulls you into the next bar.",section:"trip",bpm:75,sub:3,lines:[{raw:"Heat, roll with the hips, slow, deep, let go",pat:"X..|Xxx|X.X|XxX",meter:"4/4"},{raw:"Drums, talk to the feet, warm, loud, wind down",pat:"X..|Xxx|X.X|XxX",meter:"4/4"},{raw:"Dust, kick off the ground, spin, clap, then rise",pat:"X..|Xxx|X.X|XxX",meter:"4/4"}]},{key:"drilltrip",name:"Drill triplets",tip:"On a half-time drill beat, roll the words in threes and lean on the first of each three. Land on beat 4 and stop.",section:"trip",bpm:73,sub:3,lines:[{raw:"Dip in the cor-ner and hop on the road",pat:"Xxx|Xxx|Xxx|X..",meter:"4/4"},{raw:"Sha-dows are mo-ving and no-bo-dy knows",pat:"Xxx|Xxx|Xxx|X..",meter:"4/4"},{raw:"Hi-ding the en-gine and rol-ling it slow",pat:"Xxx|Xxx|Xxx|X..",meter:"4/4"}]},{key:"drumshuf",name:"Shuffle like a drummer",tip:"Rap like a drummer plays a shuffle: on the triplet grid, mostly first and last of each three. Every stressed word is a drum hit.",section:"trip",bpm:77,sub:3,lines:[{raw:"Thump it, crack, thump it, crack it",pat:"X.x|X..
