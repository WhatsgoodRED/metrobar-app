meter:"5/8"},{raw:"Cut it in half",pat:"X.x.x.|X...",meter:"5/8"}]},{key:"b7sev43",name:"Seven eight, four plus three",tip:"Seven eighths split long then short: count 1 2 3 4, 1 2 3. Land the last word on the short group.",section:"odd",bpm:90,sub:4,lines:[{raw:"Stretch it out, then cut it short",pat:"X.x.X.x.|X.x.X.",meter:"7/8:4+3"},{raw:"Four to climb, then three to fall",pat:"X.x.X.x.|X.x.X.",meter:"7/8:4+3"},{raw:"Hold it long and let it go",pat:"X.x.X.x.|X.x.X.",meter:"7/8:4+3"}]},{key:"b8five",name:"Five-eight groups",tip:"A bar of five 8ths, counted 1-2-3, 1-2. Stress the start of each group and come back to the 1 sooner than you expect.",section:"odd",bpm:90,sub:4,lines:[{raw:"Threads ac-ross the frame",pat:"X.x.X.|x.X.",meter:"5/8"},{raw:"Limp in-to the one",pat:"X.X.x.|x.X.",meter:"5/8"},{raw:"Count it short and odd",pat:"X.x.X.|x.X.",meter:"5/8"}]},{key:"b8suite",name:"Odd-meter suite",tip:"Every bar has its own length: five 8ths, then seven, then a short two-four. Keep the pulse and let the bar line move.",section:"odd",bpm:90,sub:4,lines:[{raw:"Odd steps, keep on",pat:"X.X.X.|X...",meter:"5/8"},{raw:"Two and two and three to land",pat:"X.x.|X.x.|X.x.X.",meter:"7/8"},{raw:"Short and sharp, done",pat:"X.x.|X.X.",meter:"2/4"}]},{key:"b1five4",name:"Five over four",tip:"Keep repeating the five-eight cell on a normal 4/4 beat. It drifts across the bar line and starts somewhere new every bar.",section:"poly",bpm:90,sub:4,lines:[{raw:"Odd time on a straight beat",pat:"X..x|..x.|x.X.|.x..",meter:"4/4"},{raw:"Watch the rhy-thm slide a-way",pat:"x.x.|X..x|..x.|x.X.",meter:"4/4"},{raw:"Then it lands back on one",pat:".x..|x.x.|X..x|..x.",meter:"4/4"}]},{key:"b1stab",name:"Stab words",tip:"Two-beat cells that stop hard on 2 and 4. Hit the last word of each cell and leave the space after it.",section:"poly",bpm:90,sub:4,lines:[{raw:"Hear me out, I came from far",pat:"X.x.|X...|x.Xx|X...",meter:"4/4"},{raw:"E-very vo-wel, mine to keep",pat:"X.x.|Xx..|X.x.|X...",meter:"4/4"},{raw:"Dif-fe-rent town, same old beat",pat:"X.xx|X...|X.X.|X...",meter:"4/4"}]},{key:"jb1",name:"Jump the one",tip:"The first word comes a 16th early, on the a before the 1, and holds over the downbeat. Then the 16ths run from the e.",section:"poly",bpm:90,sub:4,lines:[{raw:"Up and get your bo-dy mov-ing, hit the drum",pat:"(X)|.xXx|XxXx|XxX.|....",meter:"4/4"},{raw:"Jump and let the rhy-thm lift you off the ground",pat:"(X)|.xXx|XxXx|XxX.|....",meter:"4/4"},{raw:"Now we turn the cor-ner dan-cing through the night",pat:"(X)|.xXx|XxXx|XxX.|....",meter:"4/4"}]},{key:"dsp1",name:"Across the bar line",tip:"The phrase starts on beat 3 and runs over the bar line, landing on beat 2. Read the bar from the middle: the second half starts the sentence, the first half finishes it.",section:"poly",bpm:85,sub:4,lines:[{raw:"o-ver to the two. Start it on the three and roll it",pat:"Xxxx|X...|Xxxx|XxXx",meter:"4/4"},{raw:"a-cross the bar line. Wait a beat and then I car-ry",pat:"xXxx|X...|XxXx|xxXx",meter:"4/4"},{raw:"in-to the new bar. Half a bar a-head I'm stretch-ing",pat:"Xxxx|X...|XxXx|XxXx",meter:"4/4"}]},{key:"b1five16",name:"Fives against four",tip:"Every 16th filled, grouped in fives: the stress moves one 16th later every group, and the last one lands on the a of 4.",section:"poly",bpm:70,sub:4,lines:[{raw:"Cal-cu-lat-ing it, nev-er giv-ing up, dec-o-rat-ing it, done",pat:"Xxxx|xXxx|xxXx|xxxX",meter:"4/4"},{raw:"Hid-den in the code, nev-er read a-loud, on-ly in the dark, now",pat:"Xxxx|xXxx|xxXx|xxxX",meter:"4/4"},{raw:"Scram-ble ev-ery line, shuf-fle ev-ery word, read it if you can, go",pat:"Xxxx|xXxx|xxXx|xxxX",meter:"4/4"}]},{key:"b1code3",name:"Threes from the e",tip:"Groups of three against the four, but start one 16th late, on the e of 1. The pattern never lines up with the beat until the end.",section:"poly",bpm:75,sub:4,lines:[{raw:"Mes-sa-ges hid-den in cyp-her-text, no-bo-dy knows",pat:".Xxx|XxxX|xxXx|xX..",meter:"4/4"},{raw:"Loc-king it up in a ca-bi-net, un-der the stairs",pat:".Xxx|xxxX|xxXx|xX..",meter:"4/4"},{raw:"Twis-ting the let-ters a-round till the an-swer shows",pat:".Xxx|XxxX|xxXx|.X..",meter:"4/4"}]},{key:"dh332",name:"Island bounce 3-3-2",tip:"The dancehall pulse is 3 + 3 + 2. Lean on those three hits and let the small words fall between.",section:"poly",bpm:103,sub:4,lines:[{raw:"Move your waist when the bass be-gin to roll",pat:"X.xX|xxXx|Xx..|..X.",meter:"4/4"},{raw:"Is-land heat with a bounce un-der e-very step",pat:"Xx.X|xxX.|Xx.X|x.X.",meter:"4/4"},{raw:"Sway it left, sway it right, then you dip it low",pat:"X.xX|..Xx|XxxX|x.X.",meter:"4/4"}]},{key:"offsing",name:"Sing it off the beat",tip:"A sung hook that leans on the in-between spots: the strong syllables sit on the e and the and, never on the 1. Float over the drums.",section:"poly",bpm:88,sub:4,lines:[{raw:"Drive through mid-night streets with the win-dow",pat:".X..|x.X.|x.Xx|xX.x",meter:"4/4"},{raw:"Fade in slow like sun on the wa-ter",pat:".X..|x.X.|x.Xx|xX.x",meter:"4/4"},{raw:"Hum it soft till ev-ery-thing's fine now",pat:".X..|x.X.|x.Xx|xX.x",meter:"4/4"}]},{key:"dispcell",name:"Cell on the beat",tip:"One strong syllable, then two quick ones: long, short-short. Four cells, every strong word right on the beat.",section:"poly",bpm:95,sub:4,lines:[{raw:"Bounce with the kick and the snare in the mid-dle now",pat:"X.xx|X.xx|X.xx|X.xx",meter:"4/4"},{raw:"Walk-ing a line with a weight on my back a-gain",pat:"X.xx|X.xx|X.xx|X.xx",meter:"4/4"},{raw:"Down in the base-ment we build-ing it up from scratch",pat:"X.xx|X.xx|X.xx|X.xx",meter:"4/4"}]},{key:"disp8",name:"Shift it an 8th",tip:"The same cell started an 8th late: two quick ones, then the strong word on the and. Every stress lands between the beats.",section:"poly",bpm:95,sub:4,lines:[{raw:"With a step, then a skip, then a hop, then a drop",pat:"xxX.|xxX.|xxX.|xxX.",meter:"4/4"},{raw:"Off the one, on the and, ev-ery stress in the gap",pat:"xxX.|xxX.|xxX.|xxX.",meter:"4/4"},{raw:"Let it lean, let it lag, let it lurch, let it land",pat:"xxX.|xxX.|xxX.|xxX.",meter:"4/4"}]},{key:"drill332",name:"Drill hats 3-3-2",tip:"Rap the drill hi-hat: two groups of 3-3-2 in one bar. Six hard words, every one on a hat hit.",section:"poly",bpm:75,sub:4,lines:[{raw:"Step back, slide, step back, glide",pat:"X..X|..X.|X..X|..X.",meter:"4/4"},{raw:"Hats roll, kick, hats roll, snare",pat:"X..X|..X.|X..X|..X.",meter:"4/4"},{raw:"Duck low, spin, duck low, win",pat:"X..X|..X.|X..X|..X.",meter:"4/4"}]},{key:"growcell",name:"Add a cell",tip:"Four quick syllables, a gap, then a pair. Every bar the pattern grows by one more pair, and the gaps keep it readable.",section:"poly",bpm:100,sub:4,lines:[{raw:"Seeds are sleep-ing, wak-ing",pat:"Xxxx|.Xx.|....|....",meter:"4/4"},{raw:"Roots are grow-ing, deep-er, strong-er",pat:"Xxxx|.Xx.|Xx..|....",meter:"4/4"},{raw:"Stems are ris-ing, green-er, tall-er, bloom-ing",pat:"Xxxx|.Xx.|Xx.X|x...",meter:"4/4"}]},{key:"evolve4",name:"Evolving pattern",tip:"One idea that keeps growing: four quick syllables, then pairs, one more pair each time. It runs over the bar lines and lands after four bars.",section:"poly",bpm:100,sub:4,lines:[{raw:"Start-ing small-er, grow-ing, add-ing",pat:"....|..Xx|xx.X|x.Xx",meter:"4/4"},{raw:"on top, lay-er, high-er, now it's get-ting big-ger",pat:"xx.X|x.Xx|.Xxx|x.Xx",meter:"4/4"},{raw:"long-er, wid-er, build it up and stack it, keep",pat:".Xx.|Xx.X|xxx.|Xx.X",meter:"4/4"},{raw:"it go-ing till it drops, the floor gives way",pat:"x.Xx|.Xx.|X.xX|.xX.",meter:"4/4"}]},{key:"halfbar",name:"Half-bar rhymes",tip:"Two short lines in one bar, seven syllables each, and both end on the same sound. Rhyme every two beats, breathe in the gap.",section:"poly",bpm:115,sub:4,lines:[{raw:"Dust the han-dle, find the print, cir-cle round the miss-ing hint",pat:"XxXx|XxX.|XxXx|XxX.",meter:"4/4"},{raw:"Ev-ery foot-step leaves a trace, ev-ery shad-ow has a face",pat:"XxXx|XxX.|XxXx|XxX.",meter:"4/4"},{raw:"Pull the file and check the time, line it up a-gainst the crime",pat:"XxXx|XxX.|XxXx|XxX.",meter:"4/4"}]},{key:"cad3364",name:"Phrases across the bar",tip:"Same 16 beats, cut 3 + 3 + 6 + 4. The lines end on beat 3, then beat 2, then run long, and only the last one meets the bar line again.",section:"poly",bpm:127,sub:4,lines:[{raw:"Short line, then a break, back in",pat:"X.X.|x.x.|X...|X.x.",meter:"4/4"},{raw:"a-gain, wait, this one runs a",pat:"x.X.|X...|x.X.|X.x.",meter:"4/4"},{raw:"lit-tle long-er, runs the bar",pat:"X.x.|X.x.|X.x.|X...",meter:"4/4"},{raw:"then the last one lands on four",pat:"x.x.|X.x.|X.x.|X...",meter:"4/4"}]},{key:"frm0",name:"Short-long threes",tip:"A short and a long, over and over: the cell is three 16ths, so it slides against the four beats. Lean on every long one.",section:"poly",bpm:85,sub:4,lines:[{raw:"I keep the beat a-live in-side my chest",pat:"xX.x|X.xX|.xX.|xX..",meter:"4/4"},{raw:"The mor-ning train is late a-gain to-day",pat:"xX.x|X.xX|.xX.|xX..",meter:"4/4"},{raw:"You hear the click and then you feel the step",pat:"xX.x|X.xX|.xX.|xX..",meter:"4/4"}]},{key:"frm1",name:"Start on the long",tip:"Same three-16th cell, but this bar starts in the middle of it: the 1 gets the long note. Feel how the cell no longer lines up with the bar.",section:"poly",bpm:85,sub:4,lines:[{raw:"Hold the line and keep it mov-ing, nev-er stop",pat:"X.xX|.xX.|xX.x|X.xX",meter:"4/4"},{raw:"Sun-day mor-ning, cof-fee black and pa-per thin",pat:"X.xX|.xX.|xX.x|X.xX",meter:"4/4"},{raw:"Count the sha-dows, step a-round them, keep the time",pat:"X.xX|.xX.|xX.x|X.xX",meter:"4/4"}]},{key:"frm2",name:"Start on the e",tip:"The third way in: rest on the 1, the cell starts on the e. Three bars, three starting points, one rhythm.",section:"poly",bpm:85,sub:4,lines:[{raw:"A-round the block the ci-ty hums a song",pat:".xX.|xX.x|X.xX|.xX.",meter:"4/4"},{raw:"Be-neath the bridge the ri-ver keeps its pace",pat:".xX.|xX.x|X.xX|.xX.",meter:"4/4"},{raw:"My pen is fast, my pa-per near-ly full",pat:".xX.|xX.x|X.xX|.xX.",meter:"4/4"}]},{key:"lcw1",name:"Victory lap",tip:"Live and loud: punch every stressed word, and land a two-syllable rhyme across beats 3 and 4.",section:"poly",bpm:73,sub:4,lines:[{raw:"Put the hours in and now we ce-leb-rate it",pat:"XxXx|.xXx|Xxx.|X...",meter:"4/4"},{raw:"E-very sin-gle night I sat a-lone and wai-ted",pat:"XxXx|XxXx|XxX.|X...",meter:"4/4"},{raw:"Look a-round the room we real-ly made it made it",pat:"XxXx|XxXx|XxX.|X...",meter:"4/4"}]},{key:"b4kdq",name:"Dotted quarters over three bars",tip:"One hit every six 16ths, each with a short tail: it does not fit a bar, so it lands somewhere new each bar and only comes home after three bars.",section:"poly",bpm:80,sub:4,lines:[{raw:"Kick drum, stomp-ing, lands on",pat:"Xx..|..Xx|....|Xx..",meter:"4/4"},{raw:"Shift-ing lat-er, each bar",pat:"..Xx|....|Xx..|..Xx",meter:"4/4"},{raw:"Then it comes home",pat:"....|Xx..|..Xx|....",meter:"4/4"}]},{key:"b4kick",name:"Kick cell, three-bar cycle",tip:"Quick-quick-long, then one more: a six-16th cell rapped like a kick pattern. It drifts across the bar line and lines up again after three bars.",section:"poly",bpm:75,sub:4,lines:[{raw:"Met-al in the base-ment, it's re-peat-ing as",pat:"Xxx.|x.Xx|x.x.|Xxx.",meter:"4/4"},{raw:"a cy-cle that won't fit in-to a bar, so",pat:"x.Xx|x.x.|Xxx.|x.Xx",meter:"4/4"},{raw:"I just ride it till it lines up a-gain",pat:"x.x.|Xxx.|x.Xx|x.x.",meter:"4/4"}]},{key:"b4meta2",name:"Meta-rhythm remix",tip:"Same 16ths again, new accent shapes: 1, the and of 2, 4; then only the and of 1 and 3; then every third 16th rolling over the beat.",section:"poly",bpm:80,sub:4,lines:[{raw:"Same old rhy-thm, but the em-pha-sis is chang-ing shape",pat:"Xxxx|xxXx|xxxx|X...",meter:"4/4"},{raw:"In the gaps I find the space to make the pat-tern breathe",pat:"xxXx|xxxx|xxXx|x...",meter:"4/4"},{raw:"Shift-ing it, lift-ing it, mov-ing it, prov-ing it, now",pat:"XxxX|xxXx|xXxx|X...",meter:"4/4"}]},{key:"b4n234",name:"Number code 2-3-4",tip:"Long syllables are 8ths, the short one is a 16th break: 2 long + short, 3 long + short, 4 long + short, again. The groups never fit the beat.",section:"poly",bpm:80,sub:4,lines:[{raw:"Slow down, then stretch it out and add a",pat:"X.x.|xX.x|.x.x|X.x.",meter:"4/4"},{raw:"fourth step, so two more, then three in a",pat:"x.x.|xX.x|.xX.|x.x.",meter:"4/4"},{raw:"row, then four long beats and two to go",pat:"xX.x|.x.x|.xX.|x.x.",meter:"4/4"}]},{key:"b4n2",name:"Long, long, short",tip:"Only the number 2: long, long, short = five 16ths. Every group starts one 16th earlier against the beat until the three bars close.",section:"poly",bpm:80,sub:4,lines:[{raw:"Pace off, then slide back, the line drifts, it falls",pat:"X.x.|xX.x|.xX.|x.xX",meter:"4/4"},{raw:"late, the beat waits, but five steps, and back",pat:".x.x|X.x.|xX.x|.xX.",meter:"4/4"},{raw:"home, then bars fold, so all three lines close",pat:"x.xX|.x.x|X.x.|xX..",meter:"4/4"}]},{key:"b4poly",name:"3 over 4, no reset",tip:"Every 16th filled, the stress on every third one, and it never resets: the stress walks across all three bars and only lands home at the end.",section:"poly",bpm:66,sub:4,lines:[{raw:"Do-ing too much and I know it, I'm pil-ing it, stack-ing it up",pat:"XxxX|xxXx|xXxx|XxxX",meter:"4/4"},{raw:"and the list of my plans keeps on grow-ing, I nev-er stop try-ing",pat:"xxXx|xXxx|XxxX|xxXx",meter:"4/4"},{raw:"to squeeze in a lit-tle bit more of the day, but the clock says no",pat:"xXxx|XxxX|xxXx|xXxx",meter:"4/4"}]},{key:"b4prun",name:"Let it run",tip:"The same three-beat rhythm with no rest: it starts one beat earlier every bar, the tension builds, and after three bars it is back on the 1.",section:"poly",bpm:80,sub:4,lines:[{raw:"Nev-er break, I let it flow, drift-ing off",pat:"X.xx|.xX.|x.X.|X.xx",meter:"4/4"},{raw:"the edge of time, ten-sion builds a-cross",pat:".xX.|x.X.|X.xx|.xX.",meter:"4/4"},{raw:"the bar, fi-nal-ly it falls in place",pat:"x.X.|X.xx|.xX.|x.X.",meter:"4/4"}]},{key:"sev16",name:"Sevens over four",tip:"A 7-step cell (three, rest, two, rest) runs over the 16ths, so its accent lands somewhere new every bar. Keep the stream even and lean on the first of each cell.",section:"poly",bpm:77,sub:4,lines:[{raw:"Turn-ing it o-ver, burn-ing the clock down, catch-ing",pat:"Xxx.|xx.X|xx.x|x.Xx",meter:"4/4"},{raw:"light, so the rhy-thm will drift but cy-cles come",pat:"x.xx|.Xxx|.xx.|Xxx.",meter:"4/4"},{raw:"round to sev-en a-gain, and nev-er the same twice",pat:"xx.X|xx.x|x.Xx|x.xx",meter:"4/4"}]},{key:"five16",name:"Fives over four",tip:"Groups of five 16ths (three, one, rest) against a bar of sixteen. Each bar starts the cell at a new spot, so count the fives, not the beat.",section:"poly",bpm:77,sub:4,lines:[{raw:"Mov-ing in fives, count-ing a-cross, sway-ing the bar, slide",pat:"Xxx.|xXxx|.xXx|x.xX",meter:"4/4"},{raw:"un-der the drum-line, it bends, trac-ing a curve, chas-ing",pat:"xx.x|Xxx.|xXxx|.xXx",meter:"4/4"},{raw:"down, and find-ing the one, tak-ing it slow, fol-low-ing",pat:"x.xX|xx.x|Xxx.|xXxx",meter:"4/4"}]},{key:"slick332",name:"3-3-2 in 16ths",tip:"Every 16th is filled, but the stresses fall 3, 3, 2, 3, 3, 2. The run stays smooth while the accents pull against the beat.",section:"poly",bpm:77,sub:4,lines:[{raw:"Prac-ti-cal, tac-ti-cal, smooth as sil-ver in mo-tion and flo-wing",pat:"XxxX|xxXx|XxxX|xxXX",meter:"4/4"},{raw:"Can-dle-light flic-ke-ring, slow it down and then speed it up quic-kly",pat:"XxxX|xxXx|XxxX|xxXX",meter:"4/4"},{raw:"Cor-ner by cor-ner I turn it shar-per than win-dows of crys-tal",pat:"XxxX|xxXx|XxxX|xxXX",meter:"4/4"}]},{key:"glt1",name:"Three-beat phrases",tip:"Every phrase is three beats long and ends on the same word, so it starts one beat earlier each time. After three bars (four phrases) it lines up with the 1 again.",section:"poly",bpm:85,sub:4,lines:[{raw:"Built in the heat for gold, dug through the",pat:"X.xx|X.xX|....|X.xx",meter:"4/4"},{raw:"dirt for gold, fought with the tide for gold",pat:"X.xX|....|X.xx|X.xX",meter:"4/4"},{raw:"gave up the sleep for gold",pat:"....|X.xx|X.xX|....",meter:"4/4"}]},{key:"flow5",name:"Flow in five",tip:"Polymetric: each phrase is five beats long over a four-beat bar. The rhyme lands on 1 in bar two and on 2 in bar three: it walks forward.",section:"poly",bpm:95,sub:4,lines:[{raw:"Five beats long, this phrase is spill-ing",pat:"X.x.|x.x.|x.x.|x.x.",meter:"4/4"},{raw:"out, now it starts one beat late",pat:"X...|X.x.|x.x.|x.x.",meter:"4/4"},{raw:"e-ven more, then a third one",pat:"x.x.|X...|X.x.|x.x.",meter:"4/4"}]},{key:"clave",name:"Clave pocket",tip:"Five words on the clave: three spread over beats 1 and 2, two on beats 3 and 4. The last bar flips it: two first, then three.",section:"poly",bpm:128,sub:4,lines:[{raw:"Feet move, hips sway, drop",pat:"X..X|..X.|..X.|X...",meter:"4/4"},{raw:"Three then two, keep time",pat:"X..X|..X.|..X.|X...",meter:"4/4"},{raw:"Now flip, two then three",pat:"..X.|X...|X..X|..X.",meter:"4/4"}]},{key:"quintmix",name:"Fives into 16ths",tip:"Five across beats 1 and 2, then straight 16ths on 3 and 4. Switch from floating to locked without rushing the change.",section:"poly",bpm:70,sub:20,lines:[{raw:"Lean-ing back slow-ly, then I'm pick-ing up the tem-po",pat:"{2}X.x.x.x.x.|Xxxx|Xxxx",meter:"4/4"},{raw:"Hang-ing in the air, now the six-teenths are com-ing in",pat:"{2}X.x.x.x.x.|Xxxx|Xxxx",meter:"4/4"},{raw:"Fives float a-cross two, then we split it four to a beat",pat:"{2}X.x.x.x.x.|Xxxx|Xxxx",meter:"4/4"}]},{key:"b6riff",name:"Stomp on the riff",tip:"Two-beat cells that stop dead on 2 and 4, like a heavy guitar riff that chugs and stops. Say both halves with the same shape.",section:"poly",bpm:95,sub:4,lines:[{raw:"Tune it low, let it ring",pat:"X.x.|X...|X.x.|X...",meter:"4/4"},{raw:"Hea-vy riff, hit the floor",pat:"X.x.|X...|X.x.|X...",meter:"4/4"},{raw:"Drop the string, feel it shake",pat:"X.x.|X...|X.x.|X...",meter:"4/4"}]},{key:"b6tres",name:"Afro tresillo",tip:"Six words in pairs: the stresses fall 3-3-2, 3-3-2 across the bar, the bounce of an afro drum pattern.",section:"poly",bpm:95,sub:4,lines:[{raw:"Warm sun, cool breeze, slow down",pat:"X..X|..X.|X..X|..X.",meter:"4/4"},{raw:"Hot sand, bare feet, step light",pat:"X..X|..X.|X..X|..X.",meter:"4/4"},{raw:"Gold beads, bright cloth, hands high",pat:"X..X|..X.|X..X|..X.",meter:"4/4"}]},{key:"b6vow3",name:"Vowels in threes",tip:"Groups of three 16ths with the rhyme vowel on the first of each. Two vowels take turns, then three, so the rhyme pattern runs against the beat.",section:"poly",bpm:80,sub:4,lines:[{raw:"Rol-ling in, ri-ding it, hol-ding it, fig-hting it, home",pat:"XxxX|xxXx|xXxx|X...",meter:"4/4"},{raw:"Goi-ng with, shi-ning with, glo-wing with, ti-ming it, right",pat:"XxxX|xxXx|xXxx|X...",meter:"4/4"},{raw:"Sho-wing it, play-ing it, free-ing it, ow-ning it, late",pat:"XxxX|xxXx|xXxx|X...",meter:"4/4"}]},{key:"b6dotx",name:"Dotted 8ths over the bar line",tip:"The dotted 8ths don't stop at the bar line: bar 2 starts two 16ths late, bar 3 one 16th late, and the pattern only comes home after three bars.",section:"poly",bpm:85,sub:4,lines:[{raw:"Wet street, dim lights, cars hiss",pat:"X..X|..X.|.X..|X..X",meter:"4/4"},{raw:"Rain falls, the bar slips",pat:"..X.|.X..|x..X|..X.",meter:"4/4"},{raw:"Lights blink, the town sleeps",pat:".X..|X..x|..X.|.X..",meter:"4/4"}]},{key:"b6five",name:"Fives over four",tip:'Every 16th has a syllable, but the accent comes every five: on the 1, the "e" of 2, the "+" of 3 and the "a" of 4.',section:"poly",bpm:70,sub:4,lines:[{raw:"Clap on the first of ev-ery five and the beat is gon-na slide off",pat:"Xxxx|xXxx|xxXx|xxxX",meter:"4/4"},{raw:"Count-ing it in a dif-fer-ent kind of cir-cle that I can turn",pat:"Xxxx|xXxx|xxXx|xxxX",meter:"4/4"},{raw:"Five is a lit-tle long-er than the four, wait for it to come round",pat:"Xxxx|xXxx|xxXx|xxxX",meter:"4/4"}]},{key:"b6fivex",name:"Fives across the bar line",tip:'The groups of five keep going over the bar line, bar 2 starts its accents on beat 2, bar 3 on the "a" of 1. It takes five bars to come home.',section:"poly",bpm:70,sub:4,lines:[{raw:"Fives are a lit-tle crook-ed and I like that a lot be-cause they",pat:"Xxxx|xXxx|xxXx|xxxX",meter:"4/4"},{raw:"nev-er land on one and they keep on go-ing round the whole bar line",pat:"xxxx|Xxxx|xXxx|xxXx",meter:"4/4"},{raw:"if you can count it out it takes five bars and then it fits a-gain",pat:"xxxX|xxxx|Xxxx|xXxx",meter:"4/4"}]},{key:"b7strun",name:"Run into the stop",tip:"Four quick syllables run straight into a hard stop on 2 and on 4. Nothing after the stop until the next cell.",section:"poly",bpm:95,sub:4,lines:[{raw:"Pick a side and stand, pick a side and stay",pat:"XxXx|X...|XxXx|X...",meter:"4/4"},{raw:"Ne-ver look a-way, ne-ver take a knee",pat:"XxXx|X...|XxXx|X...",meter:"4/4"},{raw:"Ham-mer on the floor, ham-mer on the door",pat:"Xxxx|X...|Xxxx|X...",meter:"4/4"}]},{key:"b7trestrip",name:"Tresillo, then 3 over 2",tip:"Beats 1-2: tresillo in 16ths, 3-3-2. Beats 3-4: switch to triplets and stress every second one. Two ways to fit three hits in two beats.",section:"poly",bpm:80,sub:12,lines:[{raw:"Count-ing it up in the base-ment, mov-ing slow-ly side-ways",pat:"X..x..x..X..|x..x..X..x..|X...x...X...|x...X...x...",meter:"4/4"},{raw:"Pick-ing it out of the pock-et, fold-ing, roll-ing, toss-ing",pat:"X..x..x..X..|x..x..X..x..|X...x...X...|x...X...x...",meter:"4/4"},{raw:"Tak-ing a step to the cor-ner, turn-ing, twist-ing, fall-ing",pat:"X..x..x..X..|x..x..X..x..|X...x...X...|x...X...x...",meter:"4/4"}]},{key:"b7triptres",name:"3 over 2, then tresillo",tip:"Flip it: triplets with every second one stressed first, then snap into the 3-3-2 tresillo for the landing.",section:"poly",bpm:80,sub:12,lines:[{raw:"Fold-ing, bend-ing, break-ing, pick-ing it up off the pave-ment",pat:"X...x...X...|x...X...x...|X..x..x..X..|x..x..X..x..",meter:"4/4"},{raw:"Rais-ing, lift-ing, climb-ing, stand-ing a-lone on the sum-mit",pat:"X...x...X...|x...X...x...|X..x..x..X..|x..x..X..x..",meter:"4/4"},{raw:"Sway-ing, lean-ing, glid-ing, cut-ting a-cross to the bor-der",pat:"X...x...X...|x...X...x...|X..x..x..X..|x..x..X..x..",meter:"4/4"}]},{key:"b7bartres",name:"Bar-long 3-3-2",tip:'Stretch the tresillo over the whole bar: three long "oh" words on 1, the and of 2, and 4, with quick 16ths in between.',section:"poly",bpm:85,sub:4,lines:[{raw:"Roll-ing it o-ver, slow-ing it un-der, go-ing on",pat:"X.xx|xxX.|xxxx|X.xx",meter:"4/4"},{raw:"Hold-ing the mo-ment, lone-ly and fro-zen, sol-i-tude",pat:"X.xx|xxX.|xxxx|X.xx",meter:"4/4"},{raw:"Glow-ing like em-bers, old as the o-cean, cold and slow",pat:"X.xx|xxX.|xxxx|X.xx",meter:"4/4"}]},{key:"b7rolltres",name:"Rolling 3-3-2",tip:"Keep the long-short group of six 16ths going and let it run over the bar line. It lands back on the 1 after three bars.",section:"poly",bpm:85,sub:4,lines:[{raw:"Float-ing a-cross the bor-der and o-ver, o-cean and",pat:"X.xx|xxX.|xxxx|X.xx",meter:"4/4"},{raw:"and the sky is a pal-ette, clouds a ri-ot of gold",pat:"xxX.|xxxx|X.xx|xxX.",meter:"4/4"},{raw:"On and on and on-ward, fol-low-ing sea-gulls a-round it",pat:"xxxx|X.xx|xxX.|xxxx",meter:"4/4"}]},{key:"b8runon",name:"Run-on bars",tip:"One sentence over three bars: the first two end on a small word that pulls you over the bar line. Keep going, only the third bar lands.",section:"poly",bpm:70,sub:4,lines:[{raw:"Ne-ver stop-ping at the line, I let the sen-tence spill in-to the",pat:"XxXx|xxXx|XxXx|XXxX",meter:"4/4"},{raw:"mid-dle of the next one, car-ry e-very thought ac-ross the",pat:"Xxxx|XXXx|XxXx|XX..",meter:"4/4"},{raw:"bor-der of the bar un-til it fi-nal-ly lands",pat:"Xxxx|XXxx|Xxx.|X...",meter:"4/4"}]},{key:"quint2",name:"Five in the time of two",tip:"Five even syllables across two beats, so only the first of each five meets the beat. Slower than the 5-per-beat level and harder to feel.",section:"quint",bpm:70,sub:5,lines:[{raw:"Float-ing a-bove it, drift-ing be-low it",pat:"X.x.x|.x.x.|X.x.x|.x.x.",meter:"4/4"},{raw:"Five o-ver two now,
