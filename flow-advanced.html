<!-- the 3-2-1-Go countdown uses the Flow Game's face (Bennie 2026-11-19) -->
<style>@font-face { font-family: 'Big Shoulders Display'; font-weight: 700; font-display: swap; src: url('fonts/g/big-shoulders-display-700-latin-48e1b4.woff2') format('woff2'); } @font-face { font-family: 'Big Shoulders Display'; font-weight: 900; font-display: swap; src: url('fonts/g/big-shoulders-display-900-latin-48e1b4.woff2') format('woff2'); } </style>
<style>@font-face { font-family: 'Panchang'; src: url('fonts/Panchang-Variable.woff2') format('woff2-variations'), url('fonts/Panchang-Variable.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }</style>
<!-- phone game screen (Bennie 2026-11-19): the round fills the screen, nothing scrolls, a red hit line at 35% where the playhead stays, one big Tap -->
<style>
html.pa-lock, html.pa-lock body { overflow: hidden !important; overscroll-behavior: none; }
.pa-game { position: fixed; inset: 0; z-index: 60; max-width: none !important; margin: 0 !important; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); gap: 8px; padding: max(10px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: var(--background); touch-action: none; overflow: hidden; }
.pa-game > :not(.pa-head):not(.pa-stage):not(.pa-ctl) { display: none !important; }
.pa-game .pa-head { justify-content: center; } .pa-game .pa-head > div:first-child { display: none; }
.pa-game .pa-stage { align-self: center; min-width: 0; width: 100%; margin: 0; padding: 40px 0 8px; border: 0; background: none; }
.pa-game .pa-track { padding-inline: 35% 65%; margin-top: 0; }
.pa-game .pa-stage::after { content: ''; position: absolute; top: 34px; bottom: 0; left: 35%; width: 4px; margin-left: -2px; border-radius: 2px; background: #af0000; box-shadow: 0 0 14px #af0000; pointer-events: none; opacity: .85; }
.pa-game .pa-ctl, .pa-game .pa-head { margin: 0; min-width: 0; }
.pa-game .pa-pad { height: auto !important; min-height: 96px; border-radius: 22px; }
/* Bennie 2026-11-19 "fill the whole thing": the track sits under the stats, the buttons take all the room below it */
.pa-game .pa-ctl, .pa-game .pa-ctl > div { display: flex; flex-direction: column; min-height: 0; height: 100%; }
.pa-game .pa-ctl > div > div, .pa-game .pa-ctl > div > .pa-pad { flex: 1 1 auto; min-height: 0; }
.pa-game .pa-track { zoom: 1.6; }
/* hit points more obvious (Bennie 2026-11-19): every dot to tap wears a thick ring */
.pa-game .bg-target { box-shadow: 0 0 0 4px var(--background), 0 0 0 7px #1f66c9; }
.pa-game .bg-target.pa-land { box-shadow: 0 0 0 4px var(--background), 0 0 0 7px #af0000; }
.pa-game .pa-ctl > div > button:last-child:not(.pa-pad) { position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); z-index: 61; }
@media (max-height: 500px) { .pa-game .pa-head { display: none; } .pa-game { grid-template-rows: auto minmax(0, 1fr); } .pa-game .pa-track { zoom: 1; } }

<script>
document.addEventListener('DOMContentLoaded', function () {
/* Maintenance curtain, same as landing-beat-meter.html and studio.html (#mxGate). Client-side curtain, not a lock. */
(function () {
  try { if (localStorage.getItem('metrobar.motion') === 'off') document.documentElement.classList.add('mo-off'); } catch (e) {}
  var C = window.ZONE_CONFIG || {}; if (!C.maintenance) return;
  var de = document.documentElement; de.classList.add('mx');
  var st = document.createElement('style');
  st.textContent = 'html.mx:not(.mx-ok), html.mx:not(.mx-ok) body { overflow: hidden !important; }' +
    '#mxGate { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; padding: 24px; background: #eef0ec; color: #15171a; font: 400 16px/1.5 system-ui, sans-serif; text-align: center; }' +
    '#mxGate .in { display: grid; gap: 14px; justify-items: center; max-width: 26rem; }' +
    '#mxGate .wm { font-weight: 800; font-size: clamp(1.6rem, 8vw, 2.6rem); text-transform: uppercase; }' +
    '#mxGate .t { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; max-width: 18rem; } #mxGate .t i { height: 8px; border-radius: 4px; background: #d3d6d1; } #mxGate .t i:last-child { background: #af0000; }' +
    '#mxGate .nt { color: #af0000; font-size: .9rem; } #mxGate h1 { margin: 6px 0 0; font-size: 1.15rem; } #mxGate p { margin: 0; color: #5d636a; }' +
    '#mxGate a { margin-top: 10px; color: #5d636a; font-size: .85rem; text-decoration: underline; text-underline-offset: 3px; }' +
    '#mxGate .ea-b, #mxGate .go { margin-top: 4px; border: 0; border-radius: 999px; background: #af0000; color: #fff; font: inherit; font-weight: 600; font-size: .95rem; text-decoration: none; text-transform: none; letter-spacing: 0; padding: 10px 22px; cursor: pointer; }' +
    '#mxGate .go:disabled { opacity: .6; cursor: default; } #mxGate .ea { display: grid; gap: 10px; width: 100%; max-width: 22rem; text-align: left; } #mxGate .ea[hidden], #mxGate .ea-b[hidden] { display: none; }' +
    '#mxGate .ea label { display: grid; gap: 4px; font-size: .85rem; color: #3b4046; } #mxGate .ea i { font-style: normal; color: #80868c; }' +
    '#mxGate .ea input, #mxGate .ea textarea { font: inherit; font-size: 1rem; padding: 9px 11px; border: 1px solid #c9cdc7; border-radius: 10px; background: #fff; color: #15171a; resize: vertical; }' +
    '#mxGate .ea input:focus, #mxGate .ea textarea:focus { outline: 2px solid #af0000; outline-offset: 1px; } #mxGate .ea .go { justify-self: center; } #mxGate .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }' +
    '#mxGate .ea-m { min-height: 1.2em; font-size: .85rem; text-align: center; } #mxGate .ea-ok { color: #15171a; text-align: center; }' +
    'html.mx-ok #mxGate { display: none; }';
  document.head.appendChild(st);
  var g = document.createElement('div'); g.id = 'mxGate'; g.setAttribute('role', 'dialog'); g.setAttribute('aria-label', 'MetroBar is under maintenance');
  g.innerHTML = '<div class="in"><div class="wm">MetroBar</div><div class="t"><i></i><i></i><i></i><i></i></div><h1>Getting ready</h1><p>MetroBar is being polished before launch. Check back soon.</p><p class="nt" hidden></p><button type="button" class="ea-b">Request early access</button><form class="ea" hidden novalidate><label><span>Email</span><input name="email" type="email" required autocomplete="email" spellcheck="false" placeholder="you@example.com"></label><label><span>Name or artist name <i>(optional)</i></span><input name="name" maxlength="80" autocomplete="nickname"></label><label><span>Anything we should know? <i>(optional)</i></span><textarea name="note" rows="3" maxlength="1000"></textarea></label><input name="hp" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true"><button type="submit" class="go">Send request</button><p class="ea-m" role="status"></p></form><a href="landing-beat-meter.html" class="si">Signed up already? Sign in</a></div>';
  document.body.appendChild(g);
  /* Coming soon (Bennie 2026-11-18): an account made before ZONE_CONFIG.maintenanceSince gets through, so does an admin;
     an account made later (or nobody signed in) sees the curtain. Sign-up is off while maintenance is on. */
  var CUT = Date.parse(C.maintenanceSince || '') || 0;
  var me = function () { try { var j = JSON.parse(localStorage.getItem('metrobar.zoneAuth') || 'null'); var u = j && (j.user || j.currentSession && j.currentSession.user); return u && u.id ? u : null; } catch (e) { return null; } };
  var uid = function () { var u = me(); return u ? u.id : ''; };
  var nt = g.querySelector('.nt');
  var say = function (t) { nt.textContent = t || ''; nt.hidden = !t; };
  var open = function (id) { de.classList.add('mx-ok'); say(''); try { sessionStorage.setItem('metrobar.mxOk', id); } catch (e) {} };
  var shut = function (t) { de.classList.remove('mx-ok'); say(t); try { sessionStorage.removeItem('metrobar.mxOk'); } catch (e) {} };
  var check = function () {
    var u = me(); if (!u) { shut(''); return; }
    var made = Date.parse(u.created_at || '') || 0;
    if (CUT && made && made < CUT) { open(u.id); return; }
    try { if (sessionStorage.getItem('metrobar.mxOk') === u.id) de.classList.add('mx-ok'); } catch (e) {}
    if (!C.url || !C.key) return;
    var H = { apikey: C.key, Authorization: 'Bearer ' + C.key, 'Content-Type': 'application/json' };
    var deny = function () { shut('This account is not on the early-access list yet. Request it below.'); };
    var admin = function () { // fallback while mx_can_enter is missing: admins only
      fetch(C.url + '/rest/v1/admins?select=user_id&user_id=eq.' + encodeURIComponent(u.id), { headers: H })
        .then(function (r) { return r.ok ? r.json() : []; }).then(function (rows) { rows && rows.length ? open(u.id) : deny(); }).catch(function () {});
    };
    // mx_can_enter (zone/early-access-2026-11-18.sql): admin, made before the curtain, or email on public.early_access
    fetch(C.url + '/rest/v1/rpc/mx_can_enter', { method: 'POST', headers: H, body: JSON.stringify({ p_uid: u.id }) })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (ok) { ok === true ? open(u.id) : deny(); })
      .catch(admin);
  };
  /* Request early access (Bennie 2026-11-18): the form posts to metrobarz.com/early-access.php, which mails info@metrobarz.com. */
  var eb = g.querySelector('.ea-b'), ef = g.querySelector('.ea'), em = g.querySelector('.ea-m');
  var eaFail = 'That did not go through. Mail info@metrobarz.com instead.';
  eb.addEventListener('click', function () { ef.hidden = false; eb.hidden = true; ef.elements.email.focus(); });
  ef.addEventListener('submit', function (e) {
    e.preventDefault(); var b = ef.querySelector('.go'), v = function (k) { return ef.elements[k].value.trim(); };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('email'))) { em.textContent = 'That email does not look right.'; return; }
    b.disabled = true; em.textContent = 'Sending…';
    fetch(C.earlyAccess || 'https://metrobarz.com/early-access.php', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: v('email'), name: v('name'), note: v('note'), hp: v('hp'), page: location.host + location.pathname }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j.status = r.status; return j; }); })
      .then(function (j) {
        if (j.ok) { ef.innerHTML = '<p class="ea-ok">Thanks, your request is in. You get an email when your spot opens.</p>'; return; }
        b.disabled = false; em.textContent = j.status === 429 ? 'Too many requests from here. Try again in an hour.' : j.why === 'email' ? 'That email does not look right.' : eaFail;
      })
      .catch(function () { b.disabled = false; em.textContent = eaFail; });
  });
  check();
  window.addEventListener('focus', check);
  window.addEventListener('storage', function (e) { if (e.key === 'metrobar.zoneAuth') check(); });
})();
});
</script>
