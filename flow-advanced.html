}]},{key:"drumsw",name:"The drum switch",tip:"Mid-verse the flow turns into a drum figure: only five hits, all off the beat, and the last one on the final triplet pushes into the next bar.",section:"trip",bpm:77,sub:3,lines:[{raw:"and boom, then crack, go",pat:".x.|X.x|.X.|..X",meter:"4/4"},{raw:"a kick, a snare, push",pat:".x.|X.x|.X.|..X",meter:"4/4"},{raw:"then stomp, then clap, jump",pat:".x.|X.x|.X.|..X",meter:"4/4"}]},{key:"tripin2",name:"Triplets in twos",tip:"Every triplet slot filled, but stress every second syllable: twos against the threes. Six stresses, only half of them on the beat.",section:"trip",bpm:97,sub:3,lines:[{raw:"Step-ping up and tak-ing all the space they gave me",pat:"XxX|xXx|XxX|xXx",meter:"4/4"},{raw:"Two a-gainst the three, it's pull-ing on the rhy-thm",pat:"XxX|xXx|XxX|xXx",meter:"4/4"},{raw:"Lean on ev-ery sec-ond one and let the oth-ers",pat:"XxX|xXx|XxX|xXx",meter:"4/4"}]},{key:"tripin4",name:"Triplets in fours",tip:"Twelve triplet syllables grouped in fours: only three stresses in the bar, and they walk across the beat.",section:"trip",bpm:97,sub:3,lines:[{raw:"Roll-ing like a mar-ble on a ta-ble, sway-ing",pat:"Xxx|xXx|xxX|xxx",meter:"4/4"},{raw:"Slow-er than the beat but it is catch-ing up now",pat:"Xxx|xXx|xxX|xxx",meter:"4/4"},{raw:"Mov-ing in a cir-cle as the drum-mer keeps it",pat:"Xxx|xXx|xxX|xxx",meter:"4/4"}]},{key:"gal1",name:"Gallops",tip:"Straight 8ths with a gallop thrown in: three quick syllables squeezed into one 8th (ta-ka-ta), on beat 1 and beat 3.",section:"trip",bpm:80,sub:6,lines:[{raw:"Gal-lop-ing a-cross it, thun-der-ing a-long",pat:"Xxxx..|X..x..|Xxxx..|X.....",meter:"4/4"},{raw:"Hur-ri-cane is com-ing, ca-ra-vans are gone",pat:"Xxxx..|X..x..|Xxxx..|X.....",meter:"4/4"},{raw:"Hol-i-day is o-ver, ev-ery-bo-dy home",pat:"Xxxx..|X..x..|Xxxx..|X.....",meter:"4/4"}]},{key:"gal2",name:"Gallop into the beat",tip:"Now the gallop sits on the and and runs into the next beat: three light syllables, then a hard one on the beat.",section:"trip",bpm:80,sub:6,lines:[{raw:"Up and then I land and then I hit the ground",pat:"X..xxx|X..xxx|X..x..|X.....",meter:"4/4"},{raw:"Breathe and let it go and let it fly a-way",pat:"X..xxx|X..xxx|X..x..|X.....",meter:"4/4"},{raw:"Run it to the edge and then it's time to shine",pat:"X..xxx|X..xxx|X..x..|X.....",meter:"4/4"}]},{key:"gcl1",name:"Folk words, drill bounce",tip:"Drill counts in half time over a fast hat: three, a gap, then three again. Calm words, sharp rhythm, the last stress lands on beat 4.",section:"trip",bpm:70,sub:3,lines:[{raw:"Wan-der-ing home in qui-et-er roads",pat:"Xxx|.Xx|Xxx|.X.",meter:"4/4"},{raw:"Hum-ming a tune with heav-i-er bass",pat:"Xxx|.Xx|Xxx|.X.",meter:"4/4"},{raw:"Mar-ket-place crowds and ri-ver-side bells",pat:"Xxx|.Xx|Xxx|.X.",meter:"4/4"}]},{key:"hm2a",name:"Twos all the way",tip:"Every triplet slot gets a syllable, but the stress falls on every second one: six twos against four beats. Only beats 1 and 3 line up.",section:"trip",bpm:80,sub:3,lines:[{raw:"Mov-ing, prov-ing, keep it roll-ing, nev-er fold-ing",pat:"XxX|xXx|XxX|xXx",meter:"4/4"},{raw:"Twos a-gainst the threes and ev-ery stress is drift-ing",pat:"XxX|xXx|XxX|xXx",meter:"4/4"},{raw:"Lan-terns flick-er, sha-dows sway-ing, foot-steps clos-er",pat:"XxX|xXx|XxX|xXx",meter:"4/4"}]},{key:"hm2b",name:"Twos, then home",tip:"Three groups of two, then one group of three, then the landing on beat 4: 2 + 2 + 2 + 3. The hemiola pulls away and the three brings it back.",section:"trip",bpm:80,sub:3,lines:[{raw:"Pa-per, pen-cil, cof-fee, ev-en-ing rain",pat:"XxX|xXx|Xxx|X..",meter:"4/4"},{raw:"Brick-work, rail-way, lamp-post, sha-dow-y street",pat:"XxX|xXx|Xxx|X..",meter:"4/4"},{raw:"Slow down, step back, breathe in, an-y-thing goes",pat:"XxX|xXx|Xxx|X..",meter:"4/4"}]},{key:"n98a",name:"Nine eight groove",tip:"Three beats, each three 8ths long. Put a stressed word on each group start and let the rest swing.",section:"trip",bpm:120,sub:4,lines:[{raw:"Bounce on the one and sway on the rest",pat:"X.x.x.|X.x.X.|x.x.X.",meter:"9/8"},{raw:"Kick and a snare and a long way home",pat:"X.x.x.|X.x.x.|X.X.X.",meter:"9/8"},{raw:"Lean in the groove when the bar comes round",pat:"X.x.x.|X.x.x.|X.X.X.",meter:"9/8"}]},{key:"n128",name:"Twelve eight sway",tip:"Four big beats, each split in three. One stress per big beat, the two syllables after it ride the swing.",section:"trip",bpm:120,sub:4,lines:[{raw:"Roll with the swing of a boat on the bay",pat:"X.x.x.|X.x.x.|X.x.x.|X.....",meter:"12/8"},{raw:"Count it in fours but you feel it in threes",pat:"X.x.x.|X.x.x.|X.x.x.|X.....",meter:"12/8"},{raw:"Hands on the rail and the train in the rain",pat:"X.x.x.|X.x.x.|X.x.x.|X.....",meter:"12/8"}]},{key:"iso2",name:"Rolling motif",tip:"A long-short-short motif on the triplets, repeated every beat and every bar. Same shape, new picture.",section:"trip",bpm:80,sub:3,lines:[{raw:"Rol-ling the dice in the al-ley at night",pat:"Xxx|Xxx|xXx|X..",meter:"4/4"},{raw:"Hol-ding the rope on the side of the boat",pat:"Xxx|Xxx|Xxx|X..",meter:"4/4"},{raw:"Fol-ding the map in the back of the car",pat:"Xxx|Xxx|Xxx|X..",meter:"4/4"}]},{key:"b4met1",name:"Stack the chant",tip:"Say the same three-syllable cell again and again on the triplets, then break out on the last beat. The repeat builds the pressure.",section:"trip",bpm:88,sub:3,lines:[{raw:"Pound-ing it, pound-ing it, burn-ing the stage",pat:"XXx|XXx|XXx|X..",meter:"4/4"},{raw:"Climb-ing it, climb-ing it, climb-ing in rage",pat:"XXx|XXx|XXx|X..",meter:"4/4"},{raw:"Crank-ing it, crank-ing it, rip-ping the cage",pat:"XXx|XXx|XXx|X..",meter:"4/4"}]},{key:"b4lock",name:"Lock with the drummer",tip:"A live drummer moves a little, so you listen and lock in: rolling triplets, the first of every three right on the kick or snare.",section:"trip",bpm:86,sub:3,lines:[{raw:"Snare and the kick and I'm sit-ting in-side of it",pat:"Xxx|XxX|XXx|XxX",meter:"4/4"},{raw:"Bass-line is walk-ing, I'm rid-ing a-long with it",pat:"XXx|XXX|XXx|XxX",meter:"4/4"},{raw:"Horns and the keys and the crowd mov-ing right with it",pat:"Xxx|Xxx|XXX|XxX",meter:"4/4"}]},{key:"b4cntup",name:"Count up",tip:"Groups of 1, 2, 3, 4, 5 and 6 syllables on the triplets, with two empty triplets between every group. Feel the groups grow.",section:"trip",bpm:70,sub:3,lines:[{raw:"One, then two, count it up",pat:"X..|Xx.|.Xx|x..",meter:"4/4"},{raw:"Add an-oth-er, lay-er on the line",pat:"Xxx|x..|Xxx|xx.",meter:"4/4"},{raw:"Till the whole stair-case climbs",pat:".Xx|xxx|X..|...",meter:"4/4"}]},{key:"b4cntdn",name:"Count down",tip:"The same idea backwards: 6, 5, 4, 3, 2, 1 syllables with a two-triplet rest between. The bar empties out until one word is left, then that one goes too.",section:"trip",bpm:70,sub:3,lines:[{raw:"Start-ing high and fall-ing, slow-er ev-ery",pat:"Xxx|xxx|..X|xxx",meter:"4/4"},{raw:"step, now we lose one, down to three",pat:"x..|Xxx|x..|Xxx",meter:"4/4"},{raw:"Two left, one, gone",pat:"..X|x..|X..|X..",meter:"4/4"}]},{key:"b4odd",name:"Drop every fourth",tip:"Triplets, but leave out every fourth one. Groups of three plus a gap fit three times in the bar: you feel a three over the four.",section:"trip",bpm:70,sub:3,lines:[{raw:"Count-ing it, skip-ping one, three a-gain",pat:"Xxx|.Xx|x.X|xx.",meter:"4/4"},{raw:"Rest in it, step a-cross, hold the floor",pat:"Xxx|.Xx|x.X|xx.",meter:"4/4"},{raw:"Three by three, one a-way, ev-ery time",pat:"Xxx|.Xx|x.X|xx.",meter:"4/4"}]},{key:"b4oddsh",name:"Drop every fourth, a beat late",tip:"The same three-and-a-gap, displaced by one beat: the groups now start on 2, on the last triplet of 3 and on the last triplet of 4.",section:"trip",bpm:70,sub:3,lines:[{raw:"So we come in late, push it back, now",pat:"xx.|Xxx|.Xx|x.X",meter:"4/4"},{raw:"it starts one beat on, ev-ery group, shift",pat:"xx.|Xxx|.Xx|x.X",meter:"4/4"},{raw:"and then land it there, cross the line, home",pat:"xx.|Xxx|.Xx|x.X",meter:"4/4"}]},{key:"b4odd2",name:"Double the gap",tip:"Fill the missing triplet with two double-time syllables instead. Five syllables per group, the first two quick, three groups per bar.",section:"trip",bpm:70,sub:6,lines:[{raw:"Fill-ing up the space, ev-ery hole I left, dou-ble time it, yeah",pat:"Xxx.x.|x.Xxx.|x.x.Xx|x.x.x.",meter:"4/4"},{raw:"Ra-pid-ly I fill an-y gap I see, quick-er than a blink",pat:"Xxx.x.|x.Xxx.|x.x.Xx|x.x.x.",meter:"4/4"},{raw:"Two in-to a slot, then I let it ride, lock-ing in the threes",pat:"Xxx.x.|x.Xxx.|x.x.Xx|x.x.x.",meter:"4/4"}]},{key:"sev12",name:"Seven over twelve",tip:"The beat is 12/8, the flow repeats every 7 slots: hit, rest, hit, rest, a long one, hit. It slides across the bar line and only lines up again after 7 bars.",section:"trip",bpm:70,sub:3,lines:[{raw:"Sev-en through twelve, slide right past",pat:"X.x|.x.|xX.|x.x",meter:"12/8 (= 4/4 triplet grid)"},{raw:"them, nev-er sits still, drifts on",pat:".xX|.x.|x.x|X.x",meter:"12/8 (= 4/4 triplet grid)"},{raw:"and on, wheel-ing it back, home",pat:".x.|xX.|x.x|.xX",meter:"12/8 (= 4/4 triplet grid)"}]},{key:"qtrip",name:"Three in the time of two",tip:"Only every second triplet: three even words across two beats. Wide and floating, it only meets the beat on 1 and 3.",section:"trip",bpm:86,sub:3,lines:[{raw:"Long steps a-cross two beats",pat:"X.X|.X.|X.X|.X.",meter:"4/4"},{raw:"Three wide waves on the drum",pat:"X.X|.X.|X.X|.X.",meter:"4/4"},{raw:"Stretch it out, take your time",pat:"X.X|.X.|X.X|.X.",meter:"4/4"}]},{key:"trip2s",name:"Triplets in twos",tip:"All twelve triplet slots filled, stressed in pairs: STRONG-weak, STRONG-weak. The stress falls on the beat, then between, then on the beat again.",section:"trip",bpm:86,sub:3,lines:[{raw:"Swing-ing, sway-ing, roll-ing, lean-ing, two by two now",pat:"XxX|xXx|XxX|xXx",meter:"4/4"},{raw:"Pair-ing up the trip-lets, now the pat-tern's turn-ing",pat:"XxX|xXx|XxX|xXx",meter:"4/4"},{raw:"Three a-gainst the two and nev-er los-ing bal-ance",pat:"XxX|xXx|XxX|xXx",meter:"4/4"}]},{key:"reset7",name:"Reset the seven",tip:"A 7-slot group plus a short 5-slot group fills the 12. Cutting one group short is how the flow resets to the 1.",section:"trip",bpm:70,sub:3,lines:[{raw:"Cut it short, sev-en goes long",pat:"X.x|.xX|.x.|x.x",meter:"12/8 (= 4/4 triplet grid)"},{raw:"Sev-en goes first, five snaps back",pat:"X.x|.x.|xX.|x.x",meter:"12/8 (= 4/4 triplet grid)"},{raw:"Reach for the line, home a-gain at one",pat:"X.x|.x.|xXx|xxx",meter:"12/8 (= 4/4 triplet grid)"}]},{key:"pair4",name:"Fours on the triplets",tip:"A two-syllable punch every 4 triplet slots: three punches across four beats. The words come in pairs and the pairs walk off the beat.",section:"trip",bpm:72,sub:3,lines:[{raw:"Coun-ter, punch it, three times",pat:"Xx.|.Xx|..X|x..",meter:"12/8 (= 4/4 triplet grid)"},{raw:"Hit it, spin it, flip it",pat:"Xx.|.Xx|..X|x..",meter:"12/8 (= 4/4 triplet grid)"},{raw:"Fours out-side the three-feel",pat:"Xx.|.Xx|..X|x..",meter:"12/8 (= 4/4 triplet grid)"}]},{key:"g33222",name:"3-3-2-2-2",tip:"Two groups of three then three groups of two: the punctuation speeds up inside the bar. Stress the first syllable of every group.",section:"trip",bpm:72,sub:3,lines:[{raw:"Wait-ing, wait-ing, now it's com-ing quick-ly",pat:"Xx.|Xx.|XxX|xXx",meter:"12/8 (= 4/4 triplet grid)"},{raw:"Hold it, hold it, break it, shake it, take it",pat:"Xx.|Xx.|XxX|xXx",meter:"12/8 (= 4/4 triplet grid)"},{raw:"Long one, long one, short one, short one, short one",pat:"Xx.|Xx.|XxX|xXx",meter:"12/8 (= 4/4 triplet grid)"}]},{key:"gridsw",name:"Switch the grid",tip:"Bar one in 16ths, bar two in triplets, bar three back to 16ths. Feel four per beat, then three, then four again.",section:"trip",bpm:96,sub:4,lines:[{raw:"Lec-ture in ses-sion, the board full of notes and e-qua-tions",pat:"XxxX|xxXX|xXxX|xX..",meter:"4/4"},{raw:"Then it's trip-lets, class-room is swing-ing a-long",pat:"XXx|xXx|xXx|xX.",meter:"4/4"},{raw:"Back to the six-teenths and e-very stu-dent is ta-king it down",pat:"XxxX|xxXx|XxxX|xxX.",meter:"4/4"}]},{key:"b6trip",name:"Break into triplets",tip:"Two bars of even 8ths, then the third bar breaks into triplets: three per beat, lean on the first of every three.",section:"trip",bpm:88,sub:4,lines:[{raw:"Step out-side the frame they drew for me",pat:"X.Xx|x.X.|X.Xx|X...",meter:"4/4"},{raw:"E-very wall in here is just a screen",pat:"XxXx|XxXx|....|X...",meter:"4/4"},{raw:"Crac-king the code and I'm out of the box",pat:"Xxx|XxX|Xxx|X..",meter:"4/4"}]},{key:"b6s34",name:"Threes and fours",tip:"Every triplet slot gets a syllable. The accent comes after 3, then after 4: a group of 3 plus a group of 4 is the 7 that pulls against the beat.",section:"trip",bpm:70,sub:3,lines:[{raw:"Count it in threes and then in fours and the one slips",pat:"Xxx|Xxx|xXx|xXx",meter:"4/4"},{raw:"Drop it on two and then it rolls to the back now",pat:"Xxx|Xxx|xXx|xXx",meter:"4/4"},{raw:"Lean on the step and then I cut through the grid line",pat:"Xxx|Xxx|xXx|xXx",meter:"4/4"}]},{key:"b6s7x",name:"Seven across the bar line",tip:"The 3 + 4 cycle keeps going over the bar line, so every bar starts its accents somewhere else. Trust the count of 7, not the 1.",section:"trip",bpm:70,sub:3,lines:[{raw:"Start on the one and then I move in a cir-cle",pat:"Xxx|Xxx|xXx|xXx",meter:"4/4"},{raw:"and the drum is a door and I can walk through it",pat:"xxX|xxX|xxx|Xxx",meter:"4/4"},{raw:"Sev-en is a wheel and it turns in a long loop",pat:"Xxx|xXx|xXx|xxX",meter:"4/4"}]},{key:"b6vow6",name:"Vowels on sextuplets",tip:"Six slots a beat, grouped in fours: two quick syllables, then the rhyme vowel held for two slots. The groups of 4 run 3 against every 2 beats.",section:"trip",bpm:65,sub:6,lines:[{raw:"in the town, on the road, all a-round, as I go, to the sound, of the flow",pat:"xxX.xx|X.xxX.|xxX.xx|X.xxX.",meter:"4/4"},{raw:"from the base to the beat in the night at the gate on the street with the light",pat:"xxX.xx|X.xxX.|xxX.xx|X.xxX.",meter:"4/4"},{raw:"and the ground is a stone that I found on my own in the crowd all a-lone",pat:"xxX.xx|X.xxX.|xxX.xx|X.xxX.",meter:"4/4"}]},{key:"b6four",name:"Fours on triplets",tip:'Triplets all the way, but the words come in fours: the accent lands on 1, the "trip" of 2 and the "let" of 3. Three accents against four beats.',section:"trip",bpm:85,sub:3,lines:[{raw:"Shuf-fle it and car-ry it on, o-ver and out",pat:"Xxx|xXx|xxX|xxx",meter:"4/4"},{raw:"Gath-er it up, num-ber it off, roll-ing it home",pat:"Xxx|xXx|xxX|xxx",meter:"4/4"},{raw:"Ham-mer it down, flat-ten it out, set-tle it in",pat:"Xxx|xXx|xxX|xxx",meter:"4/4"}]},{key:"b6four3",name:"A four, then threes",tip:'Two pickup syllables, then one group of 4 and two groups of 3 on the triplets. The accents fall on the "let" of 1, the 3 and the 4.',section:"trip",bpm:85,sub:3,lines:[{raw:"so we stretch it to four, then it is three and three",pat:"xxX|xxx|Xxx|Xxx",meter:"4/4"},{raw:"and the walk-ing is slow, rush-ing it home at last",pat:"xxX|xxx|Xxx|Xxx",meter:"4/4"},{raw:"till the num-bers all meet, fall-ing in place on four",pat:"xxX|xxx|Xxx|Xxx",meter:"4/4"}]},{key:"b6tswing",name:"Triplet swing",tip:"Long-short pairs: the first syllable on the beat, the second on the last triplet of it. That is the classic swung 8th.",section:"trip",bpm:88,sub:3,lines:[{raw:"Swing it, lean it, let it hang there",pat:"X.x|X.x|X.x|X.x",meter:"4/4"},{raw:"Rock it back, then let it ride now",pat:"X.x|X.x|X.x|X.x",meter:"4/4"},{raw:"Hold the long and clip the short one",pat:"X.x|X.x|X.x|X.x",meter:"4/4"}]},{key:"b7nine",name:"Nine eight sway",tip:"Nine eighths in three groups of three: ONE two three, ONE two three, ONE two three. Rock with it like a slow waltz and land on the last group.",section:"trip",bpm:90,sub:4,lines:[{raw:"Sway-ing it slow in the dark of night",pat:"X.x.x.|X.x.x.|X.x.X.",meter:"9/8:3+3+3"},{raw:"Floa-ting a-way on a lul-la-by",pat:"X.x.x.|X.x.x.|X.x.X.",meter:"9/8:3+3+3"},{raw:"Tur-ning a-round in the can-dle-light",pat:"X.x.x.|X.x.x.|X.x.X.",meter:"9/8:3+3+3"}]},{key:"b7oddhome",name:"Odd bars, then home",tip:"Two short odd bars pull the rug: seven eighths, then nine. The last bar drops into a plain four and everything lets go.",section:"trip",bpm:90,sub:4,lines:[{raw:"Squeeze it a lit-tle more",pat:"X.x.|x.X.|x.X...",meter:"7/8"},{raw:"Turn it up tig-hter and tig-hter now",pat:"X.x.|x.X.|x.x.|X.x.X.",meter:"9/8:2+2+2+3"},{raw:"Ea-sy now, the four is home",pat:"X.x.|X.x.|X.x.|X...",meter:"4/4"}]},{key:"b7six8",name:"Six eight",tip:"Two groups of three eighths: ONE two three FOUR five six. It rolls instead of marching.",section:"trip",bpm:90,sub:4,lines:[{raw:"Ri-ding the wave to shore",pat:"X.x.x.|X.x.X.",meter:"6/8"},{raw:"Car-ry me home to-night",pat:"X.x.x.|X.X.X.",meter:"6/8"},{raw:"O-ver the hills we roll",pat:"X.x.x.|X.x.X.",meter:"6/8"}]},{key:"b7sixflip",name:"Four, six, four",tip:"Square bar, rolling 6/8 bar, square bar. Feel the pulse change under the same tempo and switch back without a stumble.",section:"trip",bpm:90,sub:4,lines:[{raw:"Back on the floor with the four",pat:"X.x.|x.X.|x.x.|X...",meter:"4/4"},{raw:"Roc-king the boat, we sway",pat:"X.x.x.|X.x.X.",meter:"6/8"},{raw:"Drop, and the four comes home",pat:"X.x.|x.X.|X...|X...",meter:"4/4"}]},{key:"b7tfour",name:"Triplets in fours",tip:"Twelve triplet syllables, stressed every fourth one. The stress lands on 1, then a triplet after 2, then on the last triplet of 3.",section:"trip",bpm:75,sub:3,lines:[{raw:"Ded-i-ca-ted, med-i-ta-ting, cal-cu-la-ted",pat:"Xxx|xXx|xxX|xxx",meter:"4/4"},{raw:"Count-ing it up, spend-ing it down, sav-ing the rest",pat:"Xxx|xXx|xxX|xxx",meter:"4/4"},{raw:"Hold-ing it in, let-ting it out, tak-ing a breath",pat:"Xxx|xXx|xxX|xxx",meter:"4/4"}]},{key:"b7tsix",name:"Triplets in sixes",tip:"Twelve even triplets, only two stresses: beat 1 and beat 3. Keep the rest light and flat.",section:"trip",bpm:75,sub:3,lines:[{raw:"Slow-ly but sure-ly I'm tak-ing it all the way",pat:"Xxx|xxx|Xxx|xxx",meter:"4/4"},{raw:"Clos-er and clos-er, I'm fin-ish-ing ev-ery line",pat:"Xxx|xxx|Xxx|xxx",meter:"4/4"},{raw:"Out of the shad-ow and in-to the light of day",pat:"Xxx|xxx|Xxx|xxx",meter:"4/4"}]},{key:"b7t32",name:"Threes into twos",tip:"Start grouping the triplets in threes, then switch to twos halfway: 3 + 3 + 2 + 2 + 2. The beat stays, the feel speeds up.",section:"trip",bpm:78,sub:3,lines:[{raw:"Mov-ing a-head of the pack and nev-er slow-ing",pat:"Xxx|Xxx|XxX|xXx",meter:"4/4"},{raw:"Danc-ing a-lone in the dark-ness fall-ing slow-ly",pat:"Xxx|Xxx|XxX|xXx",meter:"4/4"},{raw:"Wait-ing for days in the sum-mer, beg-ging, pray-ing",pat:"Xxx|Xxx|XxX|xXx",meter:"4/4"}]},{key:"b7t24",name:"Twos into fours",tip:"Three quick stresses in twos, then two long groups of four: 2 + 2 + 4 + 4. It speeds up, then stretches out.",section:"trip",bpm:78,sub:3,lines:[{raw:"Rock-ing, roll-ing, rid-ing it out, slid-ing a-way",pat:"XxX|xXx|xxX|xxx",meter:"4/4"},{raw:"Fast-er, high-er, read-y to go, read-y to fly",pat:"XxX|xXx|xxX|xxx",meter:"4/4"},{raw:"Ham-mer, chis-el, carv-ing it out, mak-ing it shine",pat:"XxX|xXx|xxX|xxx",meter:"4/4"}]},{key:"b7tlate",name:"One triplet late",tip:"The same triplet line, shifted one triplet later: rest on the 1, and every stress lands just after a beat.",section:"trip",bpm:77,sub:3,lines:[{raw:"Wait-ing a beat and then slid-ing in late",pat:".Xx|xXx|xXx|xX.",meter:"4/4"},{raw:"Skip-ping the one so the rest of it floats",pat:".Xx|xXx|xXx|xX.",meter:"4/4"},{raw:"Lean-ing a-way from the drum on the dot",pat:".Xx|xXx|xXx|xX.",meter:"4/4"}]},{key:"b7tbeat2",name:"Start on beat 2",tip:"Begin the triplet line on beat 2 and let it run over the bar line: it ends on the next 1.",section:"trip",bpm:77,sub:3,lines:[{raw:"Two is the door and I walk out the front",pat:"...|Xxx|Xxx|XxxX",meter:"4/4"},{raw:"Late to the par-ty but right on the time",pat:"...|Xxx|Xxx|XxxX",meter:"4/4"},{raw:"Start in the mid-dle and fin-ish the line",pat:"...|Xxx|Xxx|XxxX",meter:"4/4"}]},{key:"b7t345",name:"Three, four, five",tip:"Mix the group sizes in one bar: a group of 3, a group of 4, a group of 5. Three stresses, all at different distances.",section:"trip",bpm:75,sub:3,lines:[{raw:"Pa-tient-ly wait-ing for the mo-ment it ar-rives",pat:"Xxx|Xxx|xXx|xxx",meter:"4/4"},{raw:"Hold-ing on tight-er than a mem-o-ry of you",pat:"Xxx|Xxx|xXx|xxx",meter:"4/4"},{raw:"Ev-er-y ques-tion that you an-swered in the end",pat:"Xxx|Xxx|xXx|xxx",meter:"4/4"}]},{key:"b7tfive",name:"Fives across the bar",tip:"Stress every fifth triplet and keep counting over the bar line. The stress drifts through the bar and only lines up again after five bars.",section:"trip",bpm:75,sub:3,lines:[{raw:"Beau-ti-ful-ly it trav-els a-cross the bar-line",pat:"Xxx|xxX|xxx|xXx",meter:"4/4"},{raw:"Now it goes drift-ing a-way and cir-cles a-round",pat:"xxx|Xxx|xxX|xxx",meter:"4/4"},{raw:"A-gain it re-turns to home at the end of time",pat:"xXx|xxx|Xxx|xxX",meter:"4/4"}]},{key:"b8tfive",name:"Fives over triplets",tip:"Eleven syllables on the triplet stream with a stress on every fifth one: beat 1, the let of 2, the trip of 4. Same speed, only the weight moves.",section:"trip",bpm:80,sub:3,lines:[{raw:"Or-di-nar-i-ly, tem-po-rar-i-ly, no",pat:"Xxx|xxX|xxx|xX.",meter:"4/4"},{raw:"Nec-es-sar-i-ly, mil-i-tar-i-ly, strong",pat:"Xxx|xxX|xxx|xX.",meter:"4/4"},{raw:"Sec-on-dar-i-ly, mo-men-tar-i-ly, gone",pat:"Xxx|xxX|xxx|xX.",meter:"4/4"}]},{key:"b8tgrow",name:"Growing gaps",tip:"Twelve triplet syllables, and the gap between the stresses grows: two, then three, then four. Lean on the stress and keep the rest light.",section:"trip",bpm:80,sub:3,lines:[{raw:"Step up, walk-ing a-way from all the crowd-ed street",pat:"XxX|xxX|xxx|Xxx",meter:"4/4"},{raw:"Slow down, catch-ing my breath and then I'm head-ing home",pat:"XxX|xxX|xxx|Xxx",meter:"4/4"},{raw:"Lean back, giv-ing it space and then I let it ring",pat:"XxX|xxX|xxx|Xxx",meter:"4/4"}]},{key:"b8walkroll",name:"Walk, then roll",tip:"Two slow words on beats 1 and 2, then triplets on beats 3 and 4. Feel the grid jump from one to three syllables per beat.",section:"trip",bpm:85,sub:3,lines:[{raw:"Hush, now, mur-mur-ing, whis-per-ing",pat:"X..|X..|Xxx|Xxx",meter:"4/4"},{raw:"Up, down, ev-ery-where, an-y-where",pat:"X..|X..|Xxx|Xxx",meter:"4/4"},{raw:"Front, back, cel-e-brate, dec-o-rate",pat:"X..|X..|Xxx|Xxx",meter:"4/4"}]},{key:"b8phase",name:"Two phases",tip:"Phase one: four long syllables, three against two, from beat 1 to beat 3. Phase two: three quick ones on beat 4. Rhyme the first and third, the second and fourth.",section:"trip",bpm:80,sub:3,lines:[{raw:"Deep blue, sleep through ev-ery-thing",pat:"X.X|.X.|X..|Xxx",meter:"4/4"},{raw:"Clean shoes, mean moves, ev-ery day",pat:"X.X|.X.|X..|Xxx",meter:"4/4"},{raw:"Keep cool, read rooms, qui-et-ly",pat:"X.X|.X.|X..|Xxx",meter:"4/4"}]},{key:"b8phase2",name:"Shifted phase",tip:"The same two phases, but the fourth long syllable slips to the + of 3. That one push is the syncopation; beat 4 still rolls in threes.",section:"trip",bpm:80,sub:3,lines:[{raw:"Bright lights, night time, run it back",pat:"X.X|.X.|.X.|Xxx",meter:"4/4"},{raw:"Hold on, slow down, let it ride",pat:"X.X|.X.|.X.|Xxx",meter:"4/4"},{raw:"Late nights, bold lines, fill the page",pat:"X.X|.X.|.X.|Xxx",meter:"4/4"}]},{key:"b8sw16",name:"Swung 16ths",tip:"Fast syllables in pairs, and every second one comes a little late: long-short, long-short. Three beats of swing, then land on 4.",section:"trip",bpm:75,sub:6,lines:[{raw:"La-zi-ly and ea-si-ly and care-less-ly and home",pat:"X.xx.x|X.xx.x|X.xx.x|X.....",meter:"4/4"},{raw:"Mer-ri-ly and hap-pi-ly and read-i-ly and done",pat:"X.xx.x|X.xx.x|X.xx.x|X.....",meter:"4/4"},{raw:"Stead-i-ly and heav-i-ly and wear-i-ly I go",pat:"X.xx.x|X.xx.x|X.xx.x|X.....",meter:"4/4"}]},{key:"drillpk",name:"Drill pocket",tip:"Drill at half time: punchy 8ths with quick 16th pairs, a gap before the line ends. Hit the hard words, rush the small ones.",section:"16",bpm:72,sub:4,lines:[{raw:"Slide through the back gate, hoods up, eyes down in the cold town",pat:"X.xx|xX.X|XXXx|x.XX",meter:"4/4"},{raw:"Cold wind bites, stay low, keep it mov-ing, go",pat:"X.xX|.xX.|X.xX|x..X",meter:"4/4"},{raw:"Back to the base, no trace, we're out the door",pat:"X.x.|xXx.|X.x.|Xx.X",meter:"4/4"}]},{key:"vsramp",name:"Verse ramp: no gaps",tip:"Now take the gaps out. Fill the bar with 16ths so it feels like the verse is speeding up, even though the beat isn't.",section:"16",bpm:108,sub:4,lines:[{raw:"Ne-ver stop-ping, e-very syl-lab-le is pus-hing to the next one",pat:"XxXx|XxXx|xxXx|xxXX",meter:"4/4"},{raw:"Rol-ling for-ward like a ri-ver with no cor-ner to slow down",pat:"XxXx|XxXx|xXXx|xXX.",meter:"4/4"},{raw:"Fas-ter and fas-ter, it feels like the floor is mo-ving un-der me",pat:"XxxX|xxXX|xXxX|xXxX",meter:"4/4"}]},{key:"snap",name:"Short-long snap",tip:"A short hit on the beat, then a long one right after it: snap, hold. The same shape on every beat.",section:"16",bpm:97,sub:4,lines:[{raw:"Snap it, crack it, flip it, stack it",pat:"Xx..|Xx..|Xx..|Xx..",meter:"4/4"},{raw:"Clip-ping words and hold-ing vow-els",pat:"Xx..|Xx..|Xx..|Xx..",meter:"4/4"},{raw:"Nev-er rush-ing, al-ways land-ing",pat:"Xx..|Xx..|Xx..|Xx..",meter:"4/4"}]},{key:"flowtif",name:"Flow motif",tip:"A short rhythm idea, stresses 2 + 3 + 3 apart, said twice in every bar. Same shape, new words: that's a motif.",section:"16",bpm:88,sub:4,lines:[{raw:"The drum-mer is play-ing it slow and ev-ery-one fol-lows the flow",pat:"xXxx|XxxX|xXxx|XxxX",meter:"4/4"},{raw:"A mo-tif we're car-ry-ing home, the pat-tern is set-ting in stone",pat:"xXxx|XxxX|xXxx|XxxX",meter:"4/4"},{raw:"We stamp it a-gain on the floor, we stamp it a lit-tle bit more",pat:"xXxx|XxxX|xXxx|XxxX",meter:"4/4"}]},{key:"run16",name:"Run through the bar",tip:"A long, dense line of 16ths that only stops on beat 4. Keep the small words light so the stresses stay clear.",section:"16",bpm:100,sub:4,lines:[{raw:"Lif-ting e-very lay-er till the sto-ry's out in day-light",pat:"XxXx|Xxxx|XxXx|XX..",meter:"4/4"},{raw:"Mat-ching e-very fi-ber to the jac-ket by the door-way",pat:"XxXx|Xxxx|Xxxx|XX..",meter:"4/4"},{raw:"Dig-ging through the pa-per for the sig-na-ture they faked there",pat:"XxXx|Xxxx|XxxX|XX..",meter:"4/4"}]},{key:"frs1",name:"Radio freestyle pocket",tip:"Off the top: talk it in a steady 16th stream and let the end rhyme hit beat 4 every bar.",section:"16",bpm:85,sub:4,lines:[{raw:"Pulled up to the sta-tion with a verse I ne-ver wrote",pat:"Xxxx|Xxxx|XxXx|X...",meter:"4/4"},{raw:"Off the top the mic-rop-hone is warm I let it float",pat:"XxXx|Xxxx|XxXx|X...",meter:"4/4"},{raw:"Hit the bell and drop it like an an-chor on the boat",pat:"XxXx|XxXx|xXxx|X...",meter:"4/4"}]},{key:"b1gal1",name:"Gallop",tip:"Three 16ths and a gap in every beat: da-da-da, da-da-da. Stress the first of each three, on the beat.",section:"16",bpm:85,sub:4,lines:[{raw:"Hor-ses are run-ning and no-bod-y's catch-ing them",pat:"Xxx.|Xxx.|Xxx.|Xxx.",meter:"4/4"},{raw:"Thun-der-ing o-ver the val-ley and in-to it",pat:"Xxx.|Xxx.|Xxx.|Xxx.",meter:"4/4"},{raw:"Rat-tle the win-dows and shake up the neigh-bour-hood",pat:"Xxx.|Xxx.|Xxx.|Xxx.",meter:"4/4"}]},{key:"b1gal2",name:"Gallop, gap inside",tip:"Move the gap inside the beat: 1 e, skip, a. The three-syllable words now gallop with a hitch.",section:"16",bpm:85,sub:4,lines:[{raw:"Rid-ing the wave till the crest of it breaks on me",pat:"Xx.x|Xx.x|Xx.x|Xx.x",meter:"4/4"},{raw:"Chas-ing the sound of the drum through the cor-ri-dor",pat:"Xx.x|Xx.x|Xx.x|Xx.x",meter:"4/4"},{raw:"Kick-ing up dust as we race to the fin-ish line",pat:"Xx.x|Xx.x|Xx.x|Xx.x",meter:"4/4"}]},{key:"b1gal3",name:"Gallop off the one",tip:"Now the gap sits on the beat: rest on every 1, 2, 3 and 4 and gallop on e + a. Feel the beat you never say.",section:"16",bpm:85,sub:4,lines:[{raw:"Wan-der-ing out in the mid-dle of ev-ery-thing",pat:".Xxx|.Xxx|.Xxx|.Xxx",meter:"4/4"},{raw:"Sprint-ing a-head of the rest of the pack a-gain",pat:".Xxx|.Xxx|.Xxx|.Xxx",meter:"4/4"},{raw:"Head-ing for home on the back of a hur-ri-cane",pat:".Xxx|.Xxx|.Xxx|.Xxx",meter:"4/4"}]},{key:"irh2",name:"Two rhyme chains",tip:"Run two rhyme sounds at once and alternate them: one family on the strong hits, the other in between.",section:"16",bpm:85,sub:4,lines:[{raw:"Poc-ket full of time I roc-ket through the climb",pat:"XxXx|XxXx|Xx..|X...",meter:"4/4"},{raw:"Soc-ket in the wall I lock it e-very line's a rhyme",pat:"Xxxx|XxXx|XxXx|X...",meter:"4/4"},{raw:"Knock it off the shelf I clock it e-very dime is mine",pat:"XxXx|XxXx|XxXx|X...",meter:"4/4"}]},{key:"iso1",name:"Same rhythm, new words",tip:"A flow motif: keep the exact rhythm and change only the words. All three bars sit on the same slots.",section:"16",bpm:90,sub:4,lines:[{raw:"Paint the wall and fix the door",pat:"X.x.|X.x.|X.x.|X...",meter:"4/4"},{raw:"Sweep the hall and lock the gate",pat:"X.x.|X.x.|X.x.|X...",meter:"4/4"},{raw:"Fill the cup and pass the plate",pat:"X.x.|X.x.|X.x.|X...",meter:"4/4"}]},{key:"b4crowd",name:"Crowd chant",tip:"Short two-beat calls that stop dead on 2 and 4, so the crowd can shout them back. Leave the rest of the beat empty.",section:"16",bpm:66,sub:4,lines:[{raw:"Stand tall, don't fall",pat:"X...|X...|X...|X...",meter:"4/4"},{raw:"Hold on, stay strong",pat:"X...|X...|X...|X...",meter:"4/4"},{raw:"Lights up, we on",pat:"X...|X...|x...|X...",meter:"4/4"}]},{key:"b4story",name:"Same frame, new place",tip:"Storytelling trick: every bar starts with the same frame and only the picture changes. Keep the 8ths even and the rhyme on beat 4.",section:"16",bpm:85,sub:4,lines:[{raw:"North side I'm the man at the door",pat:"X.X.|X.x.|X.x.|x.X.",meter:"4/4"},{raw:"South side I'm the kid from be-fore",pat:"X.X.|X.x.|X.x.|x.X.",meter:"4/4"},{raw:"West side they just ask what it's for",pat:"X.X.|X.X.|X.X.|X.X.",meter:"4/4"}]},{key:"lbd1",name:"Ride the band",tip:"A live band breathes, so you lock to the drummer: steady 16ths and a three-syllable rhyme at the end of every bar.",section:"16",bpm:80,sub:4,lines:[{raw:"Horns in the back and the drum-mer is kee-ping it phy-si-cal",pat:"XxxX|xxXx|xXxx|XxX.",meter:"4/4"},{raw:"E-very re-hear-sal we stayed un-til mid-night was cri-ti-cal",pat:"XxxX|xxXX|xXxx|XxX.",meter:"4/4"},{raw:"Lights on the stage and the sound of the band is a mi-rac-le",pat:"XxxX|xxXx|xXxx|XxX.",meter:"4/4"}]},{key:"b4mts",name:"Straight on the grid",tip:"A straight flow: every syllable sits exactly on a 16th line. Tap with the hats and do not drift.",section:"16",bpm:86,sub:4,lines:[{raw:"Ev-e-ry sin-gle sound is sit-ting square up-on the line",pat:"XXxX|XXxX|XXxx|xX..",meter:"4/4"},{raw:"Like a ru-ler mea-sured out, no drift-ing, all in time",pat:"XxXX|XXXX|XXXx|X...",meter:"4/4"},{raw:"Tick for tick I match the hats, I nev-er slip be-hind",pat:"XxXx|XxXx|XXXx|X...",meter:"4/4"}]},{key:"b4dunk",name:"Hype hook",tip:"A highlight chant: punchy 8ths and a two-syllable rhyme, the stress on beat 4 and a soft syllable after it.",section:"16",bpm:109,sub:4,lines:[{raw:"Take off, flight time, go and slam it",pat:"X.X.|X.X.|X.x.|X.X.",meter:"4/4"},{raw:"Hang time, rim shakes, how you stand it",pat:"X.X.|X.X.|X.x.|X.X.",meter:"4/4"},{raw:"Crowd up, lights down, we de-mand it",pat:"X.x.|X.X.|x.X.|X.X.",meter:"4/4"}]},{key:"b4spill",name:"Spill, then stop",tip:"A racing bar full of 16ths, then a bar that slams the brakes with a few words on the beat, then race again. The contrast is the flow.",section:"16",bpm:84,sub:4,lines:[{raw:"Got a hun-dred tabs o-pen and I'm switch-ing ev-e-ry sec-ond",pat:"XxXX|XXXx|XXXX|XxXX",meter:"4/4"},{raw:"Wait, hold up, what?",pat:"X...|X...|x...|X...",meter:"4/4"},{raw:"Lost the thought but found an-oth-er bet-ter one, I'm back",pat:"XxXx|XxXX|XXXX|X...",meter:"4/4"}]},{key:"b4obg",name:"Implied rhythm",tip:"Start on the e of 2 and fill the 16ths up to the end of the bar, tight on the grid. This is the rhythm the ear expects.",section:"16",bpm:130,sub:4,lines:[{raw:"Calm, and stead-y right on the grid",pat:"....|.X.x|.Xxx|.xxX",meter:"4/4"},{raw:"Sit, and let the drums pass me by",pat:"....|.X.x|.Xxx|.Xxx",meter:"4/4"},{raw:"Tight, I nev-er stray from the line",pat:"....|.X.x|.XxX|.xxX",meter:"4/4"}]},{key:"b4preset",name:"Reset every bar",tip:"A three-beat rhythm, then one beat of rest. The rest resets the phase, so every bar starts fresh on the 1.",section:"16",bpm:80,sub:4,lines:[{raw:"Run it, then I stop, re-set",pat:"X.xx|.xX.|x.X.|....",meter:"4/4"},{raw:"Three beats on, then gap, and breathe",pat:"X.xx|.xX.|x.X.|....",meter:"4/4"},{raw:"Back on one, the slate is clean",pat:"X.xx|.xX.|x.X.|....",meter:"4/4"}]},{key:"mono4",name:"Flow in four",tip:"Mono-metric: the phrase is as long as the bar. Start on 1, close on beat 4, every bar the same shape.",section:"16",bpm:95,sub:4,lines:[{raw:"Start the line and end it here",pat:"X.x.|X.x.|X.x.|X...",meter:"4/4"},{raw:"Square and sim-ple, clo-sing on four",pat:"X.x.|X.x.|X.x.|x.X.",meter:"4/4"},{raw:"Same old box, I make it shine",pat:"X.X.|X.x.|X.x.|X...",meter:"4/4"}]},{key:"b6dbl",name:"Double up",tip:"Two easy bars of 8ths, then the third bar doubles up into 16ths. Same pulse, twice the words.",section:"16",bpm:85,sub:4,lines:[{raw:"Ea-sy on the way in",pat:"X.x.|x.x.|X...|X...",meter:"4/4"},{raw:"Let the rhy-thm set-tle in",pat:"X.x.|X.x.|X.x.|X...",meter:"4/4"},{raw:"Dou-ble up the syl-la-bles and run it through the mid-dle",pat:"Xxxx|Xxxx|XxXx|XX..",meter:"4/4"}]},{key:"b6chant",name:"Hook chant",tip:"One word on every beat, like a crowd chant. Short and hard, nothing in between.",section:"16",bpm:100,sub:4,lines:[{raw:"Walk in, light up",pat:"X...|x...|X...|X...",meter:"4/4"},{raw:"Step through, stand tall",pat:"X...|X...|X...|X...",meter:"4/4"},{raw:"Arms wide, bring love",pat:"X...|X...|X...|X...",meter:"4/4"}]},{key:"b6tank",name:"Full tank",tip:"Almost every 16th has a syllable: fifteen a bar, one breath at the end. Keep them light so the stresses stand out.",section:"16",bpm:70,sub:4,lines:[{raw:"Ra-cing round the mar-gin of the page, I ne-ver take a break",pat:"XxXx|Xxxx|XxXx|XxX.",meter:"4/4"},{raw:"Thin-king of a hun-dred lit-tle things be-fore I fi-nish one",pat:"Xxxx|XxXx|XxXx|XxX.",meter:"4/4"},{raw:"Like an en-gine on the hig-hway I can feel the mo-tor shake",pat:"XxXx|xxXx|xXXx|XxX.",meter:"4/4"}]},{key:"b6mono",name:"One rhyme sound",tip:"Dense 16ths, and every bar ends on the same three-syllable rhyme sound. Keep the sound, change the words.",section:"16",bpm:80,sub:4,lines:[{raw:"E-very sin-gle de-tail of the met-hod is sta-tis-ti-cal",pat:"XxXx|xXxx|XxxX|xxX.",meter:"4/4"},{raw:"Ne-ver got a luc-ky break, my rise has been lo-gis-ti-cal",pat:"XxXx|XxXx|XxXX|xxX.",meter:"4/4"},{raw:"Keep the same vo-wel e-very bar un-til the sound is mys-ti-cal",pat:"XxXX|xXxX|XxxX|xXxX",meter:"4/4"}]},{key:"b7stjump",name:"Pitch jump stomp",tip:"Say the first word long and high, drop two quick low ones, then stop dead on 2. Same shape again on 3 and 4.",section:"16",bpm:95,sub:4,lines:[{raw:"Dust on the boots, sand in the eyes",pat:"X.xx|X...|X.xx|X...",meter:"4/4"},{raw:"Drums in the yard, flags in the air",pat:"X.xx|X...|X.xx|X...",meter:"4/4"},{raw:"Lamps on the road, eyes on the gate",pat:"X.xx|X...|X.xx|X...",meter:"4/4"}]},{key:"b7multi",name:"Half-bar multis",tip:"Steady 16ths with a two-syllable rhyme in the middle of the bar and its partner at the end. Hit both rhymes as hard as the beat.",section:"16",bpm:72,sub:4,lines:[{raw:"Back in the lab with a pen-cil, I sketch it in sten-cil",pat:"XxxX|xxXx|xXxx|XX..",meter:"4/4"},{raw:"Hol-ding the line in the win-ter, I am lit like a splin-ter",pat:"XxxX|xxXx|xxXX|xXX.",meter:"4/4"},{raw:"Coun-ting the days on the cei-ling, I am hea-ling the fee-ling",pat:"XxxX|xxXx|xxXx|xXX.",meter:"4/4"}]},{key:"b7echo",name:"Echo the word",tip:"The same word closes both halves of the bar: once around beat 2, then again into beat 4. The repeat is the hook.",section:"16",bpm:100,sub:4,lines:[{raw:"Call it ear-ly, I was ear-ly e-very time",pat:"XxXx|xxXx|Xx..|X...",meter:"4/4"},{raw:"Make it lou-der, then I make it lou-der still",pat:"XxXx|xxXx|Xx..|X...",meter:"4/4"},{raw:"Hold it clo-ser, then I hold it clo-ser now",pat:"XxXx|xxXx|Xx..|X...",meter:"4/4"}]},{key:"b7estart",name:"Start on the e",tip:"Rest on the beat, come in on the e: strong, weak, weak, then a long strong word on the next beat. Both strong words share a vowel.",section:"16",bpm:85,sub:4,lines:[{raw:"Take it a-way, make it to stay",pat:".Xxx|X...|.Xxx|X...",meter:"4/4"},{raw:"Hold it a-lone, fold it and go",pat:".Xxx|X...|.Xxx|X...",meter:"4/4"},{raw:"Light it on fire, write it up high",pat:".Xxx|X...|.Xxx|X...",meter:"4/4"}]},{key:"b8answer",name:"Answer back",tip:"Say the line, stop on beat 3, then answer yourself with one word on beat 4. The gap before the answer is part of the bar.",section:"16",bpm:130,sub:4,lines:[{raw:"Head down, mo-ving slow, why?",pat:"X.X.|X.x.|X...|X...",meter:"4/4"},{raw:"Old crew, fa-ces change, who?",pat:"X.X.|X.x.|X...|X...",meter:"4/4"},{raw:"E-very les-son came with a price, right?",pat:"XxXx|Xxx.|X...|X...",meter:"4/4"}]},{key:"b8ramp",name:"Ramp it up",tip:"A verse that speeds up without the tempo changing: first lots of space, then the gaps close, then every 16th is full.",section:"16",bpm:90,sub:4,lines:[{raw:"Pause. Look. Breathe. Speak.",pat:"X...|X...|X...|X...",meter:"4/4"},{raw:"Now the gaps are clo-sing fas-ter than be-fore",pat:"X.x.|XxXx|Xxxx|X...",meter:"4/4"},{raw:"E-very syl-lab-le is stac-king up and ra-cing to the line",pat:"XxXx|xxXx|xxXx|xxX.",meter:"4/4"}]},{key:"b8chug",name:"Double time, then breakdown",tip:"Two bars of fast 16ths, then drop to one heavy word per beat, like a guitar breakdown. Same tempo, a quarter of the syllables.",section:"16",bpm:90,sub:4,lines:[{raw:"Grew up on the dou-ble kick and now I'm dou-ble-tim-ing it",pat:"Xxxx|XxXx|XXXx|XxX.",meter:"4/4"},{raw:"Raised on break-downs, e-very mosh pit taught me how to count it",pat:"XxXx|XxXX|XxXx|XX..",meter:"4/4"},{raw:"Drop. Tune. Low. Chug.",pat:"X...|X...|X...|X...",meter:"4/4"}]},{key:"b8echo",name:"Echo the end word",tip:"Finish the line by beat 3, then say the last word again on beat 4, like a delay throw on the vocal. Keep the echo lighter.",section:"16",bpm:95,sub:4,lines:[{raw:"Leave a lit-tle air, air",pat:"X.x.|X.x.|X...|X...",meter:"4/4"},{raw:"Send the last word up high, high",pat:"X.x.|X.X.|x.X.|X...",meter:"4/4"},{raw:"Throw it to the back wall, wall",pat:"X.x.|x.x.|X.X.|X...",meter:"4/4"}]},{key:"b8mid",name:"Rhymes in the middle",tip:"Full 16ths with a cluster of rhymes on beats 2 and 3, not just at the end. Hit each rhyme word a bit harder so the cluster pops.",section:"16",bpm:70,sub:4,lines:[{raw:"Took the stairs, the air was thin, I did-n't care, I kept on clim-bing",pat:"XxXx|XxXx|XxXx|XxXX",meter:"4/4"},{raw:"Rol-ling thun-der, un-der pres-sure, ne-ver won-der where I'm goi-ng",pat:"XxXx|XxxX|XxXx|XXXX",meter:"4/4"},{raw:"Catch a breath and take a step, and I ne-ver rest, I'm on a quest",pat:"XxXx|XxXx|xXxX|XxxX",meter:"4/4"}]},{key:"b1two4",name:"Punch on 2 and 4",tip:"Land one rhyme on beat 2, breathe, then run the rest of the line into the matching rhyme on beat 4. Two landings make the punch hit harder.",section:"sync",bpm:90,sub:4,lines:[{raw:"Take the stage, I was rot-ting in a cage",pat:"X.x.|X.xx|Xxxx|X...",meter:"4/4"},{raw:"Break the chain, I was wal-king in the rain",pat:"X.x.|X.xx|Xxxx|X...",meter:"4/4"},{raw:"Burn the map, I was ne-ver in your trap",pat:"X.x.|X.xx|Xxxx|X...",meter:"4/4"}]},{key:"b1voice",name:"Own your vowels",tip:"Say it in your own voice and accent, but keep every stressed word on the 8th grid. The timing is what makes it land, not the accent.",section:"sync",bpm:90,sub:4,lines:[{raw:"Talk how I talk, it's my own sound",pat:"X.X.|x.X.|X.x.|X.X.",meter:"4/4"},{raw:"Bend e-very vo-wel, still on time",pat:"X.X.|x.X.|x.X.|x.X.",meter:"4/4"},{raw:"Say it my way, land it straight",pat:"X.x.|x.X.|X.x.|X...",meter:"4/4"}]},{key:"b1dense",name:"Dense 16ths",tip:"Nearly every 16th filled, the stresses wherever the words put them. Stay even and still land on 4.",section:"sync",bpm:75,sub:4,lines:[{raw:"Stac-king up the vo-wels and I'm crac-king e-very code to-night",pat:"Xxxx|XxxX|XxXx|XXX.",meter:"4/4"},{raw:"Swit-ching up the pat-tern in the mid-dle of the sen-tence",pat:"Xxxx|Xxxx|Xxxx|XX..",meter:"4/4"},{raw:"Ne-ver on the beat you would ex-pect but I con-nect it",pat:"Xxxx|XxXX|xxxX|xX..",meter:"4/4"}]},{key:"b1offg",name:"Off-grid 16ths",tip:"The same 16ths, but start one 16th late, on the e of 1. Every stress moves off the beat and you still finish on 4.",section:"sync",bpm:75,sub:4,lines:[{raw:"Slip-ping in a beat late and still a-head of you",pat:".Xxx|xXXx|XxXx|.X..",meter:"4/4"},{raw:"E-very lit-tle de-tail on the page is mea-sured",pat:".XxX|xxXx|xXx.|XX..",meter:"4/4"},{raw:"Hol-ding back the dow-nbeat till the last word hits",pat:".XxX|xXxx|xXX.|.X..",meter:"4/4"}]},{key:"b1heel3",name:"Heel on 3",tip:"The bar heel is where the focus rhyme sits. Move it from 4 to 3: land the rhyme on beat 3 and leave beat 4 empty.",section:"sync",bpm:90,sub:4,lines:[{raw:"Plant it on the three",pat:"X.x.|X.x.|X...|....",meter:"4/4"},{raw:"Ear-ly land-ing, hold",pat:"X.x.|X.x.|X...|....",meter:"4/4"},{raw:"Stop it short of four",pat:"X.x.|X.x.|X...|....",meter:"4/4"}]},{key:"b1heelmv",name:"Move the heel",tip:"A four-bar cadence where the rhyme moves: beat 4, then 3, then 2. Same rhyme sound, a new landing every bar.",section:"sync",bpm:90,sub:4,lines:[{raw:"Keep it stead-y, land on four",pat:"X.x.|X.x.|X.x.|X...",meter:"4/4"},{raw:"Pull it back to three",pat:"X.x.|X.x.|X...|....",meter:"4/4"},{raw:"Then back on two",pat:"X.xx|X...|....|....",meter:"4/4"}]},{key:"dhswitch",name:"Straight then syncopated",tip:"Two beats of even 16ths, then break the stream: short, long, short, long. Hold the last word and let the bar breathe.",section:"sync",bpm:103,sub:4,lines:[{raw:"Pat-ter-ing a-round the drum-kit, then stop, then go",pat:"Xxxx|Xxxx|xX.x|X...",meter:"4/4"},{raw:"Rac-ing ev-ery six-teenth note and then break it down",pat:"Xxxx|Xxxx|xX.x|X...",meter:"4/4"},{raw:"Fin-gers flick-er on the hi-hat, so lean, so low",pat:"Xxxx|Xxxx|xX.x|X...",meter:"4/4"}]},{key:"disp16",name:"Shift it a dotted 8th",tip:"Start three 16ths late: rest on the beat, two quick ones, then the strong word on the a, right before the next beat. It pulls against the drums.",section:"sync",bpm:95,sub:4,lines:[{raw:"And a drum, and a hum, then a run, then it's done",pat:".xxX|.xxX|.xxX|.xxX",meter:"4/4"},{raw:"From the side, take a ride, let it slide, then ar-rive",pat:".xxX|.xxX|.xxX|.xxX",meter:"4/4"},{raw:"Ev-ery hit, com-ing late, ev-ery stress, on the wait",pat:".xxX|.xxX|.xxX|.xxX",meter:"4/4"}]},{key:"drillsync",name:"Drill syncopation",tip:"Pack the words up to beat 3 and stop there. The last little word on the and of 4 is the pickup into the next line.",section:"sync",bpm:73,sub:4,lines:[{raw:"Low and slow through the back of the old yard, then",pat:"X.xX|xxXx|xXX.|..x.",meter:"4/4"},{raw:"Mask on, head down, and rain on the wind-shield, so",pat:"X.xX|xxXx|xXX.|..x.",meter:"4/4"},{raw:"Lights out, clock reads two, still we are out-side, then",pat:"X.xX|xxXx|xXX.|..x.",meter:"4/4"}]},{key:"offeas",name:"Only the e and the a",tip:"Every syllable on a 16th off-beat: the e and the a, never the beat, never the and. Feel the beat, then step around it.",section:"sync",bpm:104,sub:4,lines:[{raw:"Skip past, slip through, dip low, gone now",pat:".X.X|.X.X|.X.X|.X.X",meter:"4/4"},{raw:"Tip-toe in-side past ev-ery guard",pat:".X.X|.X.X|.X.X|.X.X",meter:"4/4"},{raw:"Ghost notes, soft steps, no one hears us",pat:".X.X|.X.X|.X.X|.X.X",meter:"4/4"}]},{key:"offghost",name:"Off-beats with a ghost",tip:"Still all off-beats, but one small word slips onto the in-between spot. Keep it light; the strong words stay on the e and the a.",section:"sync",bpm:104,sub:4,lines:[{raw:"Stay low, move quick, and slide through back gates",pat:".X.X|.X.X|xX.X|.X.X",meter:"4/4"},{raw:"Cold hands, warm heart, eyes up, stay calm",pat:".X.X|.X.X|.XxX|.X..",meter:"4/4"},{raw:"Each step, each breath, and each move stays off",pat:".X.X|.X.X|xX.X|.X.X",meter:"4/4"}]},{key:"vsintro",name:"Verse intro: leave space",tip:"Start the verse with even lines of 16ths and a real gap at the end of each. Keep them alike: you're setting up a pattern to break later.",section:"sync",bpm:108,sub:4,lines:[{raw:"E-very line is e-ven, leave a lit-tle room",pat:"XxXx|XxXx|Xx..|X...",meter:"4/4"},{raw:"Say-ing it the same way, so you know the tune",pat:"Xxxx|XXxx|Xx..|X...",meter:"4/4"},{raw:"Mir-ror e-very mea-sure, then a breath, and through",pat:"XxXx|Xxxx|X..x|X...",meter:"4/4"}]},{key:"vsheel",name:"Verse switch: land early",tip:"Bring the gap back, but end the line earlier: land on beat 3, hold it, stay quiet, and slip in two pickup words for the next line.",section:"sync",bpm:108,sub:4,lines:[{raw:"Cut-ting the line be-fore the four, and now",pat:"XxxX|xx.x|X...|..xx",meter:"4/4"},{raw:"Leav-ing a gap be-hind the three, so then",pat:"XxxX|xx.x|X...|..xx",meter:"4/4"},{raw:"Fin-ish-ing ear-ly on the three, and we",pat:"XxxX|xx.x|X...|..xx",meter:"4/4"}]},{key:"flowtifans",name:"Motif and answer",tip:"The first half of every bar is the motif. The second half answers it differently each time, but the end always lands the same way.",section:"sync",bpm:88,sub:4,lines:[{raw:"The clock is a-live in the room and the hands are turn-ing to noon",pat:"xXxx|XxxX|xxXx|XxxX",meter:"4/4"},{raw:"A can-dle is flick-er-ing on the side of the ta-ble a-lone",pat:"xXxx|Xxxx|xxxx|XxxX",meter:"4/4"},{raw:"The shad-ow is danc-ing a-round, big, bold, bright, then fades to the ground",pat:"xXxx|Xxxx|XXXx|XxxX",meter:"4/4"}]},{key:"pull16",name:"Pull it a 16th early",tip:"The straight version would sit on 8ths. Pull three of the words a 16th early and the bar starts to bounce; the rhyme still lands on the and of 4.",section:"sync",bpm:119,sub:4,lines:[{raw:"Tip-toe in-to space and then glide down",pat:"X.xX|.x.X|.xx.|X.X.",meter:"4/4"},{raw:"Sneak a-round the beat and then slide in",pat:"X.xX|.x.X|.xx.|X.X.",meter:"4/4"},{raw:"Step a-head and shave off the top clean",pat:"X.xX|.x.X|.xx.|X.X.",meter:"4/4"}]},{key:"cad4",name:"Four-bar cadence",tip:"One line per bar, every line lands on beat 4. Four of them make one cadence: the plain shape to build on.",section:"sync",bpm:127,sub:4,lines:[{raw:"Four beats make a line and then I breathe",pat:"X.X.|XxXx|xx..|X...",meter:"4/4"},{raw:"Se-cond bar the same, the shape re-peats",pat:"XxXx|X..x|..Xx|X...",meter:"4/4"},{raw:"Third one mat-ches up, the pat-tern holds",pat:"X.X.|Xxxx|Xx..|X...",meter:"4/4"}]},{key:"irh1",name:"Echo the end inside",tip:"Take the end rhyme of one bar and hide it inside the next: the same sound comes back mid-bar before it lands again.",section:"sync",bpm:80,sub:4,lines:[{raw:"Let me tell you what it took to make a big de-ci-sion",pat:"XxXx|XxXx|XxXx|XX..",meter:"4/4"},{raw:"Hit it with pre-ci-sion got a vi-sion of di-vi-sion",pat:"Xxxx|XxXx|XxxX|xX..",meter:"4/4"},{raw:"E-very word is in po-si-tion it's a mis-sion with am-bi-tion",pat:"XxXx|xXxx|XxXx|xxXX",meter:"4/4"}]},{key:"b4met2",name:"Double kick 16ths",tip:"Metal energy: every 16th gets a syllable, hard consonants like a double kick drum. Keep it even, land on 4.",section:"sync",bpm:80,sub:4,lines:[{raw:"Dou-ble kick-drum pound-ing like a heart that nev-er quits",pat:"XXXX|XXXx|XxXX|X...",meter:"4/4"},{raw:"Ev-e-ry syl-la-ble is sharp-er than a gui-tar pick",pat:"XXxX|XXxX|XxxX|XX..",meter:"4/4"},{raw:"Scream-ing in the mic un-til the speak-er starts to split",pat:"XXxx|XXXx|XXXx|X...",meter:"4/4"}]},{key:"lfc1",name:"Say it like you mean it",tip:"Same end word every bar, said with full weight. Leave the space before it and land it on beat 4 like you own it.",section:"sync",bpm:98,sub:4,lines:[{raw:"Know my worth, so I back my-self",pat:"X.x.|X.x.|x.X.|X.X.",meter:"4/4"},{raw:"No se-cond guess I be-lieve my-self",pat:"X.Xx|X.xx|X.X.|X...",meter:"4/4"},{raw:"Head held high I can hear my-self",pat:"X.X.|X.x.|X.X.|X.X.",meter:"4/4"}]},{key:"b4lofi",name:"Easy 8ths",tip:"Lofi pocket: relaxed 8ths, talk it more than you push it, and let the rhyme land soft on beat 4.",section:"sync",bpm:126,sub:4,lines:[{raw:"Mid-night, sip-ping on a cold drink",pat:"X.X.|X.X.|x.x.|X.X.",meter:"4/4"},{raw:"Laugh-ing at the things that we'd think",pat:"X.X.|x.x.|X.x.|X.X.",meter:"4/4"},{raw:"Years can fly right by in a blink",pat:"X.X.|X.X.|x.x.|x.X.",meter:"4/4"}]},{key:"b4meta1",name:"Same rhythm, new weight",tip:"Twelve 16ths and a long word on 4, every bar the same rhythm. Only the stress moves: on the beats, then the off-beats, then just 2 and 4.",section:"sync",bpm:80,sub:4,lines:[{raw:"Mov-ing ev-ery stress a-round the bar to make it new",pat:"Xxxx|Xxxx|Xxxx|X...",meter:"4/4"},{raw:"So I bend it in be-tween and hit the off-beat side",pat:"xxXx|xxXx|xxXx|x...",meter:"4/4"},{raw:"Then I let the snare de-cide where all the weight should fall",pat:"xxxx|Xxxx|xxxx|X...",meter:"4/4"}]},{key:"longw",name:"Long words, tight 16ths",tip:"Four-syllable words, one 16th per syllable. Their stress lands on the e of the beat, so let the words roll and keep the grid steady.",section:"sync",bpm:80,sub:4,lines:[{raw:"Rad-i-cal, me-chan-i-cal, sym-met-ri-cal, me-thod-i-cal",pat:"XxxX|xxxX|xxxX|xxX.",meter:"4/4"},{raw:"E-du-ca-ted, com-pli-ca-ted, de-co-ra-ted, de-di-ca-ted",pat:"Xxxx|Xxxx|xXxx|xXxX",meter:"4/4"},{raw:"Mea-sure af-ter mea-sure is an ar-chi-tec-ture of de-sign",pat:"XxXx|Xxxx|xXxx|xxX.",meter:"4/4"}]},{key:"stopgo",name:"Calm, then burst",tip:"Two beats of easy 8ths, then 16ths rush into the landing on 4. The speed-up is the drama.",section:"sync",bpm:83,sub:4,lines:[{raw:"Calm and stead-y, sprint-ing to the blast",pat:"X.x.|X.x.|Xxxx|X...",meter:"4/4"},{raw:"Hold the scene now, sud-den-ly take flight",pat:"X.x.|X.x.|Xxxx|X...",meter:"4/4"},{raw:"Big screen mo-ment, cap-ture it in light",pat:"X.x.|X.x.|Xxxx|X...",meter:"4/4"}]},{key:"punch4",name:"Punch on 4",tip:"Set the punchline up in 8ths and hit the last word on beat 4, then stop. Landing on 4 instead of the next 1 gives the punch room.",section:"sync",bpm:90,sub:4,lines:[{raw:"Set it up and let it drop",pat:"X.x.|x.x.|X.x.|X...",meter:"4/4"},{raw:"All that talk and then the knock",pat:"X.x.|X.x.|x.x.|X...",meter:"4/4"},{raw:"Wait for four, then hit them hard",pat:"X.x.|X.x.|X.X.|X...",meter:"4/4"}]},{key:"b6talk",name:"Spoken 16ths",tip:"Talk it, don't sing it: about 13 syllables on the 16ths, the line starts on the 1 and the last word lands on beat 4.",section:"sync",bpm:80,sub:4,lines:[{raw:"No-bo-dy clim-bing past me e-ver stops to throw a stone",pat:"XxxX|xXxX|xXxX|xX..",meter:"4/4"},{raw:"All the noise is co-ming from the ones who sit at home",pat:"XxXx|Xxxx|XXXx|X...",meter:"4/4"},{raw:"Let them talk, I keep my head up and I build my own",pat:"XXXx|XxXx|xxXx|X...",meter:"4/4"}]},{key:"b6chest",name:"Full voice",tip:"A packed 16ths bar said with your whole chest: hit every stressed syllable hard and still land on beat 4.",section:"sync",bpm:70,sub:4,lines:[{raw:"Put my whole chest in it ev-ery time I o-pen my mouth",pat:"XxXX|xxXx|XxXx|xX..",meter:"4/4"},{raw:"E-very word is co-ming from the bot-tom of the heart I got",pat:"XxXx|Xxxx|Xxxx|XxX.",meter:"4/4"},{raw:"If it does-n't burn a lit-tle, it ain't worth a thing",pat:"XxXx|Xxxx|XxXx|X...",meter:"4/4"}]},{key:"b6build",name:"Build into 16ths",tip:"The verse fills up from 12 to 14 syllables on the 16ths. More words, same landing on beat 4.",section:"sync",bpm:80,sub:4,lines:[{raw:"Ne-ver co-ming qui-et when the room is wai-ting",pat:"XxXx|Xxxx|Xx.X|X...",meter:"4/4"},{raw:"E-very sin-gle time I en-ter, all the peop-le feel it",pat:"XxXx|XxXx|XxXx|XX..",meter:"4/4"},{raw:"Dressed in all the things I earned and I am not de-ba-ting",pat:"XxXx|XxXx|xxXx|XX..",meter:"4/4"}]},{key:"b6dot",name:"Dotted 8ths",tip:'One syllable every three 16ths (a dotted 8th): six in a bar, each a little later against the beat until the last one sits on the "a" of 4.',section:"sync",bpm:85,sub:4,lines:[{raw:"Slow drums, warm room, eyes closed",pat:"X..X|..X.|.X..|X..X",meter:"4/4"},{raw:"Big steps, long road, keep on",pat:"X..X|..X.|.X..|X..X",meter:"4/4"},{raw:"Cold air, bright stars, long night",pat:"X..X|..X.|.X..|X..X",meter:"4/4"}]},{key:"b7grid",name:"Dead on the grid",tip:"Every syllable sits exactly on its 16th, kick and snare included. No push, no drag: a straight flow.",section:"sync",bpm:87,sub:4,lines:[{raw:"Pic-ture e-very word in a box on the floor",pat:"XxXx|XxxX|xx..|X...",meter:"4/4"},{raw:"Tic-king like a clock that was built in a lab",pat:"XxXx|XxxX|xx..|X...",meter:"4/4"},{raw:"E-very syl-lab-le sits where the drum-mer can count it",pat:"XxXx|xXXx|XxXX|X...",meter:"4/4"}]},{key:"b7ondr",name:"Land on the drums",tip:"Unsyncopated: every stressed word lands where a drum hits, on 1, 2, 3 and 4.",section:"sync",bpm:90,sub:4,lines:[{raw:"Kick and snare and kick and snare",pat:"X.x.|X.x.|X.x.|X...",meter:"4/4"},{raw:"Feet go down on e-very count",pat:"X.X.|X.x.|X.x.|X...",meter:"4/4"},{raw:"Hit the one and hit the four",pat:"X.x.|X.x.|X.x.|X...",meter:"4/4"}]},{key:"b7offdr",name:"Land between the drums",tip:'Syncopated: the stressed words fall on the "and" between the drums. Start a little late and stay in the gaps.',section:"sync",bpm:90,sub:4,lines:[{raw:"Skip the kick and find the gap",pat:"..X.|x.X.|x.X.|x.X.",meter:"4/4"},{raw:"Slide from where the drum-mer goes",pat:"..X.|x.X.|x.X.|x.X.",meter:"4/4"},{raw:"Stay be-hind the hat, my turn",pat:"..X.|x.X.|x.X.|x.X.",meter:"4/4"}]},{key:"b7pepper",name:"Pepper the offbeats",tip:"A full bar of 16ths where every stress falls on an e or an a, never on the beat. Lean on the in-between.",section:"sync",bpm:75,sub:4,lines:[{raw:"Keep my feet a-round the beat and let the off-beat speak for me",pat:".XxX|xXxX|xXxX|xXxX",meter:"4/4"},{raw:"Be-tween drums the ac-cents jump and ev-ery one of them is late",pat:".XxX|xxXX|xXxX|xXxX",meter:"4/4"},{raw:"Put the weight on ev-ery e and land the pat-tern on the four",pat:".XxX|xXxX|xXxX|xxxX",meter:"4/4"}]},{key:"b8gridsw",name:"Straight into triplets",tip:"Beat 1 is two straight 8ths, then the grid flips: beats 2, 3 and 4 are triplets. Switch without slowing down.",section:"sync",bpm:80,sub:12,lines:[{raw:"Stead-y, rol-ling it o-ver and un-der it",pat:"X.....x.....|X...x...x...|X...x...x...|X...x...x...",meter:"4/4"},{raw:"E-ven, gal-lop-ing, ham-mer-ing, bat-ter-ing",pat:"X.....x.....|X...x...x...|X...x...x...|X...x...x...",meter:"4/4"},{raw:"Sim-ple, sud-den-ly ev-ery-thing tum-bles in",pat:"X.....x.....|X...x...x...|X...x...x...|X...x...x...",meter:"4/4"}]},{key:"b8early",name:"Switch a beat early",tip:"Same flow, but every line starts on beat 4 of the bar before and ends on beat 3. Moving the whole line one beat earlier changes how it feels.",section:"sync",bpm:90,sub:4,lines:[{raw:"Change the fee-ling, start a beat a-head",pat:"(XxXx)|..X.|.xXx|X...|....",meter:"4/4"},{raw:"Move the line and watch it turn",pat:"(Xx)|X.x.|X.x.|X...|....",meter:"4/4"},{raw:"Flip the verse and come in ear-ly",pat:"(Xx)|X.x.|X.x.|X.X.|....",meter:"4/4"}]},{key:"b1cnt3",name:"Count it in 3",tip:"The same beat can be counted in 3. Feel three beats per bar and land the rhyme on 3.",section:"odd",bpm:90,sub:4,lines:[{raw:"Turn a-round, find the ground",pat:"X.x.|X.X.|x.X.",meter:"3/4"},{raw:"Waltz it slow, then let go",pat:"X.x.|X.x.|X.X.",meter:"3/4"},{raw:"Round and round the ca-rou-sel",pat:"XxXx|..Xx|X...",meter:"3/4"}]},{key:"b1waltz",name:"Three-four in 16ths",tip:"A 3/4 beat: only three beats in the bar. Keep the 16ths even and land on 3 before the bar comes round again.",section:"odd",bpm:80,sub:4,lines:[{raw:"Spin-ning on a beat that on-ly counts to three",pat:"Xxxx|XxXx|XxX.",meter:"3/4"},{raw:"E-very sin-gle bar is shor-ter than you think",pat:"XxXx|XxXx|xxX.",meter:"3/4"},{raw:"Wal-tzing with the drum-mer and I ne-ver trip",pat:"Xxxx|Xxxx|XxX.",meter:"3/4"}]},{key:"b1five",name:"Five-eight cell",tip:"A bar of five 8ths: long, long-tied, short, short (3 + 3 + 2 + 2 sixteenths). Four syllables, nothing on the beat you expect.",section:"odd",bpm:90,sub:4,lines:[{raw:"Push it off line",pat:"X..x..|X.x.",meter:"5/8"},{raw:"Count to five now",pat:"X..x..|X.x.",meter:"5/8"},{raw:"Stay on the edge",pat:"X..x..|X.x.",meter:"5/8"}]},{key:"b1sev3",name:"Seven: long one first",tip:"Seven 8ths grouped 3 + 2 + 2: the long group comes first, then two quick ones, and the next bar starts early.",section:"odd",bpm:90,sub:4,lines:[{raw:"Long first, then the short ones",pat:"X.X.x.|x.X.|X...",meter:"7/8:3+2+2"},{raw:"Stum-ble but I land on my feet",pat:"Xx.x.x|Xxx.|X...",meter:"7/8:3+2+2"},{raw:"Odd bars got me lea-ning for-ward",pat:"X.X.Xx|Xx.X|X...",meter:"7/8:3+2+2"}]},{key:"b1sev16",name:"Seven in 16ths",tip:"Fill the 7/8 bar with even 16ths. Fourteen slots, not sixteen: land early on the last group and go again.",section:"odd",bpm:80,sub:4,lines:[{raw:"E-very bar is cut a lit-tle shor-ter than the last",pat:"XxXx|XxXx|XxxxX.",meter:"7/8"},{raw:"Coun-ting up to se-ven and I'm back be-fore you know it",pat:"Xxxx|XxxX|XxXxXX",meter:"7/8"},{raw:"Hur-ry up, the dow-nbeat's co-ming ear-ly e-very time",pat:"Xxxx|XxXx|XxXxX.",meter:"7/8"}]},{key:"odd74",name:"Seven four",tip:"A bar of seven beats split 4 + 3. Land the first rhyme on beat 4, then squeeze the answer into the last three beats.",section:"odd",bpm:120,sub:4,lines:[{raw:"Count it slow and hold the line, three more and it's mine",pat:"X.x.|X.x.|X.x.|X.X.|X.x.|X...|X...",meter:"7/4"},{raw:"E-very bar is run-ning long, two steps and a song",pat:"X.x.|X.x.|X.x.|X.X.|X.x.|x...|X...",meter:"7/4"},{raw:"Odd time keeps the crowd a-wake, ne-ver sure where it ends",pat:"X.X.|X.x.|X.x.|X.X.|x.X.|X.x.|X...",meter:"7/4"}]},{key:"sev78",name:"Short bar",tip:"Seven syllables, one per pulse, then the bar is over. Don't wait for an eighth beat: the next 1 comes early.",section:"odd",bpm:120,sub:4,lines:[{raw:"Cut it short and spin a-round",pat:"XxXx|XxX",meter:"7/16:4+3"},{raw:"Clip the end and roll it on",pat:"XxXx|XxX",meter:"7/16:4+3"},{raw:"Trim the bar and keep it tight",pat:"XxXx|XxX",meter:"7/16:4+3"}]},{key:"s17a",name:"Seventeen sixteen",tip:"Seventeen 16ths, grouped 5 + 5 + 7. Two syllables in each five, three in the seven; the stresses mark where each group starts.",section:"odd",bpm:90,sub:4,lines:[{raw:"Climb the hill and mark the stone",pat:"X.x..|X.x..|X.x.X..",meter:"17/16:5+5+7"},{raw:"Odd the count but true the line",pat:"X.x..|X.x..|X.x.X..",meter:"17/16:5+5+7"},{raw:"Five and five and sev-en more",pat:"X.x..|X.x..|X.x.X..",meter:"17/16:5+5+7"}]},{key:"s17b",name:"Fill the odd bar",tip:"Four 16ths in each five, six in the seven, a breath at the end of every group. The bar comes round a 16th later than you expect.",section:"odd",bpm:85,sub:4,lines:[{raw:"Pull it to the mid-dle of the ta-ble, now we turn it",pat:"Xxxx.|Xxxx.|XxxxXx.",meter:"17/16:5+5+7"},{raw:"Count it on your fin-gers in the dark and nev-er lose it",pat:"Xxxx.|Xxxx.|XxxxXx.",meter:"17/16:5+5+7"},{raw:"Five and then a-noth-er five and sev-en if you need it",pat:"Xxxx.|Xxxx.|XxxxXx.",meter:"17/16:5+5+7"}]},{key:"four7",name:"Fours over seven",tip:"The riff is in 7/8, the flow accents every fourth 8th. Each bar the accent sits one 8th later, so feel the four against the seven.",section:"odd",bpm:110,sub:4,lines:[{raw:"Four on sev-en, push and pull",pat:"X.x.|x.x.|X.x.x.",meter:"7/8"},{raw:"the four slides on, the riff stays",pat:"x.X.|x.x.|x.X.x.",meter:"7/8"},{raw:"the riff keeps spin-ning, we land",pat:"x.x.|X.x.|x.x.X.",meter:"7/8"}]},{key:"dt78",name:"Double time in 7/8",tip:"Fourteen 16ths in a 7/8 bar. Keep the stream even; the bar ends half a beat early, so the next 1 comes sooner than you expect.",section:"odd",bpm:90,sub:4,lines:[{raw:"Doub-le time in-side the se-ven, ne-ver do I lose count",pat:"XxXX|xxXx|XxxxXX",meter:"7/8"},{raw:"Four-teen lit-tle steps and then the riff comes right back a-round",pat:"XxXx|Xxxx|XXXXxX",meter:"7/8"},{raw:"Odd me-ter, e-ven breat-hing, keep it mo-ving through the bend",pat:"XXxX|xXxX|xXxXxX",meter:"7/8"}]},{key:"sw78",name:"7/8 switch-up",tip:"Same 7/8, regrouped long-short-short (3 + 2 + 2). Stress the start of each group: the long one comes first now.",section:"odd",bpm:110,sub:4,lines:[{raw:"Sa-tur-day, Mon-day, Tues-day",pat:"X.x.x.|X.x.|X.X.",meter:"7/8:3+2+2"},{raw:"He-si-tate, cut it, run it",pat:"X.x.x.|X.x.|X.X.",meter:"7/8:3+2+2"},{raw:"Gat-he-ring, rol-ling, on-ward",pat:"X.x.x.|X.x.|X.X.",meter:"7/8:3+2+2"}]},{key:"b6w8",name:"Three, not six",tip:"Three beats a bar, each split in two. Lean on 1, 2 and 3; a 6/8 would lean on 1 and the middle instead.",section:"odd",bpm:90,sub:4,lines:[{raw:"Lean on the one, then glide",pat:"X.x.|x.X.|x.X.",meter:"3/4"},{raw:"Walk it in three, not six",pat:"X.x.|x.X.|X.X.",meter:"3/4"},{raw:"Round and round we spin",pat:"X.x.|X.x.|X...",meter:"3/4"}]},{key:"b6w16",name:"16ths in three",tip:"Fill the 3/4 bar with 16ths, twelve slots. The bar is shorter than you expect: land the last word on beat 3.",section:"odd",bpm:75,sub:4,lines:[{raw:"Tur-ning the cor-ner in three with a hea-vy step",pat:"XxxX|xxXx|xXxX",meter:"3/4"},{raw:"E-very bar is a cir-cle that comes back a-round",pat:"XxXx|xXxx|XXxX",meter:"3/4"},{raw:"Ne-ver in six, I'm kee-ping the three in con-trol",pat:"XxxX|XXxx|XxXX",meter:"3/4"}]},{key:"b7five8",name:"Five eight",tip:"A short bar of five eighths, two plus three. It always comes round a beat too soon, so keep the words short.",section:"odd",bpm:90,sub:4,lines:[{raw:"Five is a fight",pat:"X.x.x.|X...",meter:"5/8"},{raw:"Shor-ter and sharp",pat:"X.x.x.|X...",meter:"5/8"},{raw:"Cut it in half",pat:"X.x.x.|X...",meter:"5/8"}]},{key:"b7sev43",name:"Seven eight, four plus three",tip:"Seven eighths split long then short: count 1 2 3 4, 1 2 3. Land the last word on the short group.",section:"odd",bpm:90,sub:4,lines:[{raw:"Stretch it out, then cut it short",pat:"X.x.X.x.|X.x.X.",meter:"7/8:4+3"},{raw:"Four to climb, then three to fall",pat:"X.x.X.x.|X.x.X.",meter:"7/8:4+3"},{raw:"Hold it long and let it go",pat:"X.x.X.x.|X.x.X.",meter:"7/8:4+3"}]},{key:"b8five",name:"Five-eight groups",tip:"A bar of five 8ths, counted 1-2-3, 1-2. Stress the start of each group and come back to the 1 sooner than you expect.",section:"odd",bpm:90,sub:4,lines:[{raw:"Threads ac-ross the frame",pat:"X.x.X.|x.X.",meter:"5/8"},{raw:"Limp in-to the one",pat:"X.X.x.|x.X.",meter:"5/8"},{raw:"Count it short and odd",pat:"X.x.X.|x.X.",meter:"5/8"}]},{key:"b8suite",name:"Odd-meter suite",tip:"Every bar has its own length: five 8ths, then seven, then a short two-four. Keep the pulse and let the bar line move.",section:"odd",bpm:90,sub:4,lines:[{raw:"Odd steps, keep on",pat:"X.X.X.|X...",meter:"5/8"},{raw:"Two and two and three to land",pat:"X.x.|X.x.|X.x.X.",meter:"7/8"},{raw:"Short and sharp, done",pat:"X.x.|X.X.",meter:"2/4"}]},{key:"b1five4",name:"Five over four",tip:"Keep repeating the five-eight cell on a normal 4/4 beat. It drifts across the bar line and starts somewhere new every bar.",section:"poly",bpm:90,sub:4,lines:[{raw:"Odd time on a straight beat",pat:"X..x|..x.|x.X.|.x..",meter:"4/4"},{raw:"Watch the rhy-thm slide a-way",pat:"x.x.|X..x|..x.|x.X.",meter:"4/4"},{raw:"Then it lands back on one",pat:".x..|x.x.|X..x|..x.",meter:"4/4"}]},{key:"b1stab",name:"Stab words",tip:"Two-beat cells that stop hard on 2 and 4. Hit the last word of each cell and leave the space after it.",section:"poly",bpm:90,sub:4,lines:[{raw:"Hear me out, I came from far",pat:"X.x.|X...|x.Xx|X...",meter:"4/4"},{raw:"E-very vo-wel, mine to keep",pat:"X.x.|Xx..|X.x.|X...",meter:"4/4"},{raw:"Dif-fe-rent town, same old beat",pat:"X.xx|X...|X.X.|X...",meter:"4/4"}]},{key:"jb1",name:"Jump the one",tip:"The first word comes a 16th early, on the a before the 1, and holds over the downbeat. Then the 16ths run from the e.",section:"poly",bpm:90,sub:4,lines:[{raw:"Up and get your bo-dy mov-ing, hit the drum",pat:"(X)|.xXx|XxXx|XxX.|....",meter:"4/4"},{raw:"Jump and let the rhy-thm lift you off the ground",pat:"(X)|.xXx|XxXx|XxX.|....",meter:"4/4"},{raw:"Now we turn the cor-ner dan-cing through the night",pat:"(X)|.xXx|XxXx|XxX.|....",meter:"4/4"}]},{key:"dsp1",name:"Across the bar line",tip:"The phrase starts on beat 3 and runs over the bar line, landing on beat 2. Read the bar from the middle: the second half starts the sentence, the first half finishes it.",section:"poly",bpm:85,sub:4,lines:[{raw:"o-ver to the two. Start it on the three and roll it",pat:"Xxxx|X...|Xxxx|XxXx",meter:"4/4"},{raw:"a-cross the bar line. Wait a beat and then I car-ry",pat:"xXxx|X...|XxXx|xxXx",meter:"4/4"},{raw:"in-to the new bar. Half a bar a-head I'm stretch-ing",pat:"Xxxx|X...|XxXx|XxXx",meter:"4/4"}]},{key:"b1five16",name:"Fives against four",tip:"Every 16th filled, grouped in fives: the stress moves one 16th later every group, and the last one lands on the a of 4.",section:"poly",bpm:70,sub:4,lines:[{raw:"Cal-cu-lat-ing it, nev-er giv-ing up, dec-o-rat-ing it, done",pat:"Xxxx|xXxx|xxXx|xxxX",meter:"4/4"},{raw:"Hid-den in the code, nev-er read a-loud, on-ly in the dark, now",pat:"Xxxx|xXxx|xxXx|xxxX",meter:"4/4"},{raw:"Scram-ble ev-ery line, shuf-fle ev-ery word, read it if you can, go",pat:"Xxxx|xXxx|xxXx|xxxX",meter:"4/4"}]},{key:"b1code3",name:"Threes from the e",tip:"Groups of three against the four, but start one 16th late, on the e of 1. The pattern never lines up with the beat until the end.",section:"poly",bpm:75,sub:4,lines:[{raw:"Mes-sa-ges hid-den in cyp-her-text, no-bo-dy knows",pat:".Xxx|XxxX|xxXx|xX..",meter:"4/4"},{raw:"Loc-king it up in a ca-bi-net, un-der the stairs",pat:".Xxx|xxxX|xxXx|xX..",meter:"4/4"},{raw:"Twis-ting the let-ters a-round till the an-swer shows",pat:".Xxx|XxxX|xxXx|.X..",meter:"4/4"}]},{key:"dh332",name:"Island bounce 3-3-2",tip:"The dancehall pulse is 3 + 3 + 2. Lean on those three hits and let the small words fall between.",section:"poly",bpm:103,sub:4,lines:[{raw:"Move your waist when the bass be-gin to roll",pat:"X.xX|xxXx|Xx..|..X.",meter:"4/4"},{raw:"Is-land heat with a bounce un-der e-very step",pat:"Xx.X|xxX.|Xx.X|x.X.",meter:"4/4"},{raw:"Sway it left, sway it right, then you dip it low",pat:"X.xX|..Xx|XxxX|x.X.",meter:"4/4"}]},{key:"offsing",name:"Sing it off the beat",tip:"A sung hook that leans on the in-between spots: the strong syllables sit on the e and the and, never on the 1. Float over the drums.",section:"poly",bpm:88,sub:4,lines:[{raw:"Drive through mid-night streets with the win-dow",pat:".X..|x.X.|x.Xx|xX.x",meter:"4/4"},{raw:"Fade in slow like sun on the wa-ter",pat:".X..|x.X.|x.Xx|xX.x",meter:"4/4"},{raw:"Hum it soft till ev-ery-thing's fine now",pat:".X..|x.X.|x.Xx|xX.x",meter:"4/4"}]},{key:"dispcell",name:"Cell on the beat",tip:"One strong syllable, then two quick ones: long, short-short. Four cells, every strong word right on the beat.",section:"poly",bpm:95,sub:4,lines:[{raw:"Bounce with the kick and the snare in the mid-dle now",pat:"X.xx|X.xx|X.xx|X.xx",meter:"4/4"},{raw:"Walk-ing a line with a weight on my back a-gain",pat:"X.xx|X.xx|X.xx|X.xx",meter:"4/4"},{raw:"Down in the base-ment we build-ing it up from scratch",pat:"X.xx|X.xx|X.xx|X.xx",meter:"4/4"}]},{key:"disp8",name:"Shift it an 8th",tip:"The same cell started an 8th late: two quick ones, then the strong word on the and. Every stress lands between the beats.",section:"poly",bpm:95,sub:4,lines:[{raw:"With a step, then a skip, then a hop, then a drop",pat:"xxX.|xxX.|xxX.|xxX.",meter:"4/4"},{raw:"Off the one, on the and, ev-ery stress in the gap",pat:"xxX.|xxX.|xxX.|xxX.",meter:"4/4"},{raw:"Let it lean, let it lag, let it lurch, let it land",pat:"xxX.|xxX.|xxX.|xxX.",meter:"4/4"}]},{key:"drill332",name:"Drill hats 3-3-2",tip:"Rap the drill hi-hat: two groups of 3-3-2 in one bar. Six hard words, every one on a hat hit.",section:"poly",bpm:75,sub:4,lines:[{raw:"Step back, slide, step back, glide",pat:"X..X|..X.|X..X|..X.",meter:"4/4"},{raw:"Hats roll, kick, hats roll, snare",pat:"X..X|..X.|X..X|..X.",meter:"4/4"},{raw:"Duck low, spin, duck low, win",pat:"X..X|..X.|X..X|..X.",meter:"4/4"}]},{key:"growcell",name:"Add a cell",tip:"Four quick syllables, a gap, then a pair. Every bar the pattern grows by one more pair, and the gaps keep it readable.",section:"poly",bpm:100,sub:4,lines:[{raw:"Seeds are sleep-ing, wak-ing",pat:"Xxxx|.Xx.|....|....",meter:"4/4"},{raw:"Roots are grow-ing, deep-er, strong-er",pat:"Xxxx|.Xx.|Xx..|....",meter:"4/4"},{raw:"Stems are ris-ing, green-er, tall-er, bloom-ing",pat:"Xxxx|.Xx.|Xx.X|x...",meter:"4/4"}]},{key:"evolve4",name:"Evolving pattern",tip:"One idea that keeps growing: four quick syllables, then pairs, one more pair each time. It runs over the bar lines and lands after four bars.",section:"poly",bpm:100,sub:4,lines:[{raw:"Start-ing small-er, grow-ing, add-ing",pat:"....|..Xx|xx.X|x.Xx",meter:"4/4"},{raw:"on top, lay-er, high-er, now it's get-ting big-ger",pat:"xx.X|x.Xx|.Xxx|x.Xx",meter:"4/4"},{raw:"long-er, wid-er, build it up and stack it, keep",pat:".Xx.|Xx.X|xxx.|Xx.X",meter:"4/4"},{raw:"it go-ing till it drops, the floor gives way",pat:"x.Xx|.Xx.|X.xX|.xX.",meter:"4/4"}]},{key:"halfbar",name:"Half-bar rhymes",tip:"Two short lines in one bar, seven syllables each, and both end on the same sound. Rhyme every two beats, breathe in the gap.",section:"poly",bpm:115,sub:4,lines:[{raw:"Dust the han-dle, find the print, cir-cle round the miss-ing hint",pat:"XxXx|XxX.|XxXx|XxX.",meter:"4/4"},{raw:"Ev-ery foot-step leaves a trace, ev-ery shad-ow has a face",pat:"XxXx|XxX.|XxXx|XxX.",meter:"4/4"},{raw:"Pull the file and check the time, line it up a-gainst the crime",pat:"XxXx|XxX.|XxXx|XxX.",meter:"4/4"}]},{key:"cad3364",name:"Phrases across the bar",tip:"Same 16 beats, cut 3 + 3 + 6 + 4. The lines end on beat 3, then beat 2, then run long, and only the last one meets the bar line again.",section:"poly",bpm:127,sub:4,lines:[{raw:"Short line, then a break, back in",pat:"X.X.|x.x.|X...|X.x.",meter:"4/4"},{raw:"a-gain, wait, this one runs a",pat:"x.X.|X...|x.X.|X.x.",meter:"4/4"},{raw:"lit-tle long-er, runs the bar",pat:"X.x.|X.x.|X.x.|X...",meter:"4/4"},{raw:"then the last one lands on four",pat:"x.x.|X.x.|X.x.|X...",meter:"4/4"}]},{key:"frm0",name:"Short-long threes",tip:"A short and a long, over and over: the cell is three 16ths, so it slides against the four beats. Lean on every long one.",section:"poly",bpm:85,sub:4,lines:[{raw:"I keep the beat a-live in-side my chest",pat:"xX.x|X.xX|.xX.|xX..",meter:"4/4"},{raw:"The mor-ning train is late a-gain to-day",pat:"xX.x|X.xX|.xX.|xX..",meter:"4/4"},{raw:"You hear the click and then you feel the step",pat:"xX.x|X.xX|.xX.|xX..",meter:"4/4"}]},{key:"frm1",name:"Start on the long",tip:"Same three-16th cell, but this bar starts in the middle of it: the 1 gets the long note. Feel how the cell no longer lines up with the bar.",section:"poly",bpm:85,sub:4,lines:[{raw:"Hold the line and keep it mov-ing, nev-er stop",pat:"X.xX|.xX.|xX.x|X.xX",meter:"4/4"},{raw:"Sun-day mor-ning, cof-fee black and pa-per thin",pat:"X.xX|.xX.|xX.x|X.xX",meter:"4/4"},{raw:"Count the sha-dows, step a-round them, keep the time",pat:"X.xX|.xX.|xX.x|X.xX",meter:"4/4"}]},{key:"frm2",name:"Start on the e",tip:"The third way in: rest on the 1, the cell starts on the e. Three bars, three starting points, one rhythm.",section:"poly",bpm:85,sub:4,lines:[{raw:"A-round the block the ci-ty hums a song",pat:".xX.|xX.x|X.xX|.xX.",meter:"4/4"},{raw:"Be-neath the bridge the ri-ver keeps its pace",pat:".xX.|xX.x|X.xX|.xX.",meter:"4/4"},{raw:"My pen is fast, my pa-per near-ly full",pat:".xX.|xX.x|X.xX|.xX.",meter:"4/4"}]},{key:"lcw1",name:"Victory lap",tip:"Live and loud: punch every stressed word, and land a two-syllable rhyme across beats 3 and 4.",section:"poly",bpm:73,sub:4,lines:[{raw:"Put the hours in and now we ce-leb-rate it",pat:"XxXx|.xXx|Xxx.|X...",meter:"4/4"},{raw:"E-very sin-gle night I sat a-lone and wai-ted",pat:"XxXx|XxXx|XxX.|X...",meter:"4/4"},{raw:"Look a-round the room we real-ly made it made it",pat:"XxXx|XxXx|XxX.|X...",meter:"4/4"}]},{key:"b4kdq",name:"Dotted quarters over three bars",tip:"One hit every six 16ths, each with a short tail: it does not fit a bar, so it lands somewhere new each bar and only comes home after three bars.",section:"poly",bpm:80,sub:4,lines:[{raw:"Kick drum, stomp-ing, lands on",pat:"Xx..|..Xx|....|Xx..",meter:"4/4"},{raw:"Shift-ing lat-er, each bar",pat:"..Xx|....|Xx..|..Xx",meter:"4/4"},{raw:"Then it comes home",pat:"....|Xx..|..Xx|....",meter:"4/4"}]},{key:"b4kick",name:"Kick cell, three-bar cycle",tip:"Quick-quick-long, then one more: a six-16th cell rapped like a kick pattern. It drifts across the bar line and lines up again after three bars.",section:"poly",bpm:75,sub:4,lines:[{raw:"Met-al in the base-ment, it's re-peat-ing as",pat:"Xxx.|x.Xx|x.x.|Xxx.",meter:"4/4"},{raw:"a cy-cle that won't fit in-to a bar, so",pat:"x.Xx|x.x.|Xxx.|x.Xx",meter:"4/4"},{raw:"I just ride it till it lines up a-gain",pat:"x.x.|Xxx.|x.Xx|x.x.",meter:"4/4"}]},{key:"b4meta2",name:"Meta-rhythm remix",tip:"Same 16ths again, new accent shapes: 1, the and of 2, 4; then only the and of 1 and 3; then every third 16th rolling over the beat.",section:"poly",bpm:80,sub:4,lines:[{raw:"Same old rhy-thm, but the em-pha-sis is chang-ing shape",pat:"Xxxx|xxXx|xxxx|X...",meter:"4/4"},{raw:"In the gaps I find the space to make the pat-tern breathe",pat:"xxXx|xxxx|xxXx|x...",meter:"4/4"},{raw:"Shift-ing it, lift-ing it, mov-ing it, prov-ing it, now",pat:"XxxX|xxXx|xXxx|X...",meter:"4/4"}]},{key:"b4n234",name:"Number code 2-3-4",tip:"Long syllables are 8ths, the short one is a 16th break: 2 long + short, 3 long + short, 4 long + short, again. The groups never fit the beat.",section:"poly",bpm:80,sub:4,lines:[{raw:"Slow down, then stretch it out and add a",pat:"X.x.|xX.x|.x.x|X.x.",meter:"4/4"},{raw:"fourth step, so two more, then three in a",pat:"x.x.|xX.x|.xX.|x.x.",meter:"4/4"},{raw:"row, then four long beats and two to go",pat:"xX.x|.x.x|.xX.|x.x.",meter:"4/4"}]},{key:"b4n2",name:"Long, long, short",tip:"Only the number 2: long, long, short = five 16ths. Every group starts one 16th earlier against the beat until the three bars close.",section:"poly",bpm:80,sub:4,lines:[{raw:"Pace off, then slide back, the line drifts, it falls",pat:"X.x.|xX.x|.xX.|x.xX",meter:"4/4"},{raw:"late, the beat waits, but five steps, and back",pat:".x.x|X.x.|xX.x|.xX.",meter:"4/4"},{raw:"home, then bars fold, so all three lines close",pat:"x.xX|.x.x|X.x.|xX..",meter:"4/4"}]},{key:"b4poly",name:"3 over 4, no reset",tip:"Every 16th filled, the stress on every third one, and it never resets: the stress walks across all three bars and only lands home at the end.",section:"poly",bpm:66,sub:4,lines:[{raw:"Do-ing too much and I know it, I'm pil-ing it, stack-ing it up",pat:"XxxX|xxXx|xXxx|XxxX",meter:"4/4"},{raw:"and the list of my plans keeps on grow-ing, I nev-er stop try-ing",pat:"xxXx|xXxx|XxxX|xxXx",meter:"4/4"},{raw:"to squeeze in a lit-tle bit more of the day, but the clock says no",pat:"xXxx|XxxX|xxXx|xXxx",meter:"4/4"}]},{key:"b4prun",name:"Let it run",tip:"The same three-beat rhythm with no rest: it starts one beat earlier every bar, the tension builds, and after three bars it is back on the 1.",section:"poly",bpm:80,sub:4,lines:[{raw:"Nev-er break, I let it flow, drift-ing off",pat:"X.xx|.xX.|x.X.|X.xx",meter:"4/4"},{raw:"the edge of time, ten-sion builds a-cross",pat:".xX.|x.X.|X.xx|.xX.",meter:"4/4"},{raw:"the bar, fi-nal-ly it falls in place",pat:"x.X.|X.xx|.xX.|x.X.",meter:"4/4"}]},{key:"sev16",name:"Sevens over four",tip:"A 7-step cell (three, rest, two, rest) runs over the 16ths, so its accent lands somewhere new every bar. Keep the stream even and lean on the first of each cell.",section:"poly",bpm:77,sub:4,lines:[{raw:"Turn-ing it o-ver, burn-ing the clock down, catch-ing",pat:"Xxx.|xx.X|xx.x|x.Xx",meter:"4/4"},{raw:"light, so the rhy-thm will drift but cy-cles come",pat:"x.xx|.Xxx|.xx.|Xxx.",meter:"4/4"},{raw:"round to sev-en a-gain, and nev-er the same twice",pat:"xx.X|xx.x|x.Xx|x.xx",meter:"4/4"}]},{key:"five16",name:"Fives over four",tip:"Groups of five 16ths (three, one, rest) against a bar of sixteen. Each bar starts the cell at a new spot, so count the fives, not the beat.",section:"poly",bpm:77,sub:4,lines:[{raw:"Mov-ing in fives, count-ing a-cross, sway-ing the bar, slide",pat:"Xxx.|xXxx|.xXx|x.xX",meter:"4/4"},{raw:"un-der the drum-line, it bends, trac-ing a curve, chas-ing",pat:"xx.x|Xxx.|xXxx|.xXx",meter:"4/4"},{raw:"down, and find-ing the one, tak-ing it slow, fol-low-ing",pat:"x.xX|xx.x|Xxx.|xXxx",meter:"4/4"}]},{key:"slick332",name:"3-3-2 in 16ths",tip:"Every 16th is filled, but the stresses fall 3, 3, 2, 3, 3, 2. The run stays smooth while the accents pull against the beat.",section:"poly",bpm:77,sub:4,lines:[{raw:"Prac-ti-cal, tac-ti-cal, smooth as sil-ver in mo-tion and flo-wing",pat:"XxxX|xxXx|XxxX|xxXX",meter:"4/4"},{raw:"Can-dle-light flic-ke-ring, slow it down and then speed it up quic-kly",pat:"XxxX|xxXx|XxxX|xxXX",meter:"4/4"},{raw:"Cor-ner by cor-ner I turn it shar-per than win-dows of crys-tal",pat:"XxxX|xxXx|XxxX|xxXX",meter:"4/4"}]},{key:"glt1",name:"Three-beat phrases",tip:"Every phrase is three beats long and ends on the same word, so it starts one beat earlier each time. After three bars (four phrases) it lines up with the 1 again.",section:"poly",bpm:85,sub:4,lines:[{raw:"Built in the heat for gold, dug through the",pat:"X.xx|X.xX|....|X.xx",meter:"4/4"},{raw:"dirt for gold, fought with the tide for gold",pat:"X.xX|....|X.xx|X.xX",meter:"4/4"},{raw:"gave up the sleep for gold",pat:"....|X.xx|X.xX|....",meter:"4/4"}]},{key:"flow5",name:"Flow in five",tip:"Polymetric: each phrase is five beats long over a four-beat bar. The rhyme lands on 1 in bar two and on 2 in bar three: it walks forward.",section:"poly",bpm:95,sub:4,lines:[{raw:"Five beats long, this phrase is spill-ing",pat:"X.x.|x.x.|x.x.|x.x.",meter:"4/4"},{raw:"out, now it starts one beat late",pat:"X...|X.x.|x.x.|x.x.",meter:"4/4"},{raw:"e-ven more, then a third one",pat:"x.x.|X...|X.x.|x.x.",meter:"4/4"}]},{key:"clave",name:"Clave pocket",tip:"Five words on the clave: three spread over beats 1 and 2, two on beats 3 and 4. The last bar flips it: two first, then three.",section:"poly",bpm:128,sub:4,lines:[{raw:"Feet move, hips sway, drop",pat:"X..X|..X.|..X.|X...",meter:"4/4"},{raw:"Three then two, keep time",pat:"X..X|..X.|..X.|X...",meter:"4/4"},{raw:"Now flip, two then three",pat:"..X.|X...|X..X|..X.",meter:"4/4"}]},{key:"quintmix",name:"Fives into 16ths",tip:"Five across beats 1 and 2, then straight 16ths on 3 and 4. Switch from floating to locked without rushing the change.",section:"poly",bpm:70,sub:20,lines:[{raw:"Lean-ing back slow-ly, then I'm pick-ing up the tem-po",pat:"{2}X.x.x.x.x.|Xxxx|Xxxx",meter:"4/4"},{raw:"Hang-ing in the air, now the six-teenths are com-ing in",pat:"{2}X.x.x.x.x.|Xxxx|Xxxx",meter:"4/4"},{raw:"Fives float a-cross two, then we split it four to a beat",pat:"{2}X.x.x.x.x.|Xxxx|Xxxx",meter:"4/4"}]},{key:"b6riff",name:"Stomp on the riff",tip:"Two-beat cells that stop dead on 2 and 4, like a heavy guitar riff that chugs and stops. Say both halves with the same shape.",section:"poly",bpm:95,sub:4,lines:[{raw:"Tune it low, let it ring",pat:"X.x.|X...|X.x.|X...",meter:"4/4"},{raw:"Hea-vy riff, hit the floor",pat:"X.x.|X...|X.x.|X...",meter:"4/4"},{raw:"Drop the string, feel it shake",pat:"X.x.|X...|X.x.|X...",meter:"4/4"}]},{key:"b6tres",name:"Afro tresillo",tip:"Six words in pairs: the stresses fall 3-3-2, 3-3-2 across the bar, the bounce of an afro drum pattern.",section:"poly",bpm:95,sub:4,lines:[{raw:"Warm sun, cool breeze, slow down",pat:"X..X|..X.|X..X|..X.",meter:"4/4"},{raw:"Hot sand, bare feet, step light",p
