<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>In The Pocket · Advanced Flow Game</title>
<meta name="description" content="A rhythm game for rappers: tap every syllable of 24 triplet flows onto the beat and land the stresses.">
<meta name="theme-color" content="#eceeea">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="fonts/jost.css">
<!--
  Flow game > Advanced (Bennie 2026-11-16): own vanilla port of his Lovable app "Pocket Rhythm Wordsmith" (In The Pocket):
  same layout, look and functions. Routes in the hash: #/ home, #/flow/<p-v>, #/studio, #/studio/<id>, #/calibrate.
  Storage: metrobar.advBest, metrobar.advSettings, metrobar.advFlows. No React, no Tailwind, no Google requests (Jost is self-hosted).
  Flow Studio: the user's own AI key from MetroBar (metrobar.ai) when there is one, else the built-in mapper (works offline).
-->
<style>
:root {
  --radius: .5rem;
  --background: oklch(94.7% .004 130);
  --foreground: oklch(15% .01 130);
  --card: oklch(91.2% .005 130);
  --primary: oklch(15% .01 130);
  --primary-foreground: oklch(98% 0 0);
  --secondary: oklch(87.5% .006 130);
  --muted: oklch(87.5% .006 130);
  --muted-foreground: oklch(42% .01 130);
  --accent: oklch(50.7% .203 29);
  --accent-foreground: oklch(98% 0 0);
  --destructive: oklch(50.7% .203 29);
  --border: oklch(0% 0 0 / .12);
  --input: oklch(0% 0 0 / .16);
  --ring: oklch(50.7% .203 29);
  --rest: oklch(36.5% .238 264);
  --lyric: oklch(15% .01 130);
  --lyric-foreground: oklch(98% 0 0);
  --grade-pocket: oklch(15% .01 130);
  --grade-great: oklch(50.7% .203 29);
  --grade-good: oklch(60% .14 160);
  --grade-miss: oklch(45% .15 29);
  --gradient-stage: linear-gradient(110deg, oklch(93% .004 130) 0%, oklch(94.7% .004 130) 45%, oklch(96.5% .003 130) 100%);
  --shadow-glow: 0 0 0 1px color-mix(in oklab, var(--primary) 40%, transparent), 0 12px 40px -12px color-mix(in oklab, var(--primary) 55%, transparent);
  --shadow-dot: 0 0 24px color-mix(in oklab, var(--accent) 55%, transparent);
  --font: "Jost", ui-sans-serif, system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; border: 0 solid var(--border); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--background); background-image: var(--gradient-stage); background-attachment: fixed; color: var(--foreground); font-family: var(--font); line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; cursor: pointer; padding: 0; }
h1, h2, h3, p, ol, dl, dd { margin: 0; padding: 0; }
ol { list-style: none; }
svg.i { width: 1rem; height: 1rem; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.fill { fill: currentColor; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

.fd { font-family: var(--font); font-weight: 800; text-transform: uppercase; letter-spacing: -.01em; }
.mut { color: var(--muted-foreground); }
.pri { color: var(--primary); }
.acc { color: var(--accent); }
.fg-c { color: var(--foreground); }
.kick { font-size: .875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted-foreground); }
.badge { background: var(--primary); color: var(--primary-foreground); padding: .25rem .75rem; }
.badge.sm { font-size: .875rem; }

main { min-height: 100vh; }
.wrap { margin: 0 auto; max-width: 72rem; padding: 0 1rem; }
.page { padding: 1.5rem 1rem; }
.col5 { margin: 0 auto; max-width: 64rem; }
.col3 { margin: 0 auto; max-width: 48rem; }
@media (min-width: 768px) { .wrap { padding: 0 2rem; } .page { padding: 2.5rem 2rem; } }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; white-space: nowrap; border-radius: .375rem; font-size: .875rem; font-weight: 500; transition: color .15s, background-color .15s, border-color .15s, transform .15s; height: 2.25rem; padding: 0 1rem; }
.btn svg.i { pointer-events: none; }
.btn:disabled { pointer-events: none; opacity: .5; cursor: not-allowed; }
.btn.hero { background: var(--primary); color: var(--primary-foreground); font-family: var(--font); font-weight: 800; text-transform: uppercase; letter-spacing: -.01em; font-size: 1rem; box-shadow: var(--shadow-glow); }
.btn.hero:hover { background: color-mix(in oklab, var(--primary) 90%, transparent); }
.btn.hero:active { transform: scale(.98); }
.btn.stage { border: 1px solid var(--border); background: color-mix(in oklab, var(--secondary) 60%, transparent); color: var(--foreground); }
.btn.stage:hover { background: var(--secondary); border-color: color-mix(in oklab, var(--primary) 50%, transparent); }
.btn.ghost:hover { background: var(--accent); color: var(--accent-foreground); }
.btn.sm { height: 2rem; padding: 0 .75rem; font-size: .75rem; }
.btn.lg { height: 2.5rem; padding: 0 2rem; }
.btn.xl { height: 3.5rem; padding: 0 2.5rem; font-size: 1.125rem; border-radius: .5rem; }
.btn.icon { width: 2.25rem; padding: 0; }
.btn.hero.xl, .btn.hero.lg { font-size: 1.125rem; }
.btn.hero.lg { font-size: 1rem; }

.card { border-radius: .75rem; border: 1px solid var(--border); background: color-mix(in oklab, var(--card) 60%, transparent); }
.card40 { border-radius: .75rem; border: 1px solid var(--border); background: color-mix(in oklab, var(--card) 40%, transparent); }
.card50 { border-radius: .75rem; border: 1px solid var(--border); background: color-mix(in oklab, var(--card) 50%, transparent); }
.glow { border-radius: .75rem; border: 1px solid color-mix(in oklab, var(--primary) 40%, transparent); background: var(--card); box-shadow: var(--shadow-glow); }
.pop { animation: .45s cubic-bezier(.2, 1.4, .4, 1) both pop; }
@keyframes pop { 0% { opacity: 0; transform: translateY(6px) scale(.7); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }
@keyframes beat-pulse { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 1s linear infinite; }

/* home */
.top { display: flex; align-items: center; justify-content: space-between; padding-top: 1.5rem; padding-bottom: 1.5rem; gap: 1rem; }
.nav { display: flex; align-items: center; gap: 1.25rem; font-size: .875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted-foreground); }
.nav a:hover, .back:hover { color: var(--primary); }
.hero-s { padding-top: 1.5rem; padding-bottom: 4rem; }
.demo { margin-top: 3.5rem; padding: 1.5rem .75rem; }
.hero-h { max-width: 56rem; font-size: 3rem; line-height: .95; }
.hero-p { margin-top: 1.25rem; max-width: 36rem; font-size: 1.125rem; color: var(--muted-foreground); }
.row { display: flex; flex-wrap: wrap; gap: .75rem; }
.steps { margin-top: 2.5rem; display: grid; gap: 1.5rem; }
.steps .n { font-size: .875rem; color: var(--primary); }
.steps .t { margin-top: .25rem; font-size: 1.125rem; }
.steps p { margin-top: .25rem; font-size: .875rem; color: var(--muted-foreground); }
.lv-grid { margin-top: 2rem; display: grid; gap: 1.25rem; }
.lv { padding: 1.25rem; }
.lv-hd { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; }
.lv-hd h3 { font-size: 1.5rem; line-height: 1.2; }
.lv-hd .grp { flex-shrink: 0; font-size: .875rem; font-weight: 600; color: var(--accent); }
.vars { margin-top: 1.25rem; display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem; }
.var { border-radius: .5rem; border: 1px solid var(--border); background: color-mix(in oklab, var(--secondary) 50%, transparent); padding: .625rem .75rem; transition: border-color .15s, background-color .15s; }
.var:hover { border-color: color-mix(in oklab, var(--primary) 60%, transparent); background: var(--secondary); }
.var .k { font-size: 1.125rem; line-height: 1.4; }
.var:hover .k { color: var(--primary); }
.var .s { font-size: .75rem; color: var(--muted-foreground); }
.stars { margin-top: .375rem; display: flex; gap: .125rem; }
.star { width: .875rem; height: .875rem; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linejoin: round; }
.star.on { fill: var(--primary); stroke: var(--primary); }
.foot { border-top: 1px solid var(--border); }
.foot .wrap { padding-top: 2rem; padding-bottom: 2rem; font-size: .875rem; color: var(--muted-foreground); }
@media (min-width: 640px) { .steps { grid-template-columns: repeat(2, 1fr); } .vars { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 768px) { .hero-s { padding-top: 3rem; } .demo { padding: 2rem 2.5rem; } .hero-h { font-size: 4.5rem; } .hero-p { font-size: 1.25rem; } .lv-grid { grid-template-columns: repeat(2, 1fr); } .lv { padding: 1.5rem; } }
@media (min-width: 1024px) { .steps { grid-template-columns: repeat(4, 1fr); } }

/* flow grid */
.fg { position: relative; width: 100%; user-select: none; -webkit-user-select: none; }
.g12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.fg-br { position: relative; height: 2.25rem; }
.fg.sm .fg-br { height: 1.5rem; }
.fg-br > div { position: relative; }
.fg-br .b { position: absolute; bottom: 0; height: .5rem; border-radius: 2px 2px 0 0; border: 2px solid var(--primary); border-bottom: 0; }
.fg-br span { position: absolute; left: 50%; transform: translateX(-50%); bottom: .625rem; font-size: .875rem; font-weight: 700; color: var(--primary); line-height: 1.25rem; }
.fg.sm .fg-br span { bottom: .5rem; font-size: 10px; line-height: 1rem; }
.fg-tri { height: 1.5rem; }
.fg.sm .fg-tri { height: 1rem; }
.fg-tri > div { display: flex; align-items: flex-end; justify-content: center; }
.fg-tri svg { width: 1rem; height: 1rem; color: var(--accent); }
.fg.sm .fg-tri svg { width: .625rem; height: .625rem; }
.fg-mid { position: relative; }
.fg-dots { height: 5rem; }
.fg.sm .fg-dots { height: 3rem; }
.fg-dots > div { position: relative; display: flex; align-items: center; justify-content: center; }
.fg-dots .bl { position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); }
.fg-dots .bl.one { width: 2px; background: var(--foreground); }
.fg-dots .bl.dot { border-left: 2px dotted color-mix(in oklab, var(--muted-foreground) 40%, transparent); }
.fg-dots .d { position: relative; border-radius: 9999px; transition: background-color .15s; width: clamp(14px, 4.2vw, 44px); height: clamp(14px, 4.2vw, 44px); }
.fg.sm .fg-dots .d { width: clamp(10px, 2.4vw, 22px); height: clamp(10px, 2.4vw, 22px); }
.d.rest { background: var(--rest); }
.d.rap { background: var(--accent); }
.d.g-pocket { background: var(--grade-pocket); }
.d.g-great { background: var(--grade-great); }
.d.g-good { background: var(--grade-good); }
.d.g-miss { background: color-mix(in oklab, var(--grade-miss) 70%, transparent); }
.d.act { animation: .25s ease-out both beat-pulse; box-shadow: var(--shadow-dot); }
.fg-lyr { border-radius: 3px; background: var(--lyric); color: var(--lyric-foreground); height: 2.75rem; }
.fg.sm .fg-lyr { height: 1.75rem; }
.fg-lyr > div { display: flex; align-items: center; justify-content: center; overflow: visible; white-space: nowrap; font-weight: 500; line-height: 1; font-size: clamp(10px, 1.9vw, 20px); }
.fg.sm .fg-lyr > div { font-size: clamp(8px, 1.1vw, 12px); }
.fg-lyr > div.act { font-weight: 800; }
.fg-head { pointer-events: none; position: absolute; top: -.25rem; bottom: 0; width: 2px; transform: translateX(-50%); background: color-mix(in oklab, var(--primary) 80%, transparent); }
.fg-cnt { margin-top: .5rem; height: 2rem; }
.fg.sm .fg-cnt { margin-top: .25rem; height: 1.25rem; }
.fg-cnt > div { display: flex; align-items: center; justify-content: center; font-weight: 700; color: color-mix(in oklab, var(--foreground) 80%, transparent); font-size: .875rem; }
.fg-cnt > div.beat { color: var(--primary); font-size: 1.5rem; }
.fg.sm .fg-cnt > div { font-size: 9px; }
.fg.sm .fg-cnt > div.beat { font-size: .875rem; }

/* player */
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1rem; }
.ph h1 { margin-top: .25rem; font-size: 2.25rem; line-height: 1.1; }
.ph h1 .sub { font-size: 1.5rem; color: var(--muted-foreground); }
.stats { display: flex; align-items: center; gap: 1.5rem; text-align: right; }
.stat .l { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted-foreground); }
.stat .v { font-size: 1.5rem; line-height: 2rem; }
.stagec { position: relative; margin-top: 1.5rem; padding: 1rem .75rem 1.25rem; }
.flash { pointer-events: none; position: absolute; left: 0; right: 0; top: .75rem; z-index: 10; display: flex; height: 2.5rem; justify-content: center; }
.flash .c { font-size: 2.25rem; color: var(--primary); line-height: 2.5rem; }
.flash .g { font-size: 1.875rem; line-height: 2.5rem; }
.flash .ms { margin-left: .5rem; vertical-align: middle; font-size: .875rem; font-weight: 600; text-transform: none; color: var(--muted-foreground); letter-spacing: 0; }
.t-pocket { color: var(--grade-pocket); } .t-great { color: var(--grade-great); } .t-good { color: var(--grade-good); } .t-miss { color: var(--grade-miss); } .t-extra { color: var(--muted-foreground); }
.sheet { margin-top: 1.25rem; display: grid; gap: .375rem; }
.sheet li { border-radius: .375rem; padding: .5rem .75rem; font-size: 1.125rem; font-weight: 500; font-style: italic; transition: background-color .15s, color .15s; color: color-mix(in oklab, var(--primary) 80%, transparent); }
.sheet.live li { color: color-mix(in oklab, var(--foreground) 45%, transparent); }
.sheet li.cur { background: var(--secondary); }
.sheet .ni { font-style: normal; }
.sheet .s { font-style: italic; }
.sheet .s.st { font-weight: 800; }
.ctl { margin-top: 1.5rem; }
.pads { display: grid; gap: .75rem; }
.pads.two { grid-template-columns: 1fr 1fr; }
.pad { display: flex; height: 8rem; flex-direction: column; align-items: center; justify-content: center; border-radius: .75rem; border: 2px solid color-mix(in oklab, var(--primary) 50%, transparent); background: color-mix(in oklab, var(--primary) 10%, transparent); color: var(--primary); touch-action: manipulation; user-select: none; -webkit-user-select: none; transition: transform 75ms; }
.pad:active, .pad.down { transform: scale(.97); background: var(--primary); color: var(--primary-foreground); }
.pad.ac { border-color: color-mix(in oklab, var(--accent) 60%, transparent); background: color-mix(in oklab, var(--accent) 15%, transparent); color: var(--accent); }
.pad.ac:active, .pad.ac.down { background: var(--accent); color: var(--accent-foreground); }
.pad .l { font-size: 2.25rem; line-height: 2.5rem; }
.pad .h { margin-top: .25rem; font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; opacity: .7; }
.stack { display: flex; flex-direction: column; gap: .75rem; }
.stopb { align-self: center; color: var(--muted-foreground); }
.listen { display: flex; align-items: center; justify-content: center; gap: 1rem; padding: 1.5rem 0; flex-wrap: wrap; }
.listen .i { width: 1.25rem; height: 1.25rem; color: var(--accent); }
.listen span { font-size: 1.125rem; color: var(--muted-foreground); }
.setc { display: grid; gap: 1.5rem; padding: 1.25rem; }
.setc.mt { margin-top: 1.25rem; }
.setg { display: grid; gap: 1.25rem; }
.tempo-h { display: flex; align-items: center; justify-content: space-between; }
.lbl { font-size: .875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted-foreground); }
.bpm { font-size: 1.25rem; color: var(--primary); }
.tip { font-size: .875rem; color: var(--muted-foreground); }
.cal-l { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
.cal-l:hover { text-decoration: underline; }
.playc { display: flex; flex-direction: column; justify-content: center; gap: .75rem; }
.hint { text-align: center; font-size: .75rem; color: var(--muted-foreground); }
.res { padding: 1.5rem; }
.res-t { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1.5rem; }
.res .bigstars { display: flex; gap: .25rem; }
.res .bigstars .star { width: 2rem; height: 2rem; }
.res .acc-n { margin-top: .5rem; font-size: 3.75rem; line-height: 1; }
.res .nb { font-size: .875rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--primary); }
.res .pk { font-size: 1.5rem; line-height: 2rem; color: var(--accent); }
.res .pkd { margin-top: .25rem; max-width: 20rem; font-size: .875rem; color: var(--muted-foreground); }
.res dl { display: grid; grid-template-columns: repeat(3, auto); gap: .5rem 1.5rem; font-size: .875rem; }
.res dt { font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.res dd { font-size: 1.25rem; line-height: 1.75rem; }
.res .acts { margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: .75rem; }

/* switch + slider */
.tg { display: flex; align-items: flex-start; gap: .75rem; cursor: pointer; }
.sw { position: relative; margin-top: .125rem; flex-shrink: 0; width: 2rem; height: 1.15rem; border-radius: 9999px; background: var(--input); transition: background-color .15s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: calc(1.15rem - 4px); height: calc(1.15rem - 4px); border-radius: 9999px; background: var(--background); box-shadow: 0 1px 2px rgb(0 0 0 / .2); transition: transform .15s; }
.tg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.tg input:checked + .sw { background: var(--primary); }
.tg input:checked + .sw::after { transform: translateX(.85rem); }
.tg input:focus-visible + .sw { outline: 2px solid var(--ring); outline-offset: 2px; }
.tg b { display: block; font-weight: 600; font-size: .875rem; color: var(--foreground); }
.tg small { margin-top: .125rem; display: block; font-size: .75rem; color: var(--muted-foreground); }
.rng { --p: 50%; margin-top: .75rem; width: 100%; height: 1rem; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; display: block; }
.rng::-webkit-slider-runnable-track { height: .375rem; border-radius: 9999px; background: linear-gradient(to right, var(--primary) var(--p), color-mix(in oklab, var(--primary) 20%, transparent) var(--p)); }
.rng::-moz-range-track { height: .375rem; border-radius: 9999px; background: color-mix(in oklab, var(--primary) 20%, transparent); }
.rng::-moz-range-progress { height: .375rem; border-radius: 9999px; background: var(--primary); }
.rng::-webkit-slider-thumb { -webkit-appearance: none; margin-top: -.3125rem; width: 1rem; height: 1rem; border-radius: 9999px; border: 1px solid color-mix(in oklab, var(--primary) 50%, transparent); background: var(--background); box-shadow: 0 1px 2px rgb(0 0 0 / .15); }
.rng::-moz-range-thumb { width: 1rem; height: 1rem; border-radius: 9999px; border: 1px solid color-mix(in oklab, var(--primary) 50%, transparent); background: var(--background); }
.rng:focus-visible { outline: none; }
.rng:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px color-mix(in oklab, var(--ring) 50%, transparent); }

/* studio */
.st-h { font-size: 3rem; line-height: .95; }
.lead { margin-top: .75rem; max-width: 42rem; font-size: 1.125rem; color: var(--muted-foreground); }
.form { margin-top: 2rem; padding: 1.25rem; }
.ta { margin-top: .75rem; display: block; width: 100%; min-height: 9rem; resize: vertical; border-radius: .375rem; border: 1px solid var(--input); background: color-mix(in oklab, var(--background) 60%, transparent); padding: .5rem .75rem; font: italic 1.125rem/1.5 var(--font); color: var(--foreground); box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
.ta::placeholder { color: var(--muted-foreground); }
.ta:focus-visible { outline: none; box-shadow: 0 0 0 1px var(--ring); }
.fmeta { margin-top: .75rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; }
.fmeta p { font-size: .875rem; color: var(--muted-foreground); }
.fmeta p.bad { color: var(--destructive); }
.lnk { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
.lnk:hover { text-decoration: underline; }
.err { margin-top: .75rem; border-radius: .375rem; border: 1px solid color-mix(in oklab, var(--destructive) 50%, transparent); background: color-mix(in oklab, var(--destructive) 10%, transparent); padding: .5rem .75rem; font-size: .875rem; }
.sug { margin-top: 2rem; padding: 1.25rem; }
.sug-t { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 1rem; }
.sug h2 { margin-top: .25rem; font-size: 1.875rem; line-height: 1.2; color: var(--primary); }
.sug .tipp { margin-top: .5rem; max-width: 42rem; color: var(--muted-foreground); }
.sug .warn { margin-top: .5rem; font-size: .875rem; color: var(--accent); }
.bars { margin-top: 1.5rem; display: grid; gap: 1.5rem; }
.bar-l { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted-foreground); }

      const beat = 60 / CALIBRATION.bpm, t0 = e.ctx.currentTime + 0.3, total = CALIBRATION.countIn + CALIBRATION.clicks;
      for (let i = 0; i < total; i++) { const counting = i < CALIBRATION.countIn; e.click(t0 + i * beat, counting || (i - CALIBRATION.countIn) % 4 === 0); }
      cal = { t0, latency: e.latency(), beat, clicks: Array.from({ length: CALIBRATION.clicks }, (_, j) => (CALIBRATION.countIn + j) * beat), taps: [], now: -0.3 };
      result = null; saved = false; phase = 'running'; drawAct(); drawRes(); raf = requestAnimationFrame(tick);
    }
    function tap(ts) {
      const c = cal; if (!c || phase !== 'running') return;
      const e = engine(), t = e.ctx.currentTime - Math.max(0, (performance.now() - ts) / 1000) - c.t0 - c.latency; e.tap(false);
      if (t < (CALIBRATION.countIn - 0.5) * c.beat) return; c.taps.push(t); drawStrip();
    }
    function drawStrip() {
      const c = cal, bar = $('[data-strip]'); bar.querySelectorAll('.tk').forEach(x => x.remove()); if (!c) return;
      const ds = c.taps.map(t => nearestDelta(t, c.clicks));
      ds.filter(d => Math.abs(d) * 1000 <= STRIP).forEach((d, i) => { const k = document.createElement('div'); k.className = 'tk'; k.style.left = (50 + d * 1000 * 50 / STRIP) + '%'; k.style.opacity = 0.4 + 0.6 * (i + 1) / ds.length; bar.append(k); });
    }
    function draw() {
      const c = cal, run = c && phase === 'running', bi = run ? Math.floor(c.now / c.beat + 0.02) : -1, counting = bi >= 0 && bi < CALIBRATION.countIn, measured = bi - CALIBRATION.countIn;
      const pulse = run && c.now >= 0 && c.now - Math.max(0, bi) * c.beat < 0.12;
      $('[data-ring]').classList.toggle('on', !!pulse);
      $('[data-rn]').textContent = !run ? '♩' : counting ? bi + 1 : measured >= 0 ? Math.min(measured + 1, CALIBRATION.clicks) : '';
      $('[data-rs]').textContent = run ? (counting ? 'Get ready…' : 'Tap on every click') : phase === 'done' ? 'Done' : CALIBRATION.bpm + ' BPM';
    }
    function drawAct() {
      const a = $('[data-act]');
      if (phase === 'running') { a.innerHTML = `<button type="button" class="pad calpad"><span class="fd l">Tap</span><span class="h">Space · F · J</span></button>`; const p = a.firstChild; p.addEventListener('pointerdown', e => { e.preventDefault(); p.classList.add('down'); setTimeout(() => p.classList.remove('down'), 90); tap(e.timeStamp); }); }
      else { a.innerHTML = `<div class="calgo"><button class="btn hero xl" type="button">${phase === 'done' ? ic('again') : ic('play', 'fill')} ${phase === 'done' ? 'Run it again' : 'Start calibration'}</button><p class="mut" style="font-size:.75rem">Tip: close your eyes and tap to the sound, not the circle.</p></div>`; a.querySelector('button').addEventListener('click', start); }
    }
    function drawRes() {
      const box = $('[data-res]'); if (phase !== 'done') { box.replaceChildren(); return; }
      const cur = settings().offsetMs;
      box.innerHTML = `<div class="glow calres pop">${result ? `<div class="fd big">${fmtMs(result.offsetMs)}</div><p class="mut" style="margin-top:.5rem">${result.offsetMs === 0 ? 'Your taps land right on the click — no correction needed.' : `Your taps register ${Math.abs(result.offsetMs)}ms ${result.offsetMs > 0 ? 'late' : 'early'} on this setup. Saving shifts scoring by that much.`} Based on ${result.used} taps, consistent within ±${result.spreadMs}ms.</p>
        ${result.spreadMs > 40 ? '<p class="acc" style="margin-top:.5rem;font-size:.875rem">Your taps were uneven — run it again for a steadier reading.</p>' : ''}
        <div class="row" style="margin-top:1rem"><button class="btn hero" type="button" data-save${saved && cur === result.offsetMs ? ' disabled' : ''}>${ic('save')} ${saved && cur === result.offsetMs ? 'Saved' : 'Save this delay'}</button></div>`
        : `<p class="fg-c">Not enough taps landed near the clicks (need ${CALIBRATION.minTaps}). Run it again and tap on every click.</p>`}</div>`;
      const s = box.querySelector('[data-save]'); if (s) s.addEventListener('click', () => { setSettings({ offsetMs: result.offsetMs }); saved = true; showSet(); drawRes(); });
    }
    const onKey = e => {
      if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key.toLowerCase(); if (![' ', 'f', 'j', 'enter'].includes(k)) return;
      const tag = e.target && e.target.tagName; if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;
      e.preventDefault(); if (phase === 'running') tap(e.timeStamp); else if (k === ' ' || k === 'enter') start();
    };
    window.addEventListener('keydown', onKey);
    showSet(); draw(); drawAct();
    cleanup = () => { window.removeEventListener('keydown', onKey); stopLoop(); try { if (E) E.stopRun(); } catch (e) {} };
  }

  /* ---------- router ---------- */
  function route() {
    if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
    const h = location.hash.replace(/^#/, '');
    let m;
    if (h === 'levels') { viewHome(); document.getElementById('levels').scrollIntoView(); return; }
    if ((m = /^\/flow\/([\w-]+)$/.exec(h))) viewFlow(m[1]);
    else if ((m = /^\/studio\/(.+)$/.exec(h))) viewCustom(decodeURIComponent(m[1]));
    else if (h === '/studio' || h === '/studio/') viewStudio();
    else if (h === '/calibrate') viewCalibrate();
    else viewHome();
    if (h !== 'levels') window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
  window.ADV = { engine, PATTERNS, localSuggest, splitWord, route };
})();
</script>
</body>
</html>
